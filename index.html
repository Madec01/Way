<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07080d">
<title>WAY</title>
<!-- Fichier généré par dev/build.js : ne pas éditer directement, éditer dev/*.js puis `node dev/build.js`. -->
<style>
:root{--bg:#07080d;--panel:rgba(16,20,34,.72);--line:rgba(110,231,255,.22);--text:#e8ecf7;--muted:#9aa4c4;--accent:#6ee7ff;--gold:#ffd166;--danger:#ff5e7a;--good:#7fff9a;--ui-scale:1}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;overflow:hidden;user-select:none;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;display:block;background:#07080d;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:fixed;pointer-events:none;overflow:hidden}
#ui.active{pointer-events:auto}
#ui .screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(24px*var(--ui-scale));font-size:calc(14px*var(--ui-scale));overflow:auto;background:rgba(4,5,9,.55);backdrop-filter:blur(3px)}
#ui .screen[hidden]{display:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.4em 1.6em;box-shadow:0 0 40px rgba(110,231,255,.08),inset 0 0 0 1px rgba(255,255,255,.03);backdrop-filter:blur(10px)}
.panel.center{max-width:56em;text-align:center}
.eyebrow{font-size:.78em;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);opacity:.85}
h1.title{font-size:3.4em;margin:.1em 0 .2em;letter-spacing:.08em;text-shadow:0 0 24px rgba(110,231,255,.5)}
h2{margin:.2em 0 .4em;font-size:1.6em}
h3{margin:.8em 0 .4em;font-size:1em;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--muted)} .small{font-size:.9em} .tiny{font-size:.78em} .good{color:var(--good)} .bad{color:var(--danger)}
.synopsis{max-width:40em;margin:0 auto 1.2em;line-height:1.45}
.row{display:flex;gap:.8em;justify-content:center;align-items:center;flex-wrap:wrap;margin:.8em 0}
.row.small{gap:.5em;margin:.4em 0}
.btn{font:inherit;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:.55em 1.1em;cursor:pointer;transition:all .12s;letter-spacing:.03em}
.btn:hover:not([disabled]){background:rgba(110,231,255,.14);border-color:var(--accent);box-shadow:0 0 18px rgba(110,231,255,.25)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.primary{background:rgba(110,231,255,.18);border-color:var(--accent)}
.btn.big{font-size:1.15em;padding:.7em 1.6em}
.btn.small{font-size:.8em;padding:.35em .7em}
.btn.ghost{background:transparent}
.tag{display:inline-block;font-size:.7em;padding:.1em .5em;border:1px solid var(--line);border-radius:6px;color:var(--muted);vertical-align:middle;letter-spacing:.05em;text-transform:uppercase}
.tag.test{color:var(--gold);border-color:var(--gold)}
.cards{display:flex;gap:.8em;flex-wrap:wrap;justify-content:center}
.cards.vertical{flex-direction:column}
.card{background:rgba(10,13,24,.7);border:1px solid var(--line);border-radius:12px;padding:.8em 1em;min-width:14em;max-width:20em;text-align:left;transition:all .12s;position:relative}
.card.pick,.card.upg,.card.char{cursor:pointer}
.card.pick:hover,.card.upg:hover,.card.char:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 0 18px rgba(110,231,255,.2)}
.card.selected{border-color:var(--gold);box-shadow:0 0 22px rgba(255,209,102,.35)}
.card.locked{opacity:.75}
.card.maxed{border-color:rgba(127,255,154,.4)}
.cardtitle{font-weight:700;margin-bottom:.25em;display:flex;justify-content:space-between;align-items:center;gap:.5em}
.card .desc{margin:.3em 0;line-height:1.35}
.card.upg{min-width:16em;max-width:18em;border-color:var(--rc);box-shadow:0 0 22px var(--rg),inset 0 0 0 1px rgba(255,255,255,.03)}
.card.upg .rarity{font-size:.72em;letter-spacing:.2em;text-transform:uppercase;color:var(--rc);font-weight:700}
.card.upg .key{position:absolute;top:.5em;right:.6em;font-size:.75em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 .4em}
.card.r-colossal{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 22px var(--rg)}50%{box-shadow:0 0 38px var(--rg)}}
.trait{margin:.4em 0;font-size:.85em;line-height:1.35}
.pill{display:inline-block;font-size:.78em;padding:.15em .5em;border:1px solid var(--rc);color:var(--rc);border-radius:8px;margin:.15em}
.pair{display:flex;gap:1em;justify-content:space-between;font-size:.85em;margin:.15em 0}
.pair.big{font-size:1em;justify-content:flex-start;align-items:baseline}
.pairs{margin-top:.5em}
.hub{display:grid;grid-template-columns:24em 1fr;grid-template-rows:auto 1fr;gap:1em;width:100%;height:100%;max-width:90em}
.hubbar{grid-column:1/3;display:flex;justify-content:space-between;align-items:center;padding:.8em 1.2em}
.coins{font-size:1.3em;color:var(--gold);font-weight:700}
.hub .col{overflow:auto;display:flex;flex-direction:column;gap:.4em}
.hub .col.left .card{max-width:none;min-width:0}
.tabs{display:flex;gap:.4em;margin-bottom:.6em}
.tab{font:inherit;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:.35em .9em;cursor:pointer}
.tab.on{color:var(--text);background:rgba(110,231,255,.14);border-color:var(--accent)}
.shop{display:flex;flex-wrap:wrap;gap:.6em;align-content:flex-start}
.shop .card{min-width:15em;max-width:19em;flex:1 1 15em}
.tier{font-size:.8em;color:var(--gold);letter-spacing:.1em}
.prep{max-width:80em;max-height:100%;overflow:auto}
.prep .passives{margin:.4em 0 .6em}
.choice{max-width:80em}
.grid2{display:grid;grid-template-columns:1fr auto;gap:.3em 1.5em;text-align:left;margin:1em auto;max-width:40em}
.sliders{display:flex;flex-direction:column;gap:.4em;margin:.8em auto;max-width:22em;text-align:left}
.sliders label{display:flex;justify-content:space-between;align-items:center;gap:1em;font-size:.9em}
.upglist{margin:.6em 0}
.credits p{text-align:left;line-height:1.4}
#debug{position:fixed;right:12px;top:12px;width:400px;max-height:calc(100vh - 24px);overflow:auto;background:rgba(8,10,18,.92);border:1px solid var(--line);border-radius:12px;padding:.8em;font-size:12px;color:var(--text);z-index:20;font-family:ui-monospace,Menlo,Consolas,monospace}
#debug[hidden]{display:none}
#debug .dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4em}
#debug label{display:flex;align-items:center;gap:.4em;margin:.25em 0}
#debug input[type=range]{flex:1}
#debug select{font:inherit;background:#0b0d14;color:var(--text);border:1px solid var(--line);border-radius:6px;max-width:150px}
#debug .drow{display:flex;gap:.4em;flex-wrap:wrap;align-items:center;margin:.3em 0}
#debug .chk{margin-right:.4em}
#debug .dout{white-space:pre-wrap;background:#000;padding:.4em;border-radius:6px;max-height:140px;overflow:auto;margin:.4em 0}
#debug .abtns{display:flex;flex-wrap:wrap;gap:.25em;margin:.4em 0}

/* ---- tactile ---- */
#touch{position:fixed;overflow:hidden;z-index:5;touch-action:none}
#touch[hidden]{display:none}
#touch .tzone{position:absolute;left:0;top:0;width:55%;height:100%;touch-action:none}
#touch .tstick{position:absolute;width:calc(140px*var(--ui-scale));height:calc(140px*var(--ui-scale));margin:calc(-70px*var(--ui-scale)) 0 0 calc(-70px*var(--ui-scale));border-radius:50%;border:2px solid rgba(110,231,255,.35);background:rgba(16,20,34,.35);pointer-events:none}
#touch .tstick[hidden]{display:none}
#touch .tknob{position:absolute;left:50%;top:50%;width:calc(56px*var(--ui-scale));height:calc(56px*var(--ui-scale));border-radius:50%;background:rgba(110,231,255,.55);box-shadow:0 0 18px rgba(110,231,255,.5);transform:translate(-50%,-50%)}
#touch .tbtn{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(16,20,34,.55);color:#fff;font:700 calc(15px*var(--ui-scale)) "Segoe UI",system-ui,sans-serif;letter-spacing:.05em;backdrop-filter:blur(4px);touch-action:none;user-select:none;-webkit-user-select:none}
#touch .tbtn.on{background:rgba(110,231,255,.45);border-color:#6ee7ff;box-shadow:0 0 22px rgba(110,231,255,.6)}
#touch .tbtn.fire{right:calc(28px*var(--ui-scale));bottom:calc(40px*var(--ui-scale));width:calc(120px*var(--ui-scale));height:calc(120px*var(--ui-scale));border-color:rgba(255,209,102,.6)}
#touch .tbtn.fire.on{background:rgba(255,209,102,.45);border-color:#ffd166;box-shadow:0 0 22px rgba(255,209,102,.6)}
#touch .tbtn.skill{right:calc(160px*var(--ui-scale));bottom:calc(70px*var(--ui-scale));width:calc(86px*var(--ui-scale));height:calc(86px*var(--ui-scale));border-color:rgba(127,255,154,.6)}
#touch .tbtn.act{right:calc(70px*var(--ui-scale));bottom:calc(180px*var(--ui-scale));width:calc(62px*var(--ui-scale));height:calc(62px*var(--ui-scale))}
#touch .tbtn.pause{right:calc(16px*var(--ui-scale));top:calc(56px*var(--ui-scale));width:calc(44px*var(--ui-scale));height:calc(44px*var(--ui-scale));font-size:calc(13px*var(--ui-scale))}
body.touch #ui .screen{font-size:calc(15px*var(--ui-scale))}
body.touch .btn{padding:.7em 1.3em}
#ui .screen{touch-action:pan-y}
#ui .screen .panel{touch-action:pan-y;max-height:100%;overflow:auto}
body.touch #ui .screen{padding:calc(10px*var(--ui-scale));align-items:flex-start}
body.touch .cards .card{min-width:11em;max-width:15em;padding:.55em .7em;font-size:.92em}
body.touch .prep h2{font-size:1.2em}
body.touch .prep .passives .tiny{display:none}
#touch .tbtn.fs{right:calc(68px*var(--ui-scale));top:calc(56px*var(--ui-scale));width:calc(44px*var(--ui-scale));height:calc(44px*var(--ui-scale));font-size:calc(16px*var(--ui-scale))}

/* ================= Direction artistique : menu et hub ================= */
@font-face{font-family:"Silkscreen";src:url("assets/fonts/Silkscreen-Regular.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Pixelify Sans";src:url("assets/fonts/PixelifySans-Regular.ttf") format("truetype");font-display:swap}
@font-face{font-family:"VT323";src:url("assets/fonts/VT323-Regular.ttf") format("truetype");font-display:swap}
#ui #screen-menu,#ui #screen-hub{background:transparent;backdrop-filter:none;padding:0;align-items:stretch;justify-content:stretch}
.stamp{display:inline-flex;gap:.6em;align-items:center;font-family:"Pixelify Sans","Segoe UI",sans-serif;font-size:.85em;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);opacity:.85;border:1px solid rgba(110,231,255,.35);padding:.3em .8em;border-radius:4px;background:rgba(8,10,18,.55)}
.stamp .sep{opacity:.5}
/* ---- menu ---- */
.menuscreen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding:calc(20px*var(--ui-scale)) calc(48px*var(--ui-scale)) calc(12px*var(--ui-scale))}
.menuscreen.splash{justify-content:center;gap:calc(20px*var(--ui-scale))}
.menuscreen.main{justify-content:flex-start;gap:calc(12px*var(--ui-scale))}
.menuscreen .titlebox{text-align:center;animation:titleIn 1.1s cubic-bezier(.2,.9,.2,1) both}
/* passage écran-titre → menu : le titre monte et rétrécit au lieu de disparaître */
.menuscreen.main .titlebox{animation:titleRise .8s cubic-bezier(.2,.9,.2,1) both}
.menuscreen.main .bigtitle{font-size:calc(76px*var(--ui-scale))}
.menuscreen.splash{gap:calc(24px*var(--ui-scale))}
/* bandeau et pied de page ancrés : le bloc titre peut alors être vraiment centré sur l'écran-titre */
.menuscreen .stamp{position:absolute;top:calc(20px*var(--ui-scale));left:50%;transform:translateX(-50%)}
.menuscreen .menufoot{position:absolute;left:calc(48px*var(--ui-scale));right:calc(48px*var(--ui-scale));bottom:calc(12px*var(--ui-scale))}
.menuscreen.main .titlebox{margin-top:calc(46px*var(--ui-scale))}
@keyframes titleRise{from{transform:translateY(20vh) scale(1.5);opacity:.2}to{transform:none;opacity:1}}
.bigtitle{font-family:"Silkscreen","Segoe UI",sans-serif;font-size:calc(120px*var(--ui-scale));line-height:.95;letter-spacing:.06em;margin:.2em 0 .1em;position:relative;text-align:center;color:#f4f7ff;text-shadow:0 0 12px rgba(110,231,255,.65),0 0 42px rgba(110,231,255,.35),4px 4px 0 #0b1230;animation:flicker 7s 2s infinite}
/* le W dore et grossit sur le temps fort de chaque mesure */
.bigtitle .accent{display:inline-block;color:#ffb347;transform:scale(calc(1 + .07*var(--down)));text-shadow:0 0 calc(12px + 26px*var(--down)) rgba(255,179,71,calc(.7 + .3*var(--down))),0 0 44px rgba(255,154,60,.4),4px 4px 0 #2a1608}
/* calque fantôme : décalé sur les contretemps (--gx), réaligné sur le temps fort */
.bigtitle::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;text-align:center;color:rgba(110,231,255,.32);clip-path:inset(0 0 55% 0);transform:translateX(var(--gx));pointer-events:none;mix-blend-mode:screen}
.tagline{font-family:"VT323","Segoe UI",monospace;font-size:calc(26px*var(--ui-scale));color:var(--muted);letter-spacing:.08em;animation:fadeUp .9s .3s both}
@keyframes titleIn{from{opacity:0;transform:translateY(18px) scale(.98);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flicker{0%,93%,100%{opacity:1}94%{opacity:.75}95%{opacity:1}97%{opacity:.6}98%{opacity:1}}
@keyframes glitch{0%,88%,100%{opacity:0}89%{opacity:1;transform:translate(-6px,0);clip-path:inset(10% 0 60% 0)}91%{opacity:1;transform:translate(5px,0);clip-path:inset(50% 0 20% 0)}93%{opacity:0}}
.menunav{display:flex;flex-direction:column;gap:calc(7px*var(--ui-scale));align-self:center;width:100%;max-width:calc(520px*var(--ui-scale));margin-top:calc(10px*var(--ui-scale))}
.mbtn{display:grid;grid-template-columns:2.6em 1fr;grid-template-rows:auto auto;column-gap:.6em;align-items:center;text-align:left;font:inherit;color:var(--text);background:linear-gradient(90deg,rgba(16,20,34,.72),rgba(16,20,34,.35));border:1px solid rgba(110,231,255,.18);border-left:3px solid rgba(110,231,255,.35);border-radius:6px;padding:.55em 1em;cursor:pointer;position:relative;overflow:hidden;transition:transform .18s,border-color .15s,background .2s,opacity .3s;opacity:0;transform:translateY(12px)}
.mbtn.on{opacity:1;transform:none}
.mbtn .k{grid-row:1/3;font-family:"Silkscreen",monospace;font-size:.85em;color:var(--accent);opacity:.8}
.mbtn .l{font-family:"Pixelify Sans","Segoe UI",sans-serif;font-size:1.35em;letter-spacing:.06em}
.mbtn .d{font-size:.78em;color:var(--muted)}
.mbtn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(110,231,255,.28),rgba(110,231,255,0));transition:width .25s}
.mbtn.on:hover,.mbtn.on:focus{outline:none;transform:scale(1.028);border-color:var(--accent);border-left-color:#fff;box-shadow:0 0 22px rgba(110,231,255,.25)}
/* halo de projecteur sur le bouton actif */
.mbtn::after{content:"";position:absolute;inset:-60% -12%;background:radial-gradient(ellipse at 14% 50%,rgba(110,231,255,.22),rgba(110,231,255,0) 62%);opacity:0;transition:opacity .2s;pointer-events:none}
.mbtn.on:hover::after,.mbtn.on:focus::after{opacity:1}
.mbtn.primary::after{background:radial-gradient(ellipse at 14% 50%,rgba(255,179,71,.24),rgba(255,179,71,0) 62%)}
/* validé : le bouton s'allume et attend la mesure suivante pour agir */
.mbtn.armed{opacity:1;transform:none;border-color:#fff;box-shadow:0 0 calc(16px + 30px*var(--beat)) rgba(255,255,255,calc(.2 + .4*var(--beat)))}
.mbtn.on:hover::before,.mbtn.on:focus::before,.mbtn.armed::before{width:100%}
.mbtn.primary{border-left-color:#ffb347}.mbtn.primary .k{color:#ffb347}
.mbtn.primary.on:hover,.mbtn.primary.on:focus{border-color:#ffb347;box-shadow:0 0 22px rgba(255,179,71,.3)}
.mbtn.primary::before{background:linear-gradient(90deg,rgba(255,179,71,.28),rgba(255,179,71,0))}
.mbtn.ghost{opacity:.7}
.menufoot{display:flex;justify-content:space-between;align-items:flex-end;gap:2em;color:var(--muted);font-family:"VT323",monospace;font-size:calc(18px*var(--ui-scale));animation:fadeUp .8s .9s both;white-space:nowrap;overflow:hidden}
.menufoot .hint{overflow:hidden;text-overflow:ellipsis}
/* ---- histoire / intro ---- */
.storybox,.introbox{position:absolute;inset:0;margin:auto;max-width:calc(1040px*var(--ui-scale));max-height:calc(100% - 40px*var(--ui-scale));overflow:auto;background:rgba(8,10,18,.82);border:1px solid var(--line);border-radius:14px;padding:1.4em 2em;box-shadow:0 0 60px rgba(0,0,0,.6);backdrop-filter:blur(8px);height:fit-content}
.storytitle{font-family:"Pixelify Sans","Segoe UI",sans-serif;font-size:2em;margin:.3em 0 .2em;letter-spacing:.04em}
.storycols{display:grid;grid-template-columns:1fr 1fr;gap:1.5em}
.storycol p{line-height:1.5;margin:.2em 0 .8em}
.storycol h3{margin:.4em 0 .2em}
.r-common{color:#cfd6e6}.r-rare{color:#4fb3ff}.r-epic{color:#b46bff}.r-colossal{color:#ffb347}
.fraglist{display:flex;flex-direction:column;gap:.3em}
.frag{border:1px solid var(--line);border-radius:8px;padding:.4em .8em;background:rgba(10,13,24,.6)}
.frag summary{cursor:pointer;font-weight:600}
.frag.locked summary{color:var(--muted);cursor:default}
.fragtext{margin:.5em 0 .2em;line-height:1.45;font-family:"VT323",monospace;font-size:1.25em;color:#dfe6ff}
.introbox{max-width:calc(760px*var(--ui-scale));font-family:"VT323",monospace;font-size:calc(26px*var(--ui-scale))}
.introtext{min-height:8em;margin:1em 0}
.introtext p{margin:.3em 0;line-height:1.35}
.introtext p::after{content:"▌";animation:blink 1s steps(1) infinite;color:var(--accent)}
.introtext p:not(:last-child)::after{content:""}
@keyframes blink{50%{opacity:0}}
/* ---- hub ---- */
.hub2{position:absolute;inset:0;display:grid;grid-template-columns:minmax(16em,22em) minmax(18em,1fr) minmax(20em,30em);grid-template-rows:auto 1fr;gap:calc(12px*var(--ui-scale));padding:calc(16px*var(--ui-scale)) calc(24px*var(--ui-scale));box-sizing:border-box}
.hubhead{grid-column:1/4;display:flex;justify-content:space-between;align-items:center;gap:1em;background:rgba(8,10,18,.6);border:1px solid var(--line);border-radius:12px;padding:.6em 1.2em;backdrop-filter:blur(6px);animation:fadeUp .5s both}
.hubid{display:flex;flex-direction:column;gap:.3em}
.intercom{font-family:"VT323",monospace;font-size:1.35em;color:#dfe6ff}
.hubcoins{text-align:right}.hubcoins .big{font-family:"Silkscreen",monospace;font-size:1.5em;color:var(--gold);text-shadow:0 0 14px rgba(255,209,102,.5)}
.hubactions{display:flex;gap:.4em}
.hubcol{background:rgba(8,10,18,.62);border:1px solid var(--line);border-radius:12px;padding:.9em 1em;overflow:auto;backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:.5em;animation:fadeUp .6s .1s both}
.hubcol.center{animation-delay:.2s}.hubcol.shopcol{animation-delay:.3s}
.hubcol h3{margin:.4em 0 .2em}
.portraitbox{display:flex;gap:.8em;align-items:center}
.portrait{width:calc(96px*var(--ui-scale));height:calc(140px*var(--ui-scale));flex:none;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(circle at 50% 70%,rgba(110,231,255,.25),rgba(110,231,255,0) 70%);border:1px solid rgba(110,231,255,.25);border-radius:10px}
.portrait-canvas{image-rendering:pixelated;width:calc(80px*var(--ui-scale));height:auto;margin-bottom:8px;filter:drop-shadow(0 0 10px rgba(110,231,255,.5))}
.subjname{font-family:"Pixelify Sans","Segoe UI",sans-serif;font-size:1.4em;letter-spacing:.04em}
.hubcol .card{max-width:none;min-width:0}
.card.mini{padding:.5em .8em}
.card.level.selected{border-color:#ffb347;box-shadow:0 0 24px rgba(255,179,71,.3)}
.cta{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:.2em;font:inherit;color:#0b0d14;background:linear-gradient(90deg,#ffd166,#ffb347);border:0;border-radius:10px;padding:.8em 1.2em;cursor:pointer;text-align:left;box-shadow:0 0 26px rgba(255,179,71,.35);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}

<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="ui"></div>
<div id="touch" hidden></div>
<div id="debug" hidden></div>
<div id="atelier" hidden></div>
<script>
/* ==== 00_core.js ==== */
/* =========================================================================
   SALLE ZÉRO — 00_core.js
   Constantes, utilitaires, PRNG seedable, Input, Time, Engine (boucle à pas fixe).
   ========================================================================= */
'use strict';

const W = 1280, H = 720;            // résolution logique
const TILE = 48;                    // tuile en px (sprites 16 px rendus ×3)
const ROOM_COLS = 24, ROOM_ROWS = 13;
const ROOM_X = (W - ROOM_COLS * TILE) / 2;   // 64
const ROOM_Y = (H - ROOM_ROWS * TILE) / 2;   // 48
const ROOM_W = ROOM_COLS * TILE, ROOM_H = ROOM_ROWS * TILE;
const FIXED_DT = 1 / 60;

const RARITY = {
  common:   { label: 'Commun',   color: '#cfd6e6', glow: 'rgba(207,214,230,.35)', weight: 60 },
  rare:     { label: 'Rare',     color: '#4fb3ff', glow: 'rgba(79,179,255,.45)',  weight: 27 },
  epic:     { label: 'Épique',   color: '#b46bff', glow: 'rgba(180,107,255,.5)',  weight: 10 },
  colossal: { label: 'Colossal', color: '#ffb347', glow: 'rgba(255,179,71,.6)',   weight: 3 },
};
const RARITY_ORDER = ['common', 'rare', 'epic', 'colossal'];

const ROOM_TYPES = {
  PREP_COMBAT: { label: 'Préparation + Combat', phase: 1 },
  TRAP: { label: 'Pièges', phase: 1 },
  COMBAT_CHALLENGE: { label: 'Salle aléatoire', phase: 1 },
  COMBAT_TEMPO: { label: 'Salle du tempo', phase: 2 },
  COMBAT_TRAP: { label: 'Combat + Pièges', phase: 1 },
  CHEST: { label: 'Coffre', phase: 1 },
  MINIBOSS: { label: 'Mini-boss', phase: 1 },
  COMBAT_MODULAR: { label: 'Combat + Modulaire', phase: 2 },
  COMBAT_TRAP_MODULAR: { label: 'Combat + Pièges + Modulaire', phase: 2 },
  CHEST_FINAL: { label: 'Coffre final', phase: 2 },
  BOSS_REVENGE: { label: 'Revanche', phase: 2 },
};

/* ---------- Utilitaires ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const angleTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const TAU = Math.PI * 2;
const wrapAngle = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const tileX = tx => ROOM_X + (tx + 0.5) * TILE;   // centre de la tuile en px
const tileY = ty => ROOM_Y + (ty + 0.5) * TILE;
const deepClone = o => JSON.parse(JSON.stringify(o));
const fmt = n => Math.round(n).toLocaleString('fr-FR');
const pct = n => `${n >= 0 ? '+' : ''}${Math.round(n * 100)} %`;

/* Cercle vs AABB */
function circleRect(cx, cy, r, rx, ry, rw, rh) {
  const nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh);
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < r * r;
}
/* Segment (ax,ay)-(bx,by) vs cercle */
function segCircle(ax, ay, bx, by, cx, cy, r) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((cx - ax) * dx + (cy - ay) * dy) / l2 : 0; t = clamp(t, 0, 1);
  const px = ax + dx * t, py = ay + dy * t;
  return (px - cx) ** 2 + (py - cy) ** 2 < r * r;
}

/* ---------- PRNG seedable (mulberry32) ---------- */
function makeRng(seed) {
  let s = (seed >>> 0) || 0x9e3779b9;
  const rng = () => { s += 0x6D2B79F5; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  rng.range = (a, b) => a + rng() * (b - a);
  rng.int = (a, b) => Math.floor(rng.range(a, b + 1));
  rng.pick = arr => arr[Math.floor(rng() * arr.length)];
  rng.chance = p => rng() < p;
  rng.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  rng.reseed = v => { s = (v >>> 0) || 1; };
  return rng;
}
const RNG = makeRng(Date.now() & 0xffffffff);   // RNG de gameplay (reseedé par __autoplay)
const VFX_RNG = makeRng(1234);                 // RNG cosmétique, jamais reseedé

/* ---------- Chaînes UI (français, centralisées) ---------- */
const STR = {
  room: 'Salle', level: 'Niveau', xp: 'XP', hp: 'PV', coins: 'Crédits', quality: 'Qualité',
  chooseWeapon: 'Choisis ton arme', chooseSkill: 'Choisis une compétence', enter: 'Entrer',
  levelUp: 'Montée de niveau', pick: 'Choisir', chest: 'Réserve de greffes', continue: 'Continuer',
  paused: 'Pause', resume: 'Reprendre', quit: 'Abandonner la run', dead: 'Sujet perdu',
  toHub: 'Retour au hub', victory: 'Protocole terminé', pending: 'en attente',
  wave: 'Vague', boss: 'Mini-boss', ready: 'Prêt', interact: 'E : interagir',
};

/* ---------- Caméra (zoom + suivi du joueur ; le HUD n'est pas affecté) ---------- */
const Camera = {
  x: W / 2, y: H / 2, zoom: 1, pulse: 0,   // pulse : impulsion de zoom (salle du tempo), remise à 0 à chaque salle
  snap(x, y) { this.x = x; this.y = y; this.clamp(); },
  follow(x, y, dt) { const k = Math.min(1, 6 * dt); this.x = lerp(this.x, x, k); this.y = lerp(this.y, y, k); this.clamp(); },
  clamp() { const v = Engine.view; const hw = v.w / (2 * this.zoom), hh = v.h / (2 * this.zoom); this.x = hw >= W / 2 ? W / 2 : clamp(this.x, hw, W - hw); this.y = hh >= H / 2 ? H / 2 : clamp(this.y, hh, H - hh); },
  apply(ctx) { const z = this.zoom * (1 + (this.pulse || 0)); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-this.x, -this.y); },
  toWorld(sx, sy) { return { x: this.x + (sx - W / 2) / this.zoom, y: this.y + (sy - H / 2) / this.zoom }; },
  setZoom(z) { this.zoom = clamp(z || 1, 1, 2.5); this.clamp(); },

/* ---------- Plein écran ---------- */
const Fullscreen = {
  get active() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  supported() { const d = document.documentElement; return !!(d.requestFullscreen || d.webkitRequestFullscreen); },
  enter() {
    const d = document.documentElement; const p = d.requestFullscreen ? d.requestFullscreen({ navigationUI: 'hide' }) : d.webkitRequestFullscreen ? d.webkitRequestFullscreen() : null;
    if (p && p.then) p.then(() => { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) { /* */ } }).catch(() => {});
  },
  exit() { if (document.exitFullscreen) document.exitFullscreen().catch(() => {}); else if (document.webkitExitFullscreen) document.webkitExitFullscreen(); },
  toggle() { this.active ? this.exit() : this.enter(); },

/* ---------- Time ---------- */
const Time = { scale: 1, slow: 1, slowUntil: 0, now: 0, frame: 0 };

/* ---------- Input ---------- */
const Input = (() => {
  const keys = new Set(), pressed = new Set();
  const mouse = { x: W / 2, y: H / 2, down: false, right: false, moved: 0 };
  const touch = { active: false, move: { x: 0, y: 0 }, fire: false, skill: false, interact: false, autoFire: false };
  let canvas = null, scale = 1, offX = 0, offY = 0;
  const KEYMAP = {
    up: ['KeyW', 'KeyZ', 'ArrowUp'], down: ['KeyS', 'ArrowDown'], left: ['KeyA', 'KeyQ', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'],
    skill: ['Space', 'ShiftLeft', 'ShiftRight'], interact: ['KeyE', 'KeyF', 'Enter'], pause: ['Escape', 'KeyP'], debug: ['F1'],
    fire: ['KeyJ', 'KeyK'], mouse2: ['Mouse2'],

    canvas = c;
    let first = false;
    const firstInt = () => { if (!first) { first = true; onFirstInteraction && onFirstInteraction(); } };
    const typing = e => { const t = e.target; return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT'); };
    window.addEventListener('keydown', e => {
      firstInt();
      if (typing(e)) return;   // champ de saisie (atelier rythme) : le clavier lui appartient
      if (e.code === 'F1' || e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
      if (!keys.has(e.code)) pressed.add(e.code);
      keys.add(e.code);
    });
    window.addEventListener('keyup', e => keys.delete(e.code));
    window.addEventListener('blur', () => { keys.clear(); mouse.down = false; mouse.right = false; });
    const toLogical = e => { const r = canvas.getBoundingClientRect(); mouse.x = clamp((e.clientX - r.left) / scale - offX, -offX, W + offX); mouse.y = clamp((e.clientY - r.top) / scale - offY, -offY, H + offY); mouse.moved = Time.now; };
    canvas.addEventListener('mousemove', e => { if (!touch.active) toLogical(e); });
    canvas.addEventListener('mousedown', e => { firstInt(); if (touch.active) return; toLogical(e); if (e.button === 0) mouse.down = true; if (e.button === 2) { mouse.right = true; pressed.add('Mouse2'); } });
    window.addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; if (e.button === 2) mouse.right = false; });

  function axis() {
    let x = (isDown('right') ? 1 : 0) - (isDown('left') ? 1 : 0);
    let y = (isDown('down') ? 1 : 0) - (isDown('up') ? 1 : 0);
    if (x && y) { x *= Math.SQRT1_2; y *= Math.SQRT1_2; }

  function endFrame() { pressed.clear(); }
  function press(code) { pressed.add(code); }
  return { attach, setScale, isDown, wasPressed, axis, mouse, touch, press, endFrame, keys };
})();

/* ---------- Engine : canvas, boucle à pas fixe ---------- */
const Engine = (() => {
  let canvas, ctx, acc = 0, last = 0, running = false, rafId = 0;
  let updateFn = () => {}, renderFn = () => {};
  const stats = { fps: 0, frames: 0, fpsT: 0, steps: 0 };
  let maxStepsPerFrame = 8;
  let headless = false;   // rendu désactivé (autoplay)

  function init(c) {
    canvas = c; ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    resize(); window.addEventListener('resize', resize);
  }
  /* Le canvas couvre toute la fenêtre. La salle (1280×720 logiques) reste entièrement visible et centrée ;
     la fenêtre plus large ou plus haute montre du décor autour (vue logique étendue : view.w × view.h, décalage view.ox/oy). */
  const view = { w: W, h: H, ox: 0, oy: 0, scale: 1 };
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const ww = window.innerWidth, wh = window.innerHeight;
    const s = Math.min(ww / W, wh / H);
    view.scale = s; view.w = ww / s; view.h = wh / s; view.ox = (view.w - W) / 2; view.oy = (view.h - H) / 2;
    canvas.style.width = ww + 'px'; canvas.style.height = wh + 'px'; canvas.style.left = '0px'; canvas.style.top = '0px';
    canvas.width = Math.floor(ww * dpr); canvas.height = Math.floor(wh * dpr);
    ctx.setTransform(dpr * s, 0, 0, dpr * s, view.ox * dpr * s, view.oy * dpr * s);
    ctx.imageSmoothingEnabled = false;
    Input.setScale(s, view.ox, view.oy);
    document.documentElement.style.setProperty('--ui-scale', s.toFixed(3));
    for (const id of ['ui', 'touch']) { const el = document.getElementById(id); if (el) { el.style.width = ww + 'px'; el.style.height = wh + 'px'; el.style.left = '0px'; el.style.top = '0px'; } }
  }
  function loop(t) {
    rafId = requestAnimationFrame(loop);
    if (!last) last = t;
    let frameDt = Math.min((t - last) / 1000, 0.25); last = t;
    stats.frames++; stats.fpsT += frameDt; if (stats.fpsT >= 0.5) { stats.fps = Math.round(stats.frames / stats.fpsT); stats.frames = 0; stats.fpsT = 0; }
    acc += frameDt * Time.scale;
    let steps = 0;
    while (acc >= FIXED_DT && steps < maxStepsPerFrame) {
      const slow = Time.now < Time.slowUntil ? Time.slow : 1;
      updateFn(FIXED_DT * slow, FIXED_DT);
      Time.now += FIXED_DT; Time.frame++;
      acc -= FIXED_DT; steps++;
    }
    if (steps === maxStepsPerFrame) acc = 0;
    stats.steps = steps;
    if (!headless) renderFn(ctx, acc / FIXED_DT);
    if (steps > 0 || G.paused) Input.endFrame();   // ne pas perdre un appui entre deux pas (écrans 120/144 Hz)
  }
  function start(u, r) { updateFn = u; renderFn = r; if (!running) { running = true; last = 0; rafId = requestAnimationFrame(loop); } }
  function stop() { running = false; cancelAnimationFrame(rafId); }
  function setHeadless(h) { headless = h; maxStepsPerFrame = h ? 400 : 8; }
  function isHeadless() { return headless; }
  return { init, start, stop, stats, view, get ctx() { return ctx; }, get canvas() { return canvas; }, setHeadless, isHeadless };
})();

<script>
/* ==== AudioEngine.js ==== */
/* =====================================================================
   SALLE ZÉRO — AudioEngine
   ---------------------------------------------------------------------
   Moteur audio procédural (Web Audio API, JS vanilla, aucune dépendance).

   Principes :
   - Aucun oscillateur nu en sortie : chaque source oscillante traverse au
     moins un filtre résonant balayé, une saturation douce (WaveShaper tanh)
     ou une modulation FM/AM, et se mélange à une couche de bruit.
   - Chaque son = couches : transitoire (bruit court) + corps (filtre
     résonant / FM saturée) + queue (réverbe par convolution, IR générée).
   - Variation aléatoire de hauteur (±7 %) et de gain (±10 %) à chaque tir.
   - Polyphonie bornée (24 voix), chaque voix se nettoie (stop + disconnect).
   - Tout est silencieux (aucune exception) tant que init() n'a pas été appelé.

   Graphe :
     voix → StereoPanner → bus SFX ─┐
     voix → send → Convolver → retour réverbe ─┤→ master → Compressor → destination
     musique / génératif → duck → bus musique ─┘
   ===================================================================== */
(function (global) {
  'use strict';

  /* ------------------------------------------------------------------ */
  /* État global                                                         */
  /* ------------------------------------------------------------------ */
  let ctx = null;
  let sr = 44100;
  let master, comp, sfxBus, musicBus, musicDuck, musicFilter, reverbIn, convolver, reverbReturn, limiter, analyser, specBuf;
  /* tonalité courante (posée par Beat) : les sons « accordés » (TUNE) se calent sur la pentatonique de la piste */
  const key = { root: 293.66, mode: 'minor' };
  const heart = { timer: null, next: 0, k: 0 };
  const noiseBuf = { white: null, pink: null, brown: null };
  const vol = { master: 0.8, sfx: 1.0, music: 0.7 };
  const MAX_VOICES = 24;
  const voices = [];          // voix SFX actives (pool borné)
  const shaperCache = new Map();
  const NAMES = [];           // liste publique des sons (ordre d'enregistrement)
  const api = {};

  /* ------------------------------------------------------------------ */
  /* Utilitaires                                                         */
  /* ------------------------------------------------------------------ */
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const isNum = (v) => typeof v === 'number' && isFinite(v);

  /** Normalise les options d'un événement : {x, intensity} → pan + facteurs aléatoires. */
  function norm(o) {
    o = o || {};
    const I = isNum(o.intensity) ? clamp(o.intensity, 0, 1) : 0.8;
    return {
      x: isNum(o.x) ? clamp(o.x, -1, 1) : 0,
      I,
      p: (isNum(o.pitch) ? o.pitch : 1) * (1 + rnd(-0.07, 0.07)),   // jitter de hauteur ±7 %, × hauteur demandée (cascade de ramassage)
      g: (1 + rnd(-0.1, 0.1)) * (0.55 + 0.45 * I),   // jitter de gain ±10 %, pondéré par l'intensité
      hz: isNum(o.hz) ? o.hz : 0,                    // hauteur imposée (Hz) pour les sons musicaux (salle du tempo)
      step: isNum(o.step) ? o.step | 0 : 0,          // degré de gamme (cascade de ramassage) pour les sons accordés
    };
  }

  /** Enveloppe percussive : montée linéaire puis décroissance exponentielle. */
  function perc(param, t, peak, att, dec) {
    peak = Math.max(peak, 0.0002);
    param.cancelScheduledValues(t);
    param.setValueAtTime(0.0001, t);
    param.linearRampToValueAtTime(peak, t + att);
    param.exponentialRampToValueAtTime(0.0001, t + att + dec);
  }

  /** Enveloppe ADSR : a/d/s puis maintien jusqu'à t+hold, relâchement r. */
  function adsr(param, t, peak, a, d, s, hold, r) {
    peak = Math.max(peak, 0.0002);
    param.cancelScheduledValues(t);
    param.setValueAtTime(0.0001, t);
    param.linearRampToValueAtTime(peak, t + a);
    param.linearRampToValueAtTime(Math.max(peak * s, 0.0002), t + a + d);
    param.setValueAtTime(Math.max(peak * s, 0.0002), t + Math.max(hold, a + d));
    param.exponentialRampToValueAtTime(0.0001, t + Math.max(hold, a + d) + r);
  }

  /** Balayage d'un paramètre (fréquence de filtre, hauteur...) de from → to. */
  function sweep(param, t, from, to, dur, linear) {
    param.cancelScheduledValues(t);
    param.setValueAtTime(Math.max(from, 1e-3), t);
    if (linear) param.linearRampToValueAtTime(to, t + dur);
    else param.exponentialRampToValueAtTime(Math.max(to, 1e-3), t + dur);
  }

  /** Courbe de saturation douce tanh (mise en cache par drive). */
  function tanhCurve(drive) {
    const key = Math.round(drive * 100);
    if (shaperCache.has(key)) return shaperCache.get(key);
    const n = 1024, c = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      c[i] = Math.tanh(x * drive) / Math.tanh(drive);
    }
    shaperCache.set(key, c);
    return c;
  }

  /* ------------------------------------------------------------------ */
  /* Génération des buffers (bruits, impulse response)                   */
  /* ------------------------------------------------------------------ */
  function makeNoise(type, seconds) {
    const len = Math.floor(sr * seconds);
    const buf = ctx.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    if (type === 'white') {
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } else if (type === 'pink') {
      // Filtre de Paul Kellet (approximation 1/f)
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + w * 0.0555179;
        b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.96900 * b2 + w * 0.1538520;
        b3 = 0.86650 * b3 + w * 0.3104856;
        b4 = 0.55000 * b4 + w * 0.5329522;
        b5 = -0.7616 * b5 - w * 0.0168980;
        d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
        b6 = w * 0.115926;
      }
    } else { // brown : intégration du bruit blanc (fuite pour rester borné)
      let last = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        last = (last + 0.02 * w) / 1.02;
        d[i] = last * 3.5;
      }
    }
    return buf;
  }

  /** Impulse response stéréo : bruit décroissant exponentiellement, légèrement assombri. */
  function makeIR(seconds, decay) {
    const len = Math.floor(sr * seconds);
    const buf = ctx.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      let lp = 0;
      for (let i = 0; i < len; i++) {
        const t = i / sr;
        const env = Math.exp(-decay * t) * (i < 300 ? i / 300 : 1); // pré-délai très court
        const w = Math.random() * 2 - 1;
        lp += 0.35 * (w - lp);          // one-pole lowpass → queue plus sombre
        d[i] = lp * env * (ch ? 0.9 : 1);
      }
    }
    return buf;
  }

  /* ------------------------------------------------------------------ */
  /* Initialisation                                                      */
  /* ------------------------------------------------------------------ */
  function buildGraph() {
    sr = ctx.sampleRate;
    master = ctx.createGain(); master.gain.value = vol.master;
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 4;
    comp.attack.value = 0.003; comp.release.value = 0.18;
    /* Routage : effets → compresseur (colle les SFX entre eux) → master ; musique → master directement. La musique ne passe
       JAMAIS par le compresseur des effets : avec une piste MP3 forte, chaque transitoire d'effet (ramassage, survol) faisait
       chuter le gain en 3 ms sur la musique aussi = clic audible à chaque son, perçu comme un crépitement. */
    /* Sécurité en sortie : écrêtage doux (tanh), pas un second compresseur — dans Chrome, deux DynamicsCompressor en série font
       chuter tout le son d'environ 12 dB (mesuré en rendu offline). Linéaire pour les niveaux normaux, arrondit seulement les vrais pics. */
    limiter = ctx.createWaveShaper(); limiter.curve = tanhCurve(1.15); limiter.oversample = 'none';
    master.connect(limiter); limiter.connect(ctx.destination);

    sfxBus = ctx.createGain(); sfxBus.gain.value = vol.sfx; sfxBus.connect(comp); comp.connect(master);
    musicBus = ctx.createGain(); musicBus.gain.value = vol.music; musicBus.connect(master);
    analyser = ctx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.55; musicBus.connect(analyser);   // spectre de la musique (visuels de la salle du tempo)
    musicFilter = ctx.createBiquadFilter(); musicFilter.type = 'lowpass'; musicFilter.frequency.value = 20000; musicFilter.Q.value = 0.4; musicFilter.connect(musicBus);   // « la musique respire » : vie basse, salle vidée
    musicDuck = ctx.createGain(); musicDuck.gain.value = 1; musicDuck.connect(musicFilter);

    // Bus réverbe : convolution avec IR générée, retour vers le master
    reverbIn = ctx.createGain(); reverbIn.gain.value = 1;
    convolver = ctx.createConvolver();
    convolver.buffer = makeIR(1.8, 3.6);
    reverbReturn = ctx.createGain(); reverbReturn.gain.value = 0.55;
    reverbIn.connect(convolver); convolver.connect(reverbReturn); reverbReturn.connect(master);

    noiseBuf.white = makeNoise('white', 2);
    noiseBuf.pink = makeNoise('pink', 2);
    noiseBuf.brown = makeNoise('brown', 2);
  }

  /**
   * Crée l'AudioContext (à appeler sur un geste utilisateur). Idempotent.
   * opts.context : contexte externe (ex. OfflineAudioContext pour les tests).
   */
  function init(opts) {
    opts = opts || {};
    try {
      if (opts.context && opts.context !== ctx) {
        teardown();
        ctx = opts.context;
        buildGraph();
        return true;
      }
      if (ctx) { resume(); return true; }
      const AC = global.AudioContext || global.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC({ latencyHint: 'interactive' });
      buildGraph();
      resume();
      return true;
    } catch (e) {
      console.warn('[AudioEngine] init impossible :', e);
      ctx = null;
      return false;
    }
  }

  function resume() {
    if (!ctx) return;
    try { if (ctx.state === 'suspended' && ctx.resume) ctx.resume(); } catch (e) { /* silencieux */ }
  }

  function teardown() {
    try {
      for (const v of voices.slice()) v.kill();
      stopGenerativeMusic(0);
      if (music.cur) { try { music.cur.stop(); } catch (e) { /* */ } music.cur = null; }
      flame.v = null;
    } catch (e) { /* silencieux */ }
  }

  function setVolume(o) {
    o = o || {};
    if (isNum(o.master)) vol.master = clamp(o.master, 0, 1);
    if (isNum(o.sfx)) vol.sfx = clamp(o.sfx, 0, 1);
    if (isNum(o.music)) vol.music = clamp(o.music, 0, 1);
    if (!ctx) return;
    const t = ctx.currentTime;
    master.gain.cancelScheduledValues(t); master.gain.setTargetAtTime(vol.master, t, 0.02);
    sfxBus.gain.setTargetAtTime(vol.sfx, t, 0.02);
    musicBus.gain.setTargetAtTime(vol.music, t, 0.02);
  }
  function getVolume() { return { master: vol.master, sfx: vol.sfx, music: vol.music }; }

  /** Baisse brève du master (coup reçu), retour en `seconds`. */
  function duckMaster(amount, seconds) {
    const t = ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(master.gain.value, t);
    master.gain.linearRampToValueAtTime(vol.master * (1 - amount), t + 0.015);
    master.gain.setTargetAtTime(vol.master, t + 0.05, seconds / 3);
  }

  /* ------------------------------------------------------------------ */
  /* Voix : mini-graphe jetable avec nettoyage automatique               */
  /* ------------------------------------------------------------------ */
  /**
   * @param o     options normalisées (pan)
   * @param dur   durée totale (s) après laquelle la voix est détruite (Infinity = manuelle)
   * @param prio  priorité 0..10 (plus haut = moins facilement évincée)
   * @param bus   nœud de sortie (sfxBus par défaut) ; pooled=false pour la musique
   */
  function voice(o, dur, prio, bus, pooled) {
    const now = ctx.currentTime;
    bus = bus || sfxBus;
    pooled = pooled !== false;
    if (pooled) {
      // Nettoyage des voix expirées puis éviction si la polyphonie est saturée
      for (const v of voices.slice()) if (v.end < now) v.kill();
      if (voices.length >= MAX_VOICES) {
        let victim = null;
        for (const v of voices) {
          if (v.prio <= prio && (!victim || v.prio < victim.prio || (v.prio === victim.prio && v.end < victim.end))) victim = v;
        }
        if (!victim) return null;      // la nouvelle voix est moins prioritaire : ignorée
        victim.kill();
      }
    }
    const v = { prio, end: now + (isFinite(dur) ? dur : 1e9), nodes: [], sources: [], dead: false, t: now };
    v.out = ctx.createGain(); v.out.gain.value = 1;
    v.pan = ctx.createStereoPanner(); v.pan.pan.value = o.x * 0.8;
    v.send = ctx.createGain(); v.send.gain.value = 0;
    v.out.connect(v.pan); v.pan.connect(bus);
    v.out.connect(v.send); v.send.connect(reverbIn);
    v.nodes.push(v.out, v.pan, v.send);

    v.add = (n) => { v.nodes.push(n); return n; };
    v.gain = (val) => { const g = ctx.createGain(); g.gain.value = isNum(val) ? val : 1; return v.add(g); };
    v.filter = (type, f, q) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (isNum(q)) b.Q.value = q; return v.add(b); };
    v.shaper = (drive) => { const s = ctx.createWaveShaper(); s.curve = tanhCurve(drive || 2); s.oversample = 'none'; return v.add(s); };
    v.src = (s, t0, t1) => { s.start(t0); if (isFinite(t1)) s.stop(t1); v.sources.push(s); v.nodes.push(s); return s; };
    v.noise = (type, t0, t1) => {
      const s = ctx.createBufferSource(); s.buffer = noiseBuf[type] || noiseBuf.white; s.loop = true;
      s.loopStart = 0; s.loopEnd = s.buffer.duration;
      s.start(t0, rnd(0, s.buffer.duration * 0.9)); if (isFinite(t1)) s.stop(t1);
      v.sources.push(s); v.nodes.push(s); return s;
    };
    v.osc = (type, f, t0, t1) => { const s = ctx.createOscillator(); s.type = type; s.frequency.value = f; return v.src(s, t0, t1); };
    /** FM : modulateur → gain(index) → carrier.frequency. Retourne {car, mod, idx}. */
    v.fm = (cf, mf, index, t0, t1, carType, modType) => {
      const car = ctx.createOscillator(); car.type = carType || 'sine'; car.frequency.value = cf;
      const mod = ctx.createOscillator(); mod.type = modType || 'sine'; mod.frequency.value = mf;
      const idx = ctx.createGain(); idx.gain.value = index;
      mod.connect(idx); idx.connect(car.frequency);
      v.add(idx); v.src(mod, t0, t1); v.src(car, t0, t1);
      return { car, mod, idx };
    };
    /** LFO : oscillateur → gain(depth) → param. */
    v.lfo = (rate, depth, param, t0, t1, type) => {
      const l = ctx.createOscillator(); l.type = type || 'sine'; l.frequency.value = rate;
      const g = ctx.createGain(); g.gain.value = depth; l.connect(g); g.connect(param);
      v.add(g); v.src(l, t0, t1); return l;
    };
    /** AM par bruit : bruit → lowpass → gain(depth) → param (crépitement). */
    v.noiseMod = (type, cutoff, depth, param, t0, t1) => {
      const n = v.noise(type, t0, t1); const f = v.filter('lowpass', cutoff, 0.7); const g = v.gain(depth);
      n.connect(f); f.connect(g); g.connect(param); return g;
    };
    v.chain = function () { for (let i = 0; i < arguments.length - 1; i++) arguments[i].connect(arguments[i + 1]); return arguments[arguments.length - 1]; };
    v.reverb = (amt) => { v.send.gain.value = amt; };
    const fin = () => { for (const s of v.sources) { try { s.stop(); } catch (e) { /* déjà arrêtée */ } } for (const n of v.nodes) { try { n.disconnect(); } catch (e) { /* */ } } };
    /* fin de voix : fondu de 20 ms avant de couper (une coupure sèche sur une voix encore audible fait un clic, audible en rafale de ramassages) */
    v.kill = (hard) => {
      if (v.dead) return; v.dead = true;
      const i = voices.indexOf(v); if (i >= 0) voices.splice(i, 1);
      if (v.timer) clearTimeout(v.timer);
      if (hard || !ctx || ctx.state !== 'running' || v.end < ctx.currentTime - 0.3) { fin(); return; }
      try { const t0 = ctx.currentTime; v.out.gain.cancelScheduledValues(t0); v.out.gain.setValueAtTime(v.out.gain.value, t0); v.out.gain.linearRampToValueAtTime(0, t0 + 0.02); } catch (e) { fin(); return; }
      setTimeout(fin, 45);
    };
    if (pooled) voices.push(v);
    if (isFinite(dur) && typeof setTimeout === 'function') v.timer = setTimeout(v.kill, (dur + 0.15) * 1000);
    return v;
  }

  /* ------------------------------------------------------------------ */
  /* Briques réutilisables (couches)                                     */
  /* ------------------------------------------------------------------ */
  /** Transitoire : bruit blanc court à travers un bandpass résonant. */
  function layerClick(v, t, o, f, q, gain, dur) {
    const n = v.noise('white', t, t + dur + 0.02);
    const b = v.filter('bandpass', f * o.p, q); const g = v.gain(0);
    v.chain(n, b, g, v.out); perc(g.gain, t, gain * o.g, 0.002, dur);
    return g;
  }
  /** Corps grave : sinus balayé → tanh → lowpass (jamais nu en sortie). */
  function layerThump(v, t, o, f0, f1, gain, dur, drive) {
    const s = v.osc('sine', f0 * o.p, t, t + dur + 0.05);
    sweep(s.frequency, t, f0 * o.p, f1 * o.p, dur * 0.8);
    const sh = v.shaper(drive || 3); const lp = v.filter('lowpass', f0 * 4, 1); const g = v.gain(0);
    v.chain(s, sh, lp, g, v.out); perc(g.gain, t, gain * o.g, 0.004, dur);
    return g;
  }
  /** Nappe : 2 dents-de-scie détunées → lowpass résonant balayé → tanh. */
  /** Mallet : porteur sinus + modulateur inharmonique (bois ≈ ×3,01, métal ≈ ×4,5) à index bref → lowpass → attaque nette, décroissance naturelle. */
  function layerMallet(v, t, o, f, gain, dur, metal) {
    const fq = f * o.p; const m = v.fm(fq, fq * (metal ? 4.53 : 3.01), fq * 0.9, t, t + dur + 0.1);
    sweep(m.idx.gain, t, fq * 0.9, fq * 0.05, dur * 0.35);
    const lp = v.filter('lowpass', Math.min(9000, fq * 5), 0.8); const g = v.gain(0);
    v.chain(m.car, lp, g, v.out); perc(g.gain, t, gain * o.g, 0.003, dur);
    layerClick(v, t, o, Math.min(6000, fq * 3), 4, gain * 0.25, 0.008);
  }
  /** Corde pincée : FM ratio 2 à index qui s'éteint vite (comme tempoNote), lowpass qui se referme, petite saturation. */
  function layerPluck(v, t, o, f, gain, dur) {
    const fq = f * o.p; const m = v.fm(fq, fq * 2.0, 320, t, t + dur + 0.1);
    sweep(m.idx.gain, t, 320, 10, dur * 0.4);
    const lp = v.filter('lowpass', 2800, 1.5); const sh = v.shaper(1.3); const g = v.gain(0);
    sweep(lp.frequency, t, 2800, 900, dur);
    v.chain(m.car, lp, sh, g, v.out); perc(g.gain, t, gain * o.g, 0.004, dur);
  }
  function layerPad(v, t, o, freq, gain, a, hold, r, cutoff0, cutoff1, q, drive) {
    const mix = v.gain(0.3);
    for (const det of [-7, 7]) {
      const s = v.osc('sawtooth', freq * o.p, t, t + a + hold + r + 0.05);
      s.detune.value = det + rnd(-3, 3); s.connect(mix);
    }
    const lp = v.filter('lowpass', cutoff0, q || 2); const sh = v.shaper(drive || 1.5); const g = v.gain(0);
    sweep(lp.frequency, t, cutoff0, cutoff1, a + hold * 0.7);
    v.chain(mix, lp, sh, g, v.out); adsr(g.gain, t, gain * o.g, a, 0.05, 1, a + hold, r);
    return g;
  }

  /* ------------------------------------------------------------------ */
  /* Déclaration d'un son : enveloppe protectrice + enregistrement        */
  /* ------------------------------------------------------------------ */
  /** Trim de niveau par son (équilibrage mesuré en rendu offline : pic visé ≈ 0,15-0,35, boss ≈ 0,6). */
  const LEVELS = {
    shootBlade: 1.7, shootBow: 1.3, shootBoomerang: 1.7, shootChain: 2.2, shootPistol: 0.5, shootHammer: 0.7, hitEnemy: 0.85, dash: 2, skillTurret: 2,
    pickupXp: 2.4, pickupCoin: 2.4, pickupFragment: 2, uiHover: 3, uiClick: 2.4, uiConfirm: 1.3,
    /* pièges : très en retrait sous la musique, ils ponctuent sans couvrir */
    trapWarn: 0.6, trapSpike: 0.7, trapLaser: 0.4, trapFire: 0.45, trapGas: 0.4, trapSaw: 0.25, trapShot: 0.4,
    chestOpen: 1.5, bossRoar: 0.8, playerDie: 0.8, tempoNote: 0.8,   // mix : effets répétitifs (tirs, coups, ramassages, interface) ≈ −6 dB sous la musique, impacts rares au niveau
  };
  /* Espacement minimal entre deux déclenchements du même son (s) : au-delà de la polyphonie utile, les rafales (ramassage
     de 30 orbes, survol rapide des boutons) ne font que saturer et crépiter. Par défaut 25 ms. */
  /* Sons accordés : fréquence de référence (celle que le son multiplie par o.p) → ramenée sur la note de la pentatonique de la
     piste la plus proche. Les tirs, coups et pièges restent libres (bruit, percussions). */
  const TUNE = { pickupXp: 1200, pickupCoin: 1800, pickupFragment: 2400, uiHover: 1500, uiClick: 600, uiConfirm: 500, roomClear: 196, levelUp: 220, chestOpen: 165, skillShield: 220, skillBlink: 1400, skillMagnet: 110, skillSlowtime: 220, shootOrb: 300, hitCrit: 900, bossPhase: 110,
    trapWarn: 900, trapLaser: 80, trapSaw: 110, trapSpike: 700, tempoCue: 440 };   // les pièges bourdonnent dans la tonalité de la piste au lieu de frotter contre elle
  const DEGREES = { minor: [0, 3, 5, 7, 10], major: [0, 2, 4, 7, 9] };
  function scaleRatio(step) { const d = DEGREES[key.mode] || DEGREES.minor; const i = Math.max(0, step | 0); return Math.pow(2, (d[i % 5] + 12 * Math.floor(i / 5)) / 12); }
  function nearestScale(f) {
    const d = DEGREES[key.mode] || DEGREES.minor; let best = f, bd = Infinity;
    for (let oct = -4; oct <= 5; oct++) for (const s of d) { const c = key.root * Math.pow(2, oct + s / 12); const dist = Math.abs(Math.log2(c / f)); if (dist < bd) { bd = dist; best = c; } }
    return best;
  }
  const GAPS = { pickupXp: 0.05, pickupCoin: 0.05, pickupFragment: 0.08, hitEnemy: 0.03, uiHover: 0.09, uiClick: 0.06, tempoNote: 0.08, trapWarn: 0.23, trapSpike: 0.2, trapShot: 0.2, trapSaw: 0.23 };   // 0,23 s = un temps à 129 BPM : jamais deux annonces sur le même temps
  const lastAt = {};
  function def(name, prio, fn) {
    NAMES.push(name);
    const trim = LEVELS[name] || 1;
    api[name] = function (opts) {
      if (!ctx) return;
      const now = ctx.currentTime; const gap = GAPS[name] != null ? GAPS[name] : 0.025; const prev = lastAt[name];
      if (prev != null && now - prev.t < gap) return;                       // trop rapproché : ignoré
      const burst = prev != null && now - prev.t < 0.25 ? Math.min(prev.n + 1, 6) : 0;   // rafale : chaque répétition rapprochée est un peu plus douce
      lastAt[name] = { t: now, n: burst };
      try {
        const o = norm(opts); o.g *= trim * Math.pow(0.88, burst);
        if (TUNE[name]) { const f0 = TUNE[name]; o.p = nearestScale(f0 * scaleRatio(o.step)) / f0 * (1 + rnd(-0.004, 0.004)); }   // accordé sur la piste
        /* `delay` : programme le son à un instant précis à venir au lieu de « tout de suite ». Un clic de
           métronome déclenché au pas de simulation qui suit le temps arrive jusqu'à 17 ms trop tard — audible. */
        const d = isNum(opts && opts.delay) ? clamp(opts.delay, 0, 0.5) : 0;
        fn(o, now + (d > 0.005 ? d : 0.005));   // `delay` est l'instant visé, pas un supplément : le clic tombe pile sur le temps
      } catch (e) { console.warn('[AudioEngine] ' + name, e); }
    };
  }

  /* ==================================================================
     TIRS PAR FAMILLE D'ARME
     ================================================================== */

  // shootBlade : fouet d'air → bruit blanc bandpass balayé 3 kHz→700 Hz + click sec + queue courte.
  def('shootBlade', 4, (o, t) => {
    const v = voice(o, 0.3, 4); if (!v) return;
    const n = v.noise('white', t, t + 0.25);
    const bp = v.filter('bandpass', 3000 * o.p, 2.5); const g = v.gain(0);
    sweep(bp.frequency, t, 3200 * o.p, 700 * o.p, 0.16);
    v.chain(n, bp, g, v.out); perc(g.gain, t, 0.55 * o.g, 0.012, 0.18);
    layerClick(v, t, o, 5000, 6, 0.25, 0.02);
    layerThump(v, t, o, 150, 70, 0.35, 0.1, 3);   // corps : un peu de bois dans le fouet
    v.reverb(0.12);
  });

  // shootHammer : impact lourd → bruit brun lowpass 180 Hz + sous-basse 80→38 Hz saturée + click + grande réverbe.
  def('shootHammer', 6, (o, t) => {
    const v = voice(o, 0.7, 6); if (!v) return;
    const n = v.noise('brown', t, t + 0.5);
    const lp = v.filter('lowpass', 180, 1.2); const g = v.gain(0);
    sweep(lp.frequency, t, 400, 90, 0.3);
    v.chain(n, lp, g, v.out); perc(g.gain, t, 1.0 * o.g, 0.005, 0.4);
    layerThump(v, t, o, 80, 38, 0.9, 0.45, 4);
    layerClick(v, t, o, 1800, 3, 0.5, 0.03);
    v.reverb(0.35);
  });

  // shootBow : corde relâchée → click bandpass très résonant + corde triangle bandpass Q8 saturée + sifflement highpass balayé.
  def('shootBow', 4, (o, t) => {
    const v = voice(o, 0.45, 4); if (!v) return;
    layerClick(v, t, o, 2600, 9, 0.5, 0.015);
    const s = v.osc('triangle', 210 * o.p, t, t + 0.2);
    sweep(s.frequency, t, 210 * o.p, 150 * o.p, 0.12);
    const bp = v.filter('bandpass', 900 * o.p, 8); const sh = v.shaper(2.5); const g = v.gain(0);
    sweep(bp.frequency, t, 1400 * o.p, 500 * o.p, 0.15);
    v.chain(s, bp, sh, g, v.out); perc(g.gain, t, 0.35 * o.g, 0.003, 0.12);
    const n = v.noise('white', t, t + 0.4);
    const hp = v.filter('highpass', 5000 * o.p, 1.5); const g2 = v.gain(0);
    sweep(hp.frequency, t + 0.01, 6000 * o.p, 1800 * o.p, 0.3);
    v.chain(n, hp, g2, v.out); perc(g2.gain, t + 0.01, 0.3 * o.g, 0.02, 0.28);
    v.reverb(0.15);
  });

  // shootPistol : détonation → bruit blanc lowpass 7 kHz→400 Hz très rapide + résonance grave 130→45 Hz saturée + réverbe.
  def('shootPistol', 5, (o, t) => {
    const v = voice(o, 0.45, 5); if (!v) return;
    const n = v.noise('white', t, t + 0.3);
    const lp = v.filter('lowpass', 7000, 1.5); const sh = v.shaper(3); const g = v.gain(0);
    sweep(lp.frequency, t, 7000, 400, 0.08);
    v.chain(n, lp, sh, g, v.out); perc(g.gain, t, 0.9 * o.g, 0.002, 0.14);
    layerThump(v, t, o, 110, 42, 0.8, 0.2, 4);
    const b = v.noise('brown', t, t + 0.3); const lb = v.filter('lowpass', 700, 1); const gb = v.gain(0); v.chain(b, lb, gb, v.out); perc(gb.gain, t, 0.35 * o.g, 0.004, 0.22);   // air chaud derrière la détonation
    v.reverb(0.3);
  });

  // shootBoomerang : whoosh tournant → bruit rose bandpass balayé + tremolo AM 11 Hz + léger souffle highpass.
  def('shootBoomerang', 4, (o, t) => {
    const v = voice(o, 0.6, 4); if (!v) return;
    const n = v.noise('pink', t, t + 0.55);
    const bp = v.filter('bandpass', 1200 * o.p, 3); const trem = v.gain(0.6); const g = v.gain(0);
    sweep(bp.frequency, t, 700 * o.p, 2200 * o.p, 0.25); bp.frequency.exponentialRampToValueAtTime(900 * o.p, t + 0.55);
    v.lfo(11 * o.p, 0.4, trem.gain, t, t + 0.55);
    v.chain(n, bp, trem, g, v.out); adsr(g.gain, t, 0.7 * o.g, 0.03, 0.05, 0.9, 0.35, 0.18);
    layerClick(v, t, o, 4000, 4, 0.15, 0.02);
    v.reverb(0.18);
  });

  // shootOrb : nappe FM douce → porteur 300 Hz / modulateur 1.5× index décroissant → lowpass balayé → tanh + souffle rose.
  def('shootOrb', 4, (o, t) => {
    const v = voice(o, 0.5, 4); if (!v) return;
    const f = v.fm(300 * o.p, 450 * o.p, 260, t, t + 0.45);
    sweep(f.idx.gain, t, 260, 20, 0.35);
    const lp = v.filter('lowpass', 1400 * o.p, 4); const sh = v.shaper(1.8); const g = v.gain(0);
    sweep(lp.frequency, t, 1800 * o.p, 350 * o.p, 0.4);
    v.chain(f.car, lp, sh, g, v.out); adsr(g.gain, t, 0.5 * o.g, 0.02, 0.05, 0.8, 0.25, 0.18);
    const n = v.noise('pink', t, t + 0.45);
    const bp = v.filter('bandpass', 1000 * o.p, 1.5); const g2 = v.gain(0);
    v.chain(n, bp, g2, v.out); perc(g2.gain, t, 0.2 * o.g, 0.02, 0.35);
    v.reverb(0.3);
  });

  // shootChain : crépitement électrique → bruit blanc highpass 3 kHz modulé en amplitude par du bruit lowpass 60 Hz + bandpass Q10 résonant.
  def('shootChain', 4, (o, t) => {
    const v = voice(o, 0.3, 4); if (!v) return;
    const n = v.noise('white', t, t + 0.25);
    const hp = v.filter('highpass', 3000 * o.p, 1); const am = v.gain(0.2); const g = v.gain(0);
    v.noiseMod('white', 60, 1.0, am.gain, t, t + 0.25);
    v.chain(n, hp, am, g, v.out); perc(g.gain, t, 0.8 * o.g, 0.004, 0.2);
    const n2 = v.noise('white', t, t + 0.25);
    const bp = v.filter('bandpass', 6500 * o.p, 12); const g2 = v.gain(0);
    sweep(bp.frequency, t, 6500 * o.p, 3500 * o.p, 0.2);
    v.chain(n2, bp, g2, v.out); perc(g2.gain, t, 0.35 * o.g, 0.003, 0.15);
    v.reverb(0.1);
  });

  /* --- Lance-flammes : souffle continu tant que shootFlame() est appelé --- */
  const flame = { v: null, watchdog: null };
  // startFlame : souffle → bruit brun lowpass 600 Hz modulé par LFO 3 Hz + crépitement highpass AM bruit. Continu.
  function startFlame(opts) {
    if (!ctx) return;
    try {
      const o = norm(opts);
      if (flame.v && !flame.v.dead) { flame.v.pan.pan.setTargetAtTime(o.x * 0.8, ctx.currentTime, 0.05); return; }
      const t = ctx.currentTime + 0.005;
      const v = voice(o, Infinity, 7); if (!v) return;
      const n = v.noise('brown', t, Infinity);
      const lp = v.filter('lowpass', 600, 2); const sh = v.shaper(2); const g = v.gain(0);
      v.lfo(3.1, 220, lp.frequency, t, Infinity);
      v.lfo(0.7, 120, lp.frequency, t, Infinity, 'triangle');
      v.chain(n, lp, sh, g, v.out);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.75 * o.g, t + 0.08);
      const n2 = v.noise('white', t, Infinity);
      const hp = v.filter('highpass', 3500, 1); const am = v.gain(0.12); const g2 = v.gain(0.35);
      v.noiseMod('white', 25, 0.6, am.gain, t, Infinity);
      v.chain(n2, hp, am, g2, v.out);
      v.reverb(0.12);
      v.fadeOut = (fade) => {
        const tt = ctx.currentTime;
        g.gain.cancelScheduledValues(tt); g.gain.setValueAtTime(g.gain.value, tt); g.gain.linearRampToValueAtTime(0.0001, tt + fade);
        g2.gain.cancelScheduledValues(tt); g2.gain.setValueAtTime(g2.gain.value, tt); g2.gain.linearRampToValueAtTime(0.0001, tt + fade);
        setTimeout(v.kill, fade * 1000 + 60);
      };
      flame.v = v;
    } catch (e) { console.warn('[AudioEngine] startFlame', e); }
  }
  function stopFlame() {
    if (!ctx) return;
    try {
      if (flame.watchdog) { clearTimeout(flame.watchdog); flame.watchdog = null; }
      if (flame.v && !flame.v.dead) flame.v.fadeOut(0.18);
      flame.v = null;
    } catch (e) { /* silencieux */ }
  }
  // shootFlame : démarre/entretient le souffle ; s'éteint seul 150 ms après le dernier appel.
  def('shootFlame', 7, (o) => {
    startFlame({ x: o.x, intensity: o.I });
    if (flame.watchdog) clearTimeout(flame.watchdog);
    flame.watchdog = setTimeout(stopFlame, 150);
  });

  /* ==================================================================
     COMBAT
     ================================================================== */

  // hitEnemy : impact chair/métal → click bandpass 1.8 kHz + thump 180→80 Hz saturé + bruit rose lowpass court.
  def('hitEnemy', 3, (o, t) => {
    const v = voice(o, 0.3, 3); if (!v) return;
    layerClick(v, t, o, 1500, 2, 0.5, 0.03);
    layerThump(v, t, o, 130, 58, 0.7, 0.14, 3);   // impact plus grave et plus « matière »
    const n = v.noise('brown', t, t + 0.2);
    const lp = v.filter('lowpass', 900 * o.p, 1); const g = v.gain(0);
    v.chain(n, lp, g, v.out); perc(g.gain, t, 0.5 * o.g, 0.003, 0.14);
    v.reverb(0.12);
  });

  // hitCrit : coup critique → hitEnemy renforcé + couche métallique FM inharmonique (ratio 1.52) bandpass Q6 + réverbe plus longue.
  def('hitCrit', 5, (o, t) => {
    const v = voice(o, 0.5, 5); if (!v) return;
    layerClick(v, t, o, 2200, 3, 0.8, 0.03);
    layerThump(v, t, o, 200, 70, 0.7, 0.18, 4);
    const f = v.fm(900 * o.p, 1370 * o.p, 700, t, t + 0.35);
    sweep(f.idx.gain, t, 700, 60, 0.25);
    const bp = v.filter('bandpass', 2500 * o.p, 6); const sh = v.shaper(2); const g = v.gain(0);
    v.chain(f.car, bp, sh, g, v.out); perc(g.gain, t, 0.35 * o.g, 0.003, 0.28);
    const n = v.noise('white', t, t + 0.3);
    const hp = v.filter('highpass', 4000, 1); const g2 = v.gain(0);
    v.chain(n, hp, g2, v.out); perc(g2.gain, t, 0.3 * o.g, 0.003, 0.2);
    v.reverb(0.3);
  });

  // enemyDie : déchirure → bruit blanc bandpass 2.2 kHz→300 Hz crépité (AM bruit) + corps brun lowpass + grave 200→45 Hz saturé.
  def('enemyDie', 5, (o, t) => {
    const v = voice(o, 0.6, 5); if (!v) return;
    const n = v.noise('white', t, t + 0.45);
