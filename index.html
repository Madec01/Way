    ctx.save(); ctx.fillStyle = r.doorOpen ? '#0b0d14' : '#2b3350'; ctx.fillRect(dx - 4, dy - TILE, TILE + 8, TILE * 2);
    if (r.doorOpen) { ctx.strokeStyle = '#7fff9a'; ctx.shadowColor = '#7fff9a'; ctx.shadowBlur = 16 + Math.sin(Time.now * 4) * 6; ctx.lineWidth = 3; ctx.strokeRect(dx - 2, dy - TILE + 2, TILE + 4, TILE * 2 - 4); ctx.fillStyle = '#7fff9a'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('▶', dx + TILE / 2, dy + 8); }
    else { ctx.strokeStyle = '#ff5e7a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(dx + 6, dy - TILE + 8); ctx.lineTo(dx + TILE - 2, dy + TILE - 8); ctx.moveTo(dx + TILE - 2, dy - TILE + 8); ctx.lineTo(dx + 6, dy + TILE - 8); ctx.stroke(); }
    ctx.restore();
    /* zones */
    for (const h of r.hazards) { ctx.save(); ctx.globalAlpha = 0.45 * clamp((h.until - Time.now) / 1, 0.3, 1); ctx.fillStyle = h.color; ctx.shadowColor = h.color; ctx.shadowBlur = 12; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, TAU); ctx.fill(); ctx.restore(); }
    for (const t of r.traps) t.render(ctx, Room.trapTime(r, t));
    /* coffre */
    if (r.chest) Sprites.drawChest(ctx, r.chest);
    /* tourelles & leurres */
    for (const t of r.turrets) { ctx.save(); if (t.mobile) { Sprites.draw(ctx, 'npc_ally', t.x, t.y, { walk: Time.now, tint: 'rgba(120,255,255,.35)', fallback: () => { ctx.fillStyle = '#3a4260'; ctx.beginPath(); ctx.arc(t.x, t.y - 8, 7, 0, TAU); ctx.fill(); ctx.fillRect(t.x - 7, t.y - 2, 14, 14); } }); ctx.fillStyle = '#9ff'; ctx.font = '10px "Segoe UI", sans-serif'; ctx.textAlign = 'center'; ctx.fillText(Math.ceil(t.until - Time.now) + ' s', t.x, t.y - 30); } else { ctx.fillStyle = '#3a4260'; ctx.beginPath(); ctx.arc(t.x, t.y, 12, 0, TAU); ctx.fill(); ctx.fillStyle = '#9ff'; ctx.shadowColor = '#9ff'; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(t.x, t.y, 5, 0, TAU); ctx.fill(); } ctx.restore(); }
    for (const d of r.decoys) { ctx.save(); ctx.globalAlpha = 0.6; ctx.fillStyle = '#c9a3ff'; ctx.shadowColor = '#c9a3ff'; ctx.shadowBlur = 14; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill(); ctx.restore(); }
  },
  renderFx(ctx) {
    const r = G.room; if (!r) return;
    Anim.renderOver(ctx, r);   // lumières : par-dessus la salle, en mode additif
    for (const s of r.slashes) { const k = s.t / s.life; ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = s.color; ctx.shadowColor = s.color; ctx.shadowBlur = 14; ctx.lineWidth = s.slam ? 6 : 4; ctx.beginPath(); if (s.slam) ctx.arc(s.cx, s.cy, s.range * (0.5 + 0.5 * k), 0, TAU); else ctx.arc(s.x, s.y, s.range * (0.7 + 0.3 * k), s.a - s.arc / 2, s.a + s.arc / 2); ctx.stroke(); ctx.restore(); }
    for (const b of r.beams) { const k = b.t / b.life; ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = b.color; ctx.shadowColor = b.color; ctx.shadowBlur = 16; ctx.lineWidth = b.width; ctx.beginPath(); ctx.moveTo(b.ax, b.ay); if (b.jag) { const n = 6; for (let i = 1; i < n; i++) { const t = i / n; ctx.lineTo(lerp(b.ax, b.bx, t) + VFX_RNG.range(-8, 8), lerp(b.ay, b.by, t) + VFX_RNG.range(-8, 8)); } } ctx.lineTo(b.bx, b.by); ctx.stroke(); ctx.restore(); }
    for (const b of r.blasts) {
      const k = b.t / b.life; ctx.save();
      if (b.fill) { ctx.globalCompositeOperation = 'lighter'; const rr = b.r * (0.4 + 0.6 * k); const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, rr); g.addColorStop(0, `rgba(255,245,200,${0.9 * (1 - k)})`); g.addColorStop(0.45, b.color); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.globalAlpha = (1 - k) * 0.85; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, rr, 0, TAU); ctx.fill(); ctx.globalCompositeOperation = 'source-over'; }
      ctx.globalAlpha = 1 - k; ctx.strokeStyle = b.color; ctx.lineWidth = 7 * (1 - k) + 1; ctx.shadowColor = b.color; ctx.shadowBlur = 24; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (0.3 + 0.7 * k), 0, TAU); ctx.stroke(); ctx.restore();
    }
  },
};

/* ---------- Run : un niveau du début à la fin ---------- */
const Run = {
  start({ character, biome, weapon, skill, seed }) {
    Attract.stop();
    if (seed != null) RNG.reseed(seed);
    const charDef = Content.character(character); const biomeDef = Content.biome(biome);
    const rooms = Content.roomsOf(biomeDef.id);
    const pair = RNG.pick(biomeDef.levelPassives || [{ bonus: { name: '—', desc: '', mods: [] }, malus: { name: '—', desc: '', mods: [] } }]);
    G.run = {
      biome: biomeDef, char: charDef, rooms, roomIndex: 0, levelPassive: { bonus: Object.assign({ id: 'lp_bonus' }, pair.bonus), malus: Object.assign({ id: 'lp_malus' }, pair.malus) },
      level: 1, xp: 0, xpNext: Progression.xpForLevel(1), upgrades: [], pendingLevelUps: 0, rerolls: 0,
      scores: [], coinsPending: 0, coinsValidated: 0, lastCheckpoint: 0, startedAt: Time.now, ended: false,
      stats: { kills: 0, damageDealt: 0, damageTaken: 0, hitsTaken: 0, shots: 0, skillUses: 0, coins: 0, roomsEntered: 0, roomTimes: [], bossKilled: false, deathCause: null, deathRoom: null, levelReached: 1 },
      skillChoices: null, weaponDropRoom: RNG.pick([1, 3, 6, 7]),
    };
    G.pet = null;
    G.player = new Player(charDef);
    G.player.hp = 0; G.player.recompute(); G.player.hp = G.player.stats.maxHp;
    G.state = 'run'; G.paused = false;
    const startW = weapon || charDef.startWeapon;
    if (weapon && skill) { Run.equip(startW, skill); }
    G.run.skillChoices = RNG.shuffle(Content.skillsAvailable().slice()).slice(0, 2);
    applyDifficulty();
    /* compagnon choisi au hub : il entre avec le joueur (celui trouvé sur une élite le remplacera) */
    const petId = Meta.profile.pet; if (petId && Meta.petUnlocked(petId)) Pets.give(petId, true);   // sans bandeau : celui de la salle 1 passe d'abord
    if (!Room.load(1)) return;
    if (!(weapon && skill)) { G.paused = true; UI.showPrep(); } else Room.begin();
  },
  equip(weaponId, skillId) {
    const pl = G.player; pl.weapon = Content.weapon(weaponId) || Content.weapons()[0]; pl.skill = Content.skill(skillId) || Content.skills()[0];
    pl.rerollsLeft = Meta.rerolls(); pl.skillCharges = 1; pl.skillCd = 0; pl.recompute(); pl.skillCharges = pl.skillMaxCharges;
    G.run.weapon = pl.weapon.id; G.run.skill = pl.skill.id;
  },
  addXp(n) {
    const r = G.run; if (r.ended || r.attract) return; r.xp += n;
    while (r.xp >= r.xpNext) { r.xp -= r.xpNext; r.level++; r.xpNext = Progression.xpForLevel(r.level); r.pendingLevelUps++; r.stats.levelReached = r.level; }
    if (r.pendingLevelUps > 0 && !G.overlay) Run.levelUp();
  },
  upgradePool() {
    const pl = G.player; const fam = pl.weapon ? pl.weapon.family : null; const counts = {}; for (const u of G.run.upgrades) counts[u.def.id] = u.stacks;
    return Content.upgrades().filter(u => (!u.weaponFamily || u.weaponFamily === fam) && (counts[u.id] || 0) < (u.maxStacks || 1));
  },
  levelUp() {
    const r = G.run; if (r.pendingLevelUps <= 0) return; r.pendingLevelUps--;
    const pl = G.player; AudioEngine.levelUp({});
    for (const h of pl.hooks.onLevelUp) if (h.effect === 'reroll_on_levelup') pl.rerollsLeft += h.count * (h.stacks || 1);
    const n = Meta.fourthChoice() ? 4 : 3;
    const opts = { force: G.debug.forceRarity };
    const choices = Progression.drawUpgrades(Run.upgradePool(), n, pl.stats.luck, opts);
    G.paused = true; UI.showChoice({ title: STR.levelUp, subtitle: `${STR.level} ${r.level}`, choices, reroll: true, onPick: u => { Run.takeUpgrade(u); UI.hideChoice(); G.paused = false; if (r.pendingLevelUps > 0) Run.levelUp(); }, onReroll: () => Progression.drawUpgrades(Run.upgradePool(), n, pl.stats.luck, opts) });
  },
  takeUpgrade(def) {
    const r = G.run; const ex = r.upgrades.find(u => u.def.id === def.id); if (ex) ex.stacks++; else r.upgrades.push({ def, stacks: 1 });
    G.player.recompute(); AudioEngine.uiConfirm({}); Floaters.add(G.player.x, G.player.y - 40, def.name, RARITY[def.rarity].color, 16);
    if (def.rarity === 'colossal') Meta.unlockLore('first_colossal');
  },
  /* fenêtre de scores pour un coffre */
  chestWindow() {
    const r = G.run; const idx = G.room.index; const scores = r.scores.filter(s => s.index < idx && (idx <= 4 ? s.index >= 1 : s.index >= 1));
    let vals = scores.map(s => s.score); let label = `Salles 1-${idx - 1}`;
    if (idx >= 8 && Meta.selectiveMemory()) { vals = Progression.bestN(vals, 3); label = '3 meilleures salles'; }
    const died = scores.some(s => s.died);
    return { avg: Progression.avgScore(vals), died, label, count: vals.length };
  },
  openChest() {
    const r = G.room; if (!r.chest || r.chest.opened) return; r.chest.opened = true; AudioEngine.chestOpen({});
    const win = Run.chestWindow(); const opts = Progression.chestOptions(win.avg, win.died); if (G.debug.forceRarity) opts.force = G.debug.forceRarity;
    const n = Meta.fourthChoice() ? 4 : 3; const pl = G.player;
    const choices = Progression.drawUpgrades(Run.upgradePool(), n, pl.stats.luck, opts);
    G.paused = true;
    UI.showChoice({ title: STR.chest, subtitle: `${win.label} · qualité ${Math.round(win.avg * 100)} % · ${opts.label}`, choices, reroll: false, onPick: u => { Run.takeUpgrade(u); UI.hideChoice(); G.paused = false; Room.clear(); } });
    /* checkpoint : consignation des pièces */
    if (r.index === 4 || r.index === 8) Run.checkpoint();
  },
  checkpoint() { const r = G.run; if (r.coinsPending > 0) { r.coinsValidated += r.coinsPending; UI.toast(`Consignation : ${r.coinsPending} crédits validés`); r.coinsPending = 0; } r.lastCheckpoint = G.room.index; },
  finishRoom() {
    const r = G.room; const s = Room.score();
    G.run.scores.push({ index: r.index, score: s, hits: r.hits, time: r.time, died: r.died });
    G.run.stats.roomTimes.push({ room: r.index, time: Math.round(r.time * 10) / 10, hits: r.hits, score: Math.round(s * 100) / 100, level: G.run.level });
    if ((r.type === 'TRAP' || r.type === 'COMBAT_TEMPO') && r.hits === 0) { const bonus = Math.round(BALANCE.xpPerfectTrapRoom * G.player.stats.xpGain * G.debug.xpMul); Run.addXp(bonus); UI.toast(r.type === 'COMBAT_TEMPO' ? `Sans fausse note : +${bonus} XP` : `Traversée parfaite : +${bonus} XP`); }
    if (r.index === 3) Meta.unlockLore('room3_done');
    if (r.index === 5) { Meta.unlockLore('room5_reached'); if (r.hits === 0) Meta.unlockLore('boss_no_hit'); }
    if (r.index === 9 && r.hits === 0) Meta.unlockLore('boss_no_hit');
  },
  nextRoom() {
    if (G.overlay || G.room.leaving) return; G.room.leaving = true;
    Run.finishRoom();
    const next = G.room.index + 1;
    if (!G.run.rooms.find(x => x.index === next)) { Run.endLevel(true); return; }
    UI.transition(() => { Room.load(next); });
  },
  onPlayerDeath() {
    const r = G.run; if (r.ended || r.attract) return; r.ended = true;
    G.room.died = true; r.stats.deathRoom = G.room.index; r.stats.deathCause = Run.lastDamageSource || 'inconnu';
    const kept = Progression.coinsKeptOnDeath(r.coinsPending, G.room.index, r.lastCheckpoint);
    const total = r.coinsValidated + kept; Meta.addCoins(total); Meta.recordRun(false);
    Meta.unlockLore('deaths_3');
    G.paused = true; UI.showEnd({ victory: false, kept, pending: r.coinsPending, validated: r.coinsValidated, total });
    Music.dying(2.2, () => { if (G.overlay === 'end' || G.state === 'hub') Music.play('hub'); });   // la bande ralentit et descend, puis le hub
  },
  endLevel(victory) {
    const r = G.run; if (r.ended || r.attract) return; r.ended = true;
    const bonus = Math.round(BALANCE.levelEndBonus * G.player.stats.coinGain * G.debug.coinMul); const total = r.coinsValidated + r.coinsPending + bonus; Meta.addCoins(total); Meta.recordRun(true);
    G.paused = true; UI.showEnd({ victory: true, kept: r.coinsPending, pending: 0, validated: r.coinsValidated, total, bonus });
    Music.resetState(); Music.play('hub');
  },
  abort() { const r = G.run; if (!r || r.ended) return; r.ended = true; const kept = Progression.coinsKeptOnDeath(r.coinsPending, G.room.index, r.lastCheckpoint); Meta.addCoins(r.coinsValidated + kept); Meta.recordRun(false); Run.toHub(); },
  toHub() { G.state = 'hub'; G.paused = false; G.overlay = null; G.run = null; G.player = null; G.enemies = []; G.room = null; Projectiles.list = []; Pickups.list = []; UI.showHub(); Music.resetState(); Music.play('hub'); Attract.start(); },
  qualityAvg() { const r = G.run; if (!r) return 1; const vals = r.scores.map(s => s.score); const cur = G.room && G.room.state !== 'clear' ? [Room.score()] : []; return Progression.avgScore(vals.concat(cur)); },

  update(dt) {
    if (!G.run || G.paused) return;
    const pl = G.player;
    if (!G.attract) Music.setState({ hp01: pl.hp / pl.stats.maxHp, slow: Time.now < Time.slowUntil ? Time.slow : 1, overdrive: pl.overdriveUntil > Time.now });
    pl.update(dt); Pets.update(dt);
    for (const e of G.enemies) e.update(dt);
    G.enemies = G.enemies.filter(e => !e.dead);
    Projectiles.update(dt); Pickups.update(dt); Room.update(dt); Particles.update(dt); Floaters.update(dt);
    if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 30);
  },
};

</script>
<script>
/* ==== 50_ui.js ==== */
/* =========================================================================
   SALLE ZÉRO — 50_ui.js
   Écrans DOM (menu, hub, préparation, choix, pause, fin, crédits) et HUD canvas.
   ========================================================================= */

const UI = (() => {
  const $ = sel => document.querySelector(sel);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  let root, screens = {}, banners = [], toasts = [], fade = { t: 0, dir: 0, cb: null };
  const state = { choice: null, prep: null };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function init() {
    root = $('#ui');
    for (const s of ['menu', 'hub', 'prep', 'choice', 'pause', 'end', 'credits', 'lore']) { const d = el('div', 'screen', ''); d.id = 'screen-' + s; d.hidden = true; root.appendChild(d); screens[s] = d; }
    /* son de survol : une seule fois par bouton/carte, jamais plus d'un toutes les 90 ms (sinon ça grésille) */
    let lastHover = null, lastHoverT = 0;
    root.addEventListener('mouseover', e => { const el = e.target.closest('button, .card'); if (!el || el === lastHover) return; lastHover = el; const now = performance.now(); if (now - lastHoverT < 90) return; lastHoverT = now; AudioEngine.uiHover({ intensity: 0.25, step: menuStep(el) }); });
    root.addEventListener('mouseout', e => { const el = e.target.closest('button, .card'); if (el && el === lastHover && !el.contains(e.relatedTarget)) lastHover = null; });
    for (const ev of ['pointerdown', 'pointermove', 'keydown', 'wheel']) window.addEventListener(ev, () => { if (G.state === 'menu') menuIdle(); }, { passive: true });
    window.addEventListener('keydown', e => {
      if (e.code === 'F1' && G.mode === 'test') { e.preventDefault(); Debug.toggle(); }
      if (G.state === 'run' && (e.code === 'Escape' || e.code === 'KeyP') && !G.overlay) togglePause();
      else if (G.state === 'run' && e.code === 'Escape' && G.overlay === 'pause') togglePause();
      if (G.overlay === 'menu' && menuFx.phase === 'splash') { if (e.code !== 'F11' && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); enterMenu(); } return; }
      if (G.overlay === 'menu') {
        const btns = [...screens[G.overlay].querySelectorAll('.mbtn, .btn')].filter(b => !b.disabled && b.offsetParent !== null); if (!btns.length) return;
        let i = btns.indexOf(document.activeElement);
        if (e.code === 'ArrowDown' || e.code === 'ArrowUp' || (e.code === 'Tab' && G.overlay === 'menu')) { e.preventDefault(); i = (i + (e.code === 'ArrowUp' || (e.code === 'Tab' && e.shiftKey) ? -1 : 1) + btns.length) % btns.length; btns[i].focus(); AudioEngine.uiHover({ intensity: 0.35, step: menuStep(btns[i]) }); }
        else if ((e.code === 'Enter' || e.code === 'Space') && i >= 0) { e.preventDefault(); btns[i].click(); }
      }
      if (G.overlay === 'choice' && state.choice) { const k = parseInt(e.key); if (k >= 1 && k <= state.choice.choices.length) state.choice.pick(state.choice.choices[k - 1]); if (e.code === 'KeyR') state.choice.reroll && state.choice.reroll(); }
    });
  }
  function show(name) { for (const k in screens) screens[k].hidden = k !== name; G.overlay = name === null ? null : name; root.classList.toggle('active', name !== null); }
  function hideAll() { show(null); }

  /* ---------- Menu ---------- */
  /* Le menu se joue en deux temps : un écran-titre (« splash ») qui respire avec la musique, puis au clic le menu
     principal centré, titre compris. Tout ce qui bouge est calé sur Beat : temps, temps forts, mesures. */
  const menuFx = { phase: null, rings: [], flash: 0, glitch: 0, gxCss: null, vol: 0, bass: 0, idle: 0, arcade: false, anchor: 0.4, btns: null, reveal: 0, revealMax: 0, pending: null, pendT: 0 };
  function menuActive() { return G.state === 'menu' && !!menuFx.phase; }
  function menuIdle() { menuFx.idle = 0; menuFx.arcade = false; }
  /* degré de la gamme associé à un bouton : chaque changement de sélection sonne une note différente de la piste */
  function menuStep(el) { if (!el || !el.parentElement) return 0; const i = [...el.parentElement.children].indexOf(el); return i < 0 ? 0 : i % 5; }
  /* Une validation tombe sur la mesure : on attend le prochain temps fort, jamais plus d'un temps si la musique est absente. */
  function barSync(fn) {
    let wait = Music.isPlaying() ? Beat.timeToNextBar() : 0.12;
    if (wait > 1.05) wait = (1 - Beat.phase()) * Beat.beatLen();
    menuFx.pending = fn; menuFx.pendT = Math.max(0.08, wait);
  }
  const MENU_TAGLINE = 'Neuf salles par palier. Une seule sortie.';
  function menuFoot(p) {
    const hint = Input.touch.active ? 'Joystick à gauche · TIR / COMP. / E à droite' : 'ZQSD · souris · clic gauche : attaque · clic droit / Espace : compétence · E : interagir · Échap : pause';
    return `<div class="menufoot"><div class="hint">${hint}</div><div class="save">Sauvegarde : ${p.runs} run(s) · ${p.wins} case(s) 9 cochée(s) · ◈ ${fmt(p.coins)}</div></div>`;
  }

  /* Écran-titre : le titre, la musique, rien d'autre. Un clic (ou une touche) fait basculer sur le menu au temps fort suivant. */
  function showTitle() {
    G.state = 'menu'; G.paused = false;
    menuFx.phase = 'splash'; menuFx.anchor = 0.42; menuFx.idle = 0; menuFx.arcade = false; menuFx.pending = null; menuFx.btns = null; menuFx.reveal = menuFx.revealMax = 0;
    const s = screens.menu; const p = Meta.profile;
    s.innerHTML = `
      <div class="menuscreen splash">
        <div class="stamp"><span>Way</span><span class="sep">·</span><span>Roguelite à salles</span><span class="sep">·</span><span>Phase 2</span></div>
        <div class="titlebox">
          <div class="titlepulse">
            <h1 class="bigtitle" data-text="WAY"><span class="accent">W</span><span>AY</span></h1>
            <div class="tagline">${MENU_TAGLINE}</div>
          </div>
        </div>
        <div class="splashprompt">Cliquez pour commencer</div>
        ${menuFoot(p)}
      </div>`;
    s.querySelector('.menuscreen').onclick = enterMenu;
    show('menu'); Music.play('menu');
    if (!Attract.running) Attract.start();
  }
  /* Passage écran-titre → menu : flash et souffle sur le temps fort, le titre monte et rétrécit. */
  function enterMenu() {
    if (menuFx.phase !== 'splash' || menuFx.pending) return;
    AudioEngine.uiConfirm({ intensity: 0.85 });
    barSync(() => { menuFx.flash = 1; menuFx.rings.push({ t: 0, gold: true, big: true }); AudioEngine.bossBreath({ intensity: 0.35 }); showMenu(); });
  }

  function showMenu() {
    G.state = 'menu'; G.paused = false;
    menuFx.phase = 'main'; menuFx.anchor = 0.2; menuFx.idle = 0; menuFx.arcade = false; menuFx.pending = null;
    const s = screens.menu; const p = Meta.profile;
    s.innerHTML = `
      <div class="menuscreen main">
        <div class="stamp"><span>Way</span><span class="sep">·</span><span>Roguelite à salles</span><span class="sep">·</span><span>Phase 2</span></div>
        <div class="titlebox">
          <div class="titlepulse">
            <h1 class="bigtitle" data-text="WAY"><span class="accent">W</span><span>AY</span></h1>
            <div class="tagline">${MENU_TAGLINE}</div>
          </div>
        </div>
        <nav class="menunav">
          <button class="mbtn primary" id="btn-normal"><span class="k">01</span><span class="l">Mode Normal</span><span class="d">Progression réelle, sauvegarde locale</span></button>
          <button class="mbtn" id="btn-test"><span class="k">02</span><span class="l">Mode Test</span><span class="d">Tout débloqué, panneau debug F1</span></button>
          <button class="mbtn" id="btn-credits"><span class="k">03</span><span class="l">Crédits</span><span class="d">Sprites, musiques, licences</span></button>
          <button class="mbtn" id="btn-fs"><span class="k">04</span><span class="l">Plein écran</span><span class="d">${Fullscreen.active ? 'Quitter le plein écran' : 'Recommandé sur téléphone'}</span></button>
          <button class="mbtn ghost" id="btn-reset"><span class="k">—</span><span class="l">Réinitialiser</span><span class="d">Effacer la sauvegarde du mode Normal</span></button>
        </nav>
        <div class="audiohint">▶ Cliquez ou appuyez sur une touche pour lancer le son</div>
        ${menuFoot(p)}
      </div>`;

  /* Effets du menu pilotés par la musique : ondes de mesure, saccade du titre, grain, apparition des boutons. */
  function menuUpdate(dt) {
    menuFx.flash = Math.max(0, menuFx.flash - dt * 2.6);
    for (let i = menuFx.rings.length - 1; i >= 0; i--) { menuFx.rings[i].t += dt; if (menuFx.rings[i].t > 2) menuFx.rings.splice(i, 1); }
    const sp = AudioEngine.spectrum ? AudioEngine.spectrum(12) : null;
    if (sp) {
      let lo = 0, all = 0; for (let i = 0; i < 3; i++) lo = Math.max(lo, sp[i]); for (let i = 0; i < sp.length; i++) all += sp[i]; all /= sp.length;
      const a = Math.min(1, dt * 12); menuFx.bass += (lo - menuFx.bass) * a; menuFx.vol += (all - menuFx.vol) * Math.min(1, dt * 7);
    } else { menuFx.bass *= Math.max(0, 1 - dt * 3); menuFx.vol *= Math.max(0, 1 - dt * 3); }
    const crossed = Beat.crossedFrame(1), bib = Beat.beatInBar();
    if (crossed && bib === 0) menuFx.rings.push({ t: 0, gold: ((Beat.index() >> 2) & 1) === 0 });
    if (crossed) {
      /* saccade discrète des lettres sur les contretemps, remise à zéro sur le temps fort */
      menuFx.glitch = bib === 0 ? 0 : Math.round((Math.random() * 2 - 1) * 4);
      const gx = menuFx.glitch + 'px'; if (gx !== menuFx.gxCss) { menuFx.gxCss = gx; document.documentElement.style.setProperty('--gx', gx); }
    }
    if (menuFx.phase === 'main' && menuFx.btns && menuFx.reveal < menuFx.revealMax && crossed) {
      const b = menuFx.btns[menuFx.reveal++]; if (b) { b.classList.add('on'); AudioEngine.uiHover({ intensity: 0.5, step: menuFx.reveal }); }
    }
    if (menuFx.pending) { menuFx.pendT -= dt; if (menuFx.pendT <= 0) { const fn = menuFx.pending; menuFx.pending = null; fn(); } }
    menuFx.idle += dt; if (menuFx.idle > 20 && menuFx.phase === 'splash') menuFx.arcade = true;
  }
  /* Calque canvas du menu : ondes de choc issues du titre, balayage de couleur sur les graves, grain au volume, flash. */
  function renderMenuFx(ctx) {
    if (!menuActive()) return;
    const V = Engine.view, x0 = -V.ox, y0 = -V.oy, vw = V.w, vh = V.h;
    const ax = W / 2, ay = H * menuFx.anchor;
    ctx.save();
    ctx.lineWidth = 2;
    for (const r of menuFx.rings) {
      const a = r.t / (r.big ? 1.2 : 1.9); if (a > 1) continue;
      ctx.globalAlpha = (r.big ? 0.5 : 0.26) * (1 - a) * (1 - a);
      ctx.strokeStyle = r.gold ? '#ffb347' : '#6ee7ff';
      ctx.beginPath(); ctx.arc(ax, ay, 30 + a * (r.big ? 1200 : 760), 0, TAU); ctx.stroke();
    }
    /* une bande de couleur traverse l'écran à chaque mesure, sa largeur suit les graves */
    const bl = Beat.beatLen(), barK = 1 - Beat.timeToNextBar() / (4 * bl);
    const cx = x0 + barK * vw, bw = 80 + 300 * menuFx.bass;
    const gold = ((Beat.index() >> 2) & 1) === 0;
    const gr = ctx.createLinearGradient(cx - bw, 0, cx + bw, 0);
    const col = gold ? '255,179,71' : '110,231,255';
    gr.addColorStop(0, `rgba(${col},0)`); gr.addColorStop(0.5, `rgba(${col},${(0.05 + 0.1 * menuFx.bass).toFixed(3)})`); gr.addColorStop(1, `rgba(${col},0)`);
    ctx.globalAlpha = 1; ctx.fillStyle = gr; ctx.fillRect(x0, y0, vw, vh);
    /* grain de pellicule : densité pilotée par le volume de la piste */
    const pat = grainPattern(ctx);
    if (pat) { ctx.save(); ctx.globalAlpha = 0.05 + 0.11 * menuFx.vol; ctx.translate(-(Time.now * 130 % 96), -(Time.now * 91 % 96)); ctx.fillStyle = pat; ctx.fillRect(x0 - 96, y0 - 96, vw + 192, vh + 192); ctx.restore(); }
    if (menuFx.arcade) { ctx.globalAlpha = 0.55 + 0.35 * Math.pow(1 - Beat.phase(), 2); ctx.fillStyle = '#6ee7ff'; ctx.font = '19px "VT323", monospace'; ctx.textAlign = 'center'; ctx.fillText('DÉMONSTRATION', W / 2, H - 58); }
    if (menuFx.flash > 0) { ctx.globalAlpha = Math.min(1, menuFx.flash) * 0.75; ctx.fillStyle = '#dff6ff'; ctx.fillRect(x0, y0, vw, vh); }
    ctx.restore();
  }
  let grainTile = null, grainPat = null;
  function grainPattern(ctx) {
    if (grainPat) return grainPat;
    if (typeof document === 'undefined' || !document.createElement) return null;
    grainTile = document.createElement('canvas'); grainTile.width = grainTile.height = 96;
    const g = grainTile.getContext('2d'); if (!g) return null;
    const im = g.createImageData(96, 96);
    for (let i = 0; i < im.data.length; i += 4) { const v = 90 + Math.floor(Math.random() * 165); im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 40; }
    g.putImageData(im, 0, 0); grainPat = ctx.createPattern(grainTile, 'repeat');
    return grainPat;
  }

      s.querySelectorAll('[data-s]').forEach(c => c.onclick = () => { selS = c.dataset.s; AudioEngine.uiClick({}); render(); });

  }

  function renderToasts(ctx) {

  /* menu et hub battent avec la musique : --beat (retombe après chaque temps) et --down (temps fort de la mesure) pilotent le CSS */
  let beatCss = { b: -1, d: -1 }; const beatPulses = [];
  function beatPulse() {
    const ph = Beat.phase(); const k = Math.pow(1 - ph, 2.2); const bib = Beat.beatInBar(); const d = bib === 0 ? k : 0;
    const bq = Math.round(k * 40) / 40, dq = Math.round(d * 40) / 40;   // quantifié : pas de recalcul de style si rien ne change
    if (bq !== beatCss.b || dq !== beatCss.d) { beatCss = { b: bq, d: dq }; const st = document.documentElement.style; st.setProperty('--beat', bq); st.setProperty('--down', dq); }
    if (Beat.crossedFrame(1) && bib === 0) { beatPulses.push({ t0: Time.now }); if (beatPulses.length > 3) beatPulses.shift(); }
    return k;
  }
  function renderAttractVeil(ctx) {
    ctx.save(); const V = Engine.view; const x0 = -V.ox, y0 = -V.oy, vw = V.w, vh = V.h;
    const k = beatPulse();
    /* écran-titre : la scène d'attraction passe en ombres chinoises tant que l'attraction arcade ne s'est pas déclenchée */
    if (menuFx.phase === 'splash' && !menuFx.arcade) { ctx.globalAlpha = 0.6; ctx.fillStyle = '#04050b'; ctx.fillRect(x0, y0, vw, vh); ctx.globalAlpha = 1; }
    /* ondes depuis le centre sur chaque temps fort, léger flash sur chaque temps */
    ctx.strokeStyle = '#6ee7ff'; ctx.lineWidth = 2; for (const p of beatPulses) { const a = (Time.now - p.t0) / 1.6; if (a > 1) continue; ctx.globalAlpha = 0.18 * (1 - a); ctx.beginPath(); ctx.arc(W / 2, H / 2, 40 + a * 900, 0, TAU); ctx.stroke(); }
    ctx.globalAlpha = 0.045 * k; ctx.fillStyle = '#6ee7ff'; ctx.fillRect(x0, y0, vw, vh); ctx.globalAlpha = 1;
    const g = ctx.createLinearGradient(x0, 0, x0 + vw, 0); g.addColorStop(0, 'rgba(4,5,9,.86)'); g.addColorStop(0.5, 'rgba(4,5,9,.5)'); g.addColorStop(1, 'rgba(4,5,9,.3)'); ctx.fillStyle = g; ctx.fillRect(x0, y0, vw, vh);
    const v = ctx.createLinearGradient(0, y0, 0, y0 + vh); v.addColorStop(0, 'rgba(4,5,9,.7)'); v.addColorStop(0.25, 'rgba(4,5,9,0)'); v.addColorStop(0.8, 'rgba(4,5,9,0)'); v.addColorStop(1, 'rgba(4,5,9,.85)'); ctx.fillStyle = v; ctx.fillRect(x0, y0, vw, vh);

    if (menuActive()) { const rg = ctx.createRadialGradient(W / 2, H * 0.42, 60, W / 2, H * 0.42, 640); rg.addColorStop(0, 'rgba(4,5,9,.7)'); rg.addColorStop(1, 'rgba(4,5,9,0)'); ctx.fillStyle = rg; ctx.fillRect(x0, y0, vw, vh); }

    ctx.globalAlpha = 0.06; ctx.fillStyle = '#6ee7ff'; for (let y = y0 + (Time.now * 40) % 6; y < y0 + vh; y += 6) ctx.fillRect(x0, y, vw, 1);
    ctx.restore();
  }
  function renderFade(ctx) { if (fade.t > 0) { const V = Engine.view; ctx.fillStyle = `rgba(4,5,9,${fade.t})`; ctx.fillRect(-V.ox, -V.oy, V.w, V.h); } }
  function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  /* fond animé pour menu/hub */
  function renderBackdrop(ctx) {

<script>
/* ==== 55_touch.js ==== */
/* =========================================================================
   SUJET NEUF — 55_touch.js
   Mode tactile : joystick virtuel à gauche (déplacement ; la visée est automatique sur l'ennemi le plus proche,
   sinon la direction du joystick), boutons à droite (TIR maintenu, COMPÉTENCE, INTERAGIR), pause en haut à droite.
   Activé automatiquement au premier contact tactile.
   ========================================================================= */

const Touch = (() => {
  let layer, stick, knob, stickId = null, origin = { x: 0, y: 0 }, built = false;
  const R = 70;   // rayon du joystick en px logiques
  const isTouchDevice = () => ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;

  function build() {
    if (built) return; built = true;
    layer = document.getElementById('touch');
    layer.innerHTML = `
      <div class="tzone" id="t-zone"></div>
      <div class="tstick" id="t-stick" hidden><div class="tknob" id="t-knob"></div></div>
      <button class="tbtn fire" id="t-fire">TIR</button>
      <button class="tbtn skill" id="t-skill">COMP.</button>
      <button class="tbtn act" id="t-act">E</button>
      <button class="tbtn pause" id="t-pause">II</button>
      <button class="tbtn fs" id="t-fs">⛶</button>`;
    stick = document.getElementById('t-stick'); knob = document.getElementById('t-knob');
    const zone = document.getElementById('t-zone');
    const T = Input.touch;
    const toLogical = e => { const r = layer.getBoundingClientRect(); const s = Engine.view.scale; return { x: (e.clientX - r.left) / s, y: (e.clientY - r.top) / s }; };   // px logiques de la couche (origine = coin de la fenêtre)

      origin = toLogical(e); const sc = Engine.view.scale; stick.hidden = false; stick.style.left = (origin.x * sc) + 'px'; stick.style.top = (origin.y * sc) + 'px'; knob.style.transform = 'translate(-50%,-50%)'; T.move.x = 0; T.move.y = 0;
    });
    zone.addEventListener('pointermove', e => {
      if (e.pointerId !== stickId) return; e.preventDefault(); const p = toLogical(e); let dx = p.x - origin.x, dy = p.y - origin.y; const d = Math.hypot(dx, dy);
      if (d > R) { dx *= R / d; dy *= R / d; }

      T.move.x = k ? Math.cos(a) * k : 0; T.move.y = k ? Math.sin(a) * k : 0;
      const sc = Engine.view.scale; knob.style.transform = `translate(calc(-50% + ${dx * sc}px), calc(-50% + ${dy * sc}px))`;
    });
    const release = e => { if (e.pointerId !== stickId) return; stickId = null; stick.hidden = true; T.move.x = 0; T.move.y = 0; };
    zone.addEventListener('pointerup', release); zone.addEventListener('pointercancel', release); zone.addEventListener('lostpointercapture', release);
    const hold = (id, on, off) => { const b = document.getElementById(id); b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); b.classList.add('on'); on(); }); const up = e => { b.classList.remove('on'); off && off(); }; b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up); b.addEventListener('contextmenu', e => e.preventDefault()); };
    hold('t-fire', () => { T.fire = true; }, () => { T.fire = false; });
    hold('t-skill', () => { Input.press('Space'); });
    hold('t-act', () => { T.interact = true; });
    hold('t-pause', () => { if (G.state === 'run') UI.togglePause(); });
    hold('t-fs', () => Fullscreen.toggle());
    layer.addEventListener('contextmenu', e => e.preventDefault());
  }
  function activate() {
    if (Input.touch.active) return; Input.touch.active = true; build();
    try { Input.touch.autoFire = !!Meta.profile.touchAutoFire; } catch (e) { /* */ }
    document.body.classList.add('touch');
    if (!Meta.profile.zoom) Camera.setZoom(1.5);
  }
  function init() {
    window.addEventListener('touchstart', activate, { once: true, passive: true });
    window.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') activate(); }, { passive: true });
    if (isTouchDevice() && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) activate();
  }

  function sync() { if (!built) return; const show = Input.touch.active && G.state === 'run' && !G.overlay; layer.hidden = !show; if (!show && stickId != null) { stickId = null; stick.hidden = true; Input.touch.move.x = 0; Input.touch.move.y = 0; Input.touch.fire = false; } }
  return { init, sync, activate, get active() { return Input.touch.active; } };
})();

</script>
<script>
/* ==== 57_attract.js ==== */
/* =========================================================================
   SUJET NEUF — 57_attract.js

      stats: { kills: 0, damageDealt: 0, damageTaken: 0, hitsTaken: 0, shots: 0, skillUses: 0, coins: 0, roomsEntered: 0, roomTimes: [], bossKilled: false, deathCause: null, deathRoom: null, levelReached: 1 }, skillChoices: [], attract: true };
    G.player = new Player(charDef); G.player.hp = 0; G.player.recompute(); G.player.hp = G.player.stats.maxHp;
    applyDifficulty();
    G.enemies = []; Projectiles.list = []; Pickups.list = []; Particles.list = []; Floaters.list = [];
    G.room = Room.create({ id: 'room_attract', biome: biome.id, index: 0, type: 'PREP_COMBAT', refTime: 999, obstacles: [{ x: 5, y: 3, w: 1, h: 1 }, { x: 18, y: 3, w: 1, h: 1 }, { x: 5, y: 9, w: 1, h: 1 }, { x: 18, y: 9, w: 1, h: 1 }], waves: [], traps: [], fragments: [], modular: [] });

    G.player.x = W / 2; G.player.y = H / 2; Camera.setZoom(1.12); Camera.snap(G.player.x, G.player.y);

    for (const name of (AudioEngine.list ? AudioEngine.list() : [])) { if (/^ui/.test(name) || typeof AudioEngine[name] !== 'function') continue; muted[name] = AudioEngine[name]; AudioEngine[name] = () => {}; }
    if (AudioEngine.startFlame && !muted.startFlame) { muted.startFlame = AudioEngine.startFlame; AudioEngine.startFlame = () => {}; }
    spawnT = 0.5; weaponT = 18;
  }
  function equip() { const w = Content.weapon(WEAPONS[wIdx % WEAPONS.length]); const sk = Content.skills()[Math.floor(VFX_RNG() * Content.skills().length)]; G.player.weapon = w; G.player.skill = sk; G.player.skillCharges = 1; G.player.orbs = null; G.player.recompute(); }

})();

  /* ---------- Bot ---------- */
  const DIRS = [{ x: 0, y: 0 }]; for (let i = 0; i < 16; i++) DIRS.push({ x: Math.cos(i * TAU / 16), y: Math.sin(i * TAU / 16) });
  function botControl(pl) {
    const rm = G.room; const rng = (G.autoplay && G.autoplay.rng) || RNG; const w = pl.weapon; const isMelee = w && (w.type === 'melee' || w.type === 'area' || w.type === 'orbital');

  }
  function autoPrep() { const st = UI.state.prep; if (!st) return; const rng = G.autoplay.rng; const c = G.autoplay.config; setTimeout(() => st.pick(c.weapon || rng.pick(st.weapons).id, c.skill || rng.pick(st.skills).id), 0); }

<script>
/* ==== 80_atelier.js ==== */
/* =========================================================================
   SALLE ZÉRO — 80_atelier.js — Atelier rythme
   Une salle vierge, la piste du biome découpée en temps cliquables, et une partition par élément posé.
   Trois établis : Animations (décor qui joue en rythme), Pièges (ce qui blesse), Niveau (terrain et murs).
   F2 ouvre et ferme.

   Repère de temps : les positions sont comptées en temps musicaux depuis le début d'une boucle de `bars`
   mesures, et les pièges comme le décor lisent exactement la même chose (`params.beats.hits`).
   Ce qu'on entend dans l'atelier est donc ce qu'on aura en salle, quel que soit le BPM de la piste.
   ========================================================================= */
const Atelier = (() => {
  const KEY = 'way_atelier_v1';
  /* Réglages par défaut à la pose, et réglages proposés, selon la mécanique du piège.
     `act: 0` = « toute la boucle » : un piège à trajet continu (bras qui tourne, scie sur rail) doit rester allumé,
     sinon il s'éteint, tourne dans le noir et se rallume ailleurs. `turn` / `trip` calent ce trajet sur la mesure. */
  const KIND = {
    laser_sweep:   { size: [6, 8], act: 2, tele: 1, axis: 1 },
    laser_rotate:  { size: [1, 1], act: 0, tele: 1, turn: 4, arms: 1 },
    laser_grid:    { size: [10, 8], act: 1, tele: 1, axis: 1 },
    wall_fireball: { size: [1, 1], act: 0.25, tele: 1, angle: 1, count: 1 },
    spike_tiles:   { size: [4, 3], act: 0.5, tele: 1 },
    gas_zone:      { size: [1, 1], act: 2, tele: 1 },
    saw_rail:      { size: [8, 1], act: 0, tele: 1, trip: 4, axis: 1 },
    turret_fixed:  { size: [1, 1], act: 0.25, tele: 1, angle: 1, count: 1 },
    emitter:       { size: [1, 1], act: 0.25, tele: 1, angle: 1, count: 1, spinDeg: 1, arc: 1, burst: 1 },
    laser_beam:    { size: [1, 1], act: 1, tele: 1, angle: 1, len: 1 },
  };
  /* réglages proposés pour le décor animé */
  const AKIND = {
    tile_color: { mode: 1, color2: 1, cells: 1 },
    tile_lift:  { mode: 1, amp: 1, down: 1, color2: 1, cells: 1 },
    spinner:    { sprite: 1, step: 1, scale: 1 },
    bouncer:    { sprite: 1, amp: 1, scale: 1 },
    light:      { radius: 1, gain: 1, color2: 1 },
    ring:       { radius: 1, color2: 1 },
    mover:      { sprite: 1, scale: 1, path: 1, pingpong: 1, spin: 1, color2: 1 },
  };
  const SNAPS = [[1, 'noires'], [2, 'croches'], [4, 'doubles'], [3, 'triolets']];
  /* Rythmes prédéfinis : un motif (`at`) répété tous les `per` temps jusqu'au bout de la boucle. On les applique
     à un élément posé comme au modèle du pinceau — c'est ce qui évite de recocher la même chose à la main
     pour chaque objet. */
  const RHYTHMS = [
    ['', 'rythme…'],
    ['noires|1|0', 'tous les temps'],
    ['forts|4|0', 'temps forts (1)'],
    ['deuxquatre|4|1,3', 'temps 2 et 4'],
    ['unetrois|4|0,2', 'temps 1 et 3'],
    ['croches|1|0,0.5', 'croches'],
    ['contretemps|1|0.5', 'contretemps'],
    ['doubles|1|0,0.25,0.5,0.75', 'doubles-croches'],
    ['triolets|1|0,0.333,0.667', 'triolets'],

  /* déploie un rythme sur toute la boucle courante */

  const TABS = [['anim', 'Animations'], ['trap', 'Pièges'], ['level', 'Niveau'], ['amis', 'Amis']];

  /* Modèle du pinceau : les réglages affichés quand rien n'est choisi appartiennent au pinceau courant, et le

  const inLoop = () => beatNow() - cycle() * Lb();      // position dans la partition
  const q = n => Math.round(n * 1000) / 1000;
  const kindOf = it => (Content.trap(it.trap) || {}).kind;
  const defOf = it => KIND[kindOf(it)] || {};
  const trapsOf = () => (Content.biome(st.biome) || {}).trapPool || [];
  const famOf = it => it.kind === 'anim' ? 'anim' : it.kind === 'trap' ? 'trap' : 'level';
  const enemiesOf = () => (Content.biome(st.biome) || {}).enemyPool || [];

  const $ = s => box.querySelector(s);

  /* élément « modèle » du pinceau courant : même forme qu'un élément posé, mais il ne vit que dans le panneau */
  function brushItem() {

  /* ---------- salle ---------- */
  function roomDef() {
    const walls = st.items.filter(i => i.kind === 'mur');

      id: 'room_atelier', index: 1, type: 'TRAP', name: 'Atelier rythme', biome: st.biome, refTime: 60,
      obstacles: walls.map(w => ({ x: w.x, y: w.y, w: w.w, h: w.h })), deco: [], waves: [], fragments: [], modular: [],
      traps: st.items.filter(i => i.kind === 'trap').map(compileTrap),

  function compileWaves() {
    const g = {};

    const keys = Object.keys(g).map(Number).sort((a, b) => a - b);

  }

  /* un élément de l'atelier → une déclaration de content*.js */
  function beatsOf(it, tele) {

  /* Une photo devient un sprite : recadrée au carré et réduite à 64 px, sans lissage. Sans réduction, dix visages
     de téléphone pèseraient plusieurs mégaoctets une fois embarqués dans content5.js. */
  /* Une image déposée entre dans le jeu telle quelle si elle est déjà à une taille de sprite. On ne l'AGRANDIT
     jamais : un pixel art de 32×32 agrandi, a fortiori en lissant, perd exactement ce qui en fait du pixel art.
     Seules les photos d'appareil sont réduites — et là le lissage sert, puisqu'il s'agit de photos. */
  const IMG_MAX = 128;
  function readImg(input, entry, field, key) {
    const f = input.files && input.files[0]; if (!f || !entry) return;
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const side = Math.min(img.width, img.height);
        const carre = img.width === img.height;
        const S = Math.min(IMG_MAX, side);
        const c = document.createElement('canvas'); c.width = S; c.height = S; const g = c.getContext('2d');
        const reduit = side > S;
        g.imageSmoothingEnabled = reduit; if (reduit) g.imageSmoothingQuality = 'high';
        g.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
        entry[field] = c.toDataURL('image/png');
        if (!carre) UI.toast('Image recadrée au carré (' + img.width + '×' + img.height + ' → ' + S + '×' + S + ')');
        else if (!reduit) UI.toast('Image reprise telle quelle : ' + S + '×' + S + ' px');
        Sprites.addCustom(entry[key], entry[field]).then(() => { amisSave(); refresh(); });
      };
      img.onerror = () => UI.toast('Image illisible');
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  }

    bind('#t-ping', v => { p.pingpong = v; }); bind('#t-spin2', v => { p.spin = v; });
    bind('#t-w', v => { it.w = clamp(Math.round(v), 1, ROOM_COLS); }); bind('#t-h', v => { it.h = clamp(Math.round(v), 1, ROOM_ROWS); });
    bind('#t-tele', v => { it.tele = clamp(v, 0, 8); }); bind('#t-act', v => { it.act = clamp(v, 0, 32); });
    bind('#t-col', v => { p.color = v; }); bind('#t-col2', v => { p.color2 = v; });
    bind('#t-ang', v => { const a = (v % 360) * Math.PI / 180; if (kindOf(it) === 'wall_fireball') p.dir = a; else p.angle = a; });
    bind('#t-axis', v => { p.axis = v; p.orientation = v === 'y' ? 'horizontal' : 'vertical'; });
    bind('#t-turn', v => { it.turn = clamp(v, 0.5, 32); }); bind('#t-trip', v => { it.trip = clamp(v, 0.5, 32); });
    bind('#t-arms', v => { p.arms = clamp(Math.round(v), 1, 6); }); bind('#t-count', v => { p.count = clamp(Math.round(v), 1, 16); });
    bind('#t-arc', v => { p.arc = clamp(v, 0, 360) * Math.PI / 180; }); bind('#t-spin', v => { p.spin = clamp(v, -180, 180) * Math.PI / 180; });
    bind('#t-burst', v => { p.burst = clamp(Math.round(v), 1, 8); }); bind('#t-bgap', v => { p.burstGap = clamp(v, 0.125, 4); });
    bind('#t-len', v => { p.length = clamp(Math.round(v), 1, 26); }); bind('#t-mode', v => { p.mode = v; });
    bind('#t-amp', v => { p.amp = clamp(v, 1, 40); }); bind('#t-down', v => { p.down = v; });
    bind('#t-rad', v => { p.radius = clamp(v, 0.5, 12); }); bind('#t-gain', v => { p.gain = clamp(v, 0.1, 1); });
    bind('#t-step', v => { p.step = clamp(v, 15, 360) * Math.PI / 180; }); bind('#t-scale', v => { p.scale = clamp(v, 0.3, 4); });
    bind('#t-sprite', v => { p.sprite = v || null; });
    const ax = d.querySelector('#t-axis'); if (ax) ax.value = p.axis || 'x';
    const md = d.querySelector('#t-mode'); if (md) md.value = p.mode || 'all';
    const sp = d.querySelector('#t-sprite'); if (sp) sp.value = p.sprite || '';
    const fi = d.querySelector('#t-file');
    if (fi) fi.onchange = () => {   // image déposée par l'auteur : utilisable tout de suite, à ranger ensuite dans assets/sprites/pixel/
      const f = fi.files && fi.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => { const nm = f.name.replace(/\.[^.]+$/, ''); Sprites.addCustom(nm, rd.result).then(okk => { if (okk) { p.sprite = nm; apply(); refresh(); UI.toast('Image « ' + nm + ' » ajoutée'); } else UI.toast('Image illisible'); }); };
      rd.readAsDataURL(f);
    };
    const du = d.querySelector('#t-dup'); if (du) du.onclick = () => { const c = JSON.parse(JSON.stringify(it)); c.x = clamp(c.x + 1, 0, ROOM_COLS - 1); c.y = clamp(c.y + 1, 0, ROOM_ROWS - 1); st.items.push(c); st.sel = st.items.length - 1; apply(); refresh(); };
    const cx = d.querySelector('#t-col2x'); if (cx) cx.onclick = () => { delete p.color2; apply(); refresh(); };
    const nz = d.querySelector('#t-newzone'); if (nz) nz.onclick = () => { st.sel = -1; st.newZone = true; st.brush = 'a:' + it.anim; UI.toast('Motif suivant : la prochaine dalle posée en ouvre un nouveau'); refresh(); };
  }
  function tuneEnemy(lanes, it) {
    const d = document.createElement('div'); d.className = 'arow atune';
    d.innerHTML = `<b>${(Content.enemy(it.enemy) || {}).name || it.enemy}</b>
      <label>vague <input type="number" min="1" max="6" step="1" id="e-w" value="${(it.wave || 0) + 1}"></label>
      <label>nombre <input type="number" min="1" max="12" step="1" id="e-n" value="${it.count || 1}"></label>
      <label class="chk"><input type="checkbox" id="e-el"${it.elite ? ' checked' : ''}> élite</label>
      <button class="btn small" id="e-dup">Dupliquer</button><span class="amuted">la vague 1 entre au démarrage, les suivantes quand la précédente est vidée</span>`;
    lanes.appendChild(d);
    const bind = (id, f) => { const e = d.querySelector(id); e.onchange = () => { f(e.type === 'checkbox' ? e.checked : +e.value); apply(); replay(); refresh(); }; };
    bind('#e-w', v => { it.wave = clamp(Math.round(v) - 1, 0, 5); }); bind('#e-n', v => { it.count = clamp(Math.round(v), 1, 12); }); bind('#e-el', v => { it.elite = v; });
    d.querySelector('#e-dup').onclick = () => { const c = JSON.parse(JSON.stringify(it)); c.x = clamp(c.x + 1, 0, ROOM_COLS - 1); st.items.push(c); st.sel = st.items.length - 1; apply(); replay(); refresh(); };
  }
  /* remet les vagues à zéro : les ennemis rentrent comme au premier jour */
  function replay() {
    const r = G.room; if (!r) return;
    G.enemies = []; r.waves = (r.def.waves || []).map(w => Object.assign({ done: false }, w));
    r.waveIdx = 0; r.wavesStarted = false; r.lastWaveT = -99; r.state = 'fight'; r.stateT = 0; r.doorOpen = false;
  }
  /* position et largeur de la zone des cases : le curseur de lecture s'y aligne au pixel */
  function syncPos() { if (box && !box.hidden) { const e = $('#a-pos'); if (e) e.textContent = winLabel(); } }
  function measure() {
    if (!box || box.hidden) { headW = 0; return; }
    const g = box.querySelector('.agrid'), c = box.querySelector('.aruler .acells');
    if (!g || !c) { headW = 0; return; }
    const gr = g.getBoundingClientRect(), cr = c.getBoundingClientRect(); headX0 = cr.left - gr.left; headW = cr.width;
  }
  function toggleHit(k, b) {
    const it = st.items[k]; if (!it || !it.hits) return;
    const i = it.hits.findIndex(h => Math.abs(h - b) < 1e-6);
    if (i >= 0) it.hits.splice(i, 1); else { it.hits.push(b); AudioEngine.tempoTick({ intensity: 0.6 }); }
    st.sel = k; apply(); refresh();
  }

  /* ---------- pose à la souris ---------- */
  function paintTerrain(tx, ty, ch) {
    if (!st.terrain) st.terrain = new Array(ROOM_ROWS).fill('.'.repeat(ROOM_COLS));
    const row = st.terrain[ty]; st.terrain[ty] = row.slice(0, tx) + ch + row.slice(tx + 1);
    if (st.terrain.every(r => /^\.+$/.test(r))) st.terrain = null;   // plan entièrement effacé : on le retire
  }
  /* Ajoute (ou retire) une dalle au motif courant. Un motif garde UNE partition, quel que soit le nombre de dalles :
     c'est tout l'intérêt de peindre plutôt que de poser une zone rectangulaire par ligne. */
  function paintCell(anim, tx, ty, erase) {
    let it = st.items[st.sel];
    if (!it || it.kind !== 'anim' || it.anim !== anim) {
      it = st.newZone ? null : st.items.find(o => o.kind === 'anim' && o.anim === anim && o.params && o.params.cells);
      st.newZone = false;
      if (!it) {
        const ad = ANIM_DEFS[anim] || {};
        it = { kind: 'anim', anim, x: tx, y: ty, w: 1, h: 1, hits: [0], tele: 0, act: ad.act || 1, params: { cells: [] } };
        st.items.push(it);
      }
      st.sel = st.items.indexOf(it);
    }
    const cells = it.params.cells || (it.params.cells = []);
    const i = cells.findIndex(c => c[0] === tx && c[1] === ty);
    if (i >= 0) { if (erase !== false) cells.splice(i, 1); }
    else cells.push([tx, ty]);
    if (!cells.length) { st.items.splice(st.items.indexOf(it), 1); st.sel = -1; }
    else bbox(it);
    apply(); refresh();
  }
  /* Ajoute (ou retire) un point au trajet de l'objet mobile. L'ordre des clics est l'ordre du parcours. */
  function paintPath(anim, tx, ty) {
    let it = st.items[st.sel];
    if (!it || it.kind !== 'anim' || it.anim !== anim) {
      it = st.newZone ? null : st.items.find(o => o.kind === 'anim' && o.anim === anim && o.params && o.params.path);
      st.newZone = false;
      if (!it) { it = fromBrush(tx, ty) || { kind: 'anim', anim, x: tx, y: ty, w: 1, h: 1, hits: [0], tele: 0, act: 1, params: {} }; it.params.path = []; st.items.push(it); }
      st.sel = st.items.indexOf(it);
    }
    const path = it.params.path || (it.params.path = []);
    const i = path.findIndex(c => c[0] === tx && c[1] === ty);
    if (i >= 0) path.splice(i, 1); else path.push([tx, ty]);
    if (!path.length) { st.items.splice(st.items.indexOf(it), 1); st.sel = -1; }
    else { it.x = path[0][0]; it.y = path[0][1]; }
    apply(); refresh();
  }
  /* emprise du motif : ce que dessine le cadre de sélection et ce qu'affiche la ligne */
  function bbox(it) {
    const c = it.params.cells; if (!c || !c.length) return;
    const xs = c.map(p => p[0]), ys = c.map(p => p[1]);
    it.x = Math.min.apply(null, xs); it.y = Math.min.apply(null, ys);
    it.w = Math.max.apply(null, xs) - it.x + 1; it.h = Math.max.apply(null, ys) - it.y + 1;
  }
  function onCanvas(e) {
    if (!live || e.button !== 0 || !st.pose) return;
    dragging = true; dragSeen = new Set();
    const wm = Camera.toWorld(Input.mouse.x, Input.mouse.y);
    const tx = Math.floor((wm.x - ROOM_X) / TILE), ty = Math.floor((wm.y - ROOM_Y) / TILE);
    if (tx < 0 || ty < 0 || tx >= ROOM_COLS || ty >= ROOM_ROWS) return;
    dragSeen.add(tx + ',' + ty);
    if (st.brush && st.brush.startsWith('t:')) { paintTerrain(tx, ty, st.brush.slice(2)); apply(); refresh(); return; }
    if (st.brush && st.brush.startsWith('a:')) {
      const ad = ANIM_DEFS[st.brush.slice(2)] || {};
      if (ad.cells) { paintCell(st.brush.slice(2), tx, ty); return; }
      if (ad.path) { paintPath(st.brush.slice(2), tx, ty); return; }
    }
    const k = st.items.findIndex(it => famOf(it) === st.tab && tx >= it.x && tx < it.x + it.w && ty >= it.y && ty < it.y + it.h);
    if (k >= 0 && (!st.brush || k !== st.sel)) { st.sel = k; refresh(); return; }   // clic sur un élément : on le choisit
    if (!st.brush) return;
    if (st.brush === 'mur') st.items.push({ kind: 'mur', x: tx, y: ty, w: 1, h: 1 });
    else if (st.brush.startsWith('e:')) st.items.push({ kind: 'ennemi', enemy: st.brush.slice(2), x: tx, y: ty, w: 1, h: 1, wave: 0, count: 1, elite: false });
    else {
      if (st.brush.startsWith('a:')) {
        const ad = ANIM_DEFS[st.brush.slice(2)] || {};
        if (ad.cells) { paintCell(st.brush.slice(2), tx, ty); return; }   // dalles : on peint tuile par tuile
        if (ad.path) { paintPath(st.brush.slice(2), tx, ty); return; }    // objet mobile : on trace le trajet point par point
      }
      const it = fromBrush(tx, ty); if (!it) return;
      st.items.push(it);
    }
    st.sel = st.items.length - 1; apply(); refresh();
  }

  /* Traînée : bouton enfoncé, on peint les tuiles survolées. Peindre une salle dalle par dalle au clic isolé
     serait vite pénible ; une tuile n'est jamais traitée deux fois dans la même traînée. */
  let dragging = false, dragSeen = null;
  function onDrag() {
    if (!dragging || !live || !st.pose || !st.brush) return;
    const paintable = st.brush.startsWith('t:') || (st.brush.startsWith('a:') && (ANIM_DEFS[st.brush.slice(2)] || {}).cells);
    if (!paintable) return;
    const wm = Camera.toWorld(Input.mouse.x, Input.mouse.y);
    const tx = Math.floor((wm.x - ROOM_X) / TILE), ty = Math.floor((wm.y - ROOM_Y) / TILE);
    if (tx < 0 || ty < 0 || tx >= ROOM_COLS || ty >= ROOM_ROWS) return;
    const key = tx + ',' + ty; if (dragSeen.has(key)) return; dragSeen.add(key);
    if (st.brush.startsWith('t:')) { paintTerrain(tx, ty, st.brush.slice(2)); apply(); refresh(); }
    else paintCell(st.brush.slice(2), tx, ty, false);   // en traînée on ajoute seulement, jamais on n'efface
  }
  function onUp() { dragging = false; }

  /* ---------- import / export ---------- */
  function snippet() {
    const walls = st.items.filter(i => i.kind === 'mur'), traps = st.items.filter(i => i.kind === 'trap'), anims = st.items.filter(i => i.kind === 'anim');
    const info = Beat.info;
    let out = `/* Atelier rythme — boucle de ${st.bars} mesure(s), piste ${st.track} du ${st.biome}` + (info.internal ? ' (métronome interne)' : ` (${Math.round(info.bpm)} BPM)`) + ' */\n';
    if (st.terrain) out += 'terrain: [\n' + st.terrain.map(r => `  '${r}',`).join('\n') + '\n],\n';
    if (walls.length) out += 'obstacles: [\n' + walls.map(w => `  { x: ${w.x}, y: ${w.y}, w: ${w.w}, h: ${w.h} },`).join('\n') + '\n],\n';
    if (anims.length) out += 'anims: [\n' + anims.map(a => `  { kind: '${a.anim}', x: ${a.x}, y: ${a.y}, w: ${a.w}, h: ${a.h}${par(a.params)}, beats: ${bj(beatsOf(a, false))} },`).join('\n') + '\n],\n';
    const waves = compileWaves();
    if (waves.length) out += 'waves: [\n' + waves.map(w => `  { at: '${w.at}', spawns: [${w.spawns.map(sp => `{ enemy: '${sp.enemy}', x: ${sp.x}, y: ${sp.y}${sp.count > 1 ? ', count: ' + sp.count : ''}${sp.elite ? ', elite: true' : ''} }`).join(', ')}] },`).join('\n') + '\n],\n';
    out += 'traps: [\n' + traps.map(t => `  { trap: '${t.trap}', x: ${t.x}, y: ${t.y}, w: ${t.w}, h: ${t.h}, params: { ${inner(t.params)}beats: ${bj(beatsOf(t, true))} } },`).join('\n') + '\n],\n';
    out += '/* atelier:' + JSON.stringify(snap()) + ' */';
    return out;
  }
  const bj = b => '{ ' + Object.keys(b).map(k => `${k}: ${Array.isArray(b[k]) ? '[' + b[k].map(q).join(', ') + ']' : q(b[k])}`).join(', ') + ' }';
  const val = v => Array.isArray(v) ? '[' + v.map(val).join(', ') + ']' : typeof v === 'string' ? `'${v}'` : typeof v === 'boolean' ? String(v) : q(v);
  const inner = p => Object.keys(p || {}).map(k => `${k}: ${val(p[k])}, `).join('');
  const par = p => Object.keys(p || {}).length ? `, params: { ${inner(p).replace(/, $/, '')} }` : '';
  /* export de l'établi Amis : le contenu complet de dev/content5.js, images comprises */
  function amisSnippet() {
    const src = amis.pets.concat(amis.chars); const imgs = [];
    for (const a of src) for (const [f, k] of IMG_SLOTS) if (a[f] && a[k]) imgs.push([a[k], a[f]]);
    let out = '/* AMIS_DEBUT */\n';
    out += 'const FRIEND_IMAGES = {\n' + imgs.map(([k, v]) => `  '${k}': '${v}',`).join('\n') + '\n};\n\n';
    out += 'CONTENT.pets.push(\n' + amis.pets.map(p => '  ' + JSON.stringify(petDef(p)) + ',').join('\n') + '\n);\n\n';
    out += 'CONTENT.characters.push(\n' + amis.chars.map(c => '  ' + JSON.stringify(charDef(c)) + ',').join('\n') + '\n);\n';
    out += '/* AMIS_FIN */\n';
    return out.replace(/"atelier":true,?/g, '');
  }
  function showIo() { $('#a-io').hidden = false; $('#a-txt').value = st.tab === 'amis' ? amisSnippet() : snippet(); }
  /* relit le bloc « atelier:{…} » qu'écrit l'export : un aller-retour complet sans réécrire à la main */
  function importText(txt) {
    if (txt.indexOf('AMIS_DEBUT') >= 0) { UI.toast('Ce texte est le contenu de dev/content5.js : le coller dans le fichier, pas ici'); return; }
    const i = txt.indexOf('atelier:'); if (i < 0) { UI.toast('Texte non reconnu (il faut le bloc « atelier: » de l\'export)'); return; }
    let j = txt.lastIndexOf('*/'); if (j < i) j = txt.length;
    try {
      adopt(JSON.parse(txt.slice(i + 8, j).trim())); st.sel = -1;
      startRoom(); build(); UI.toast('Partition chargée : ' + st.items.length + ' élément(s)');
    } catch (e) { UI.toast('Lecture impossible : ' + e.message); }
  }

  /* ---------- boucle ---------- */
  function update() {
    if (!live) return;
    if (!G.run || G.state !== 'run' || !G.room) { close(); return; }   // run quittée depuis la pause : on referme proprement
    if (G.room.doorOpen) G.room.doorOpen = false;   // on ne sort pas de l'atelier par la porte
    if (Input.keys.has('Delete') && st.sel >= 0) { st.items.splice(st.sel, 1); st.sel = -1; Input.keys.delete('Delete'); apply(); refresh(); }
    /* La lecture boucle sur la FENÊTRE de travail, pas sur la partition entière : c'est ce qui permet de
       repasser deux mesures en boucle au milieu d'un morceau de trois minutes. Boucle décochée, c'est la
       fenêtre qui suit la musique. */
    const w0 = winStart(), wl = winBeats(); let pos = inLoop();
    if (pos < w0 || pos >= w0 + wl) {
      if (st.loop) { if (!Music.seekBeat(cycle() * Lb() + w0)) { st.winIdx = Math.floor(pos / wl); syncPos(); } }
      else { const i = clamp(Math.floor(pos / wl), 0, winCount() - 1); if (i !== st.winIdx) { st.winIdx = i; refresh(); } }
      pos = clamp(inLoop(), w0, w0 + wl);
    }
    if (Time.frame % 30 === 0) measure();   // fenêtre redimensionnée, panneau replié : la tête de lecture se recale
    if (headEl && headW) headEl.style.left = (headX0 + headW * (pos - w0) / wl) + 'px';
    /* Métronome : on programme le clic pour l'instant EXACT du prochain temps, jusqu'à 250 ms à l'avance, au lieu
       de le déclencher au pas de simulation qui suit — celui-ci tombait 8 à 17 ms trop tard, systématiquement.
       `Beat.lag` avance encore le clic de la latence de sortie, pour qu'il soit entendu sur le temps. */
    if (st.metro) {
      const nb = Beat.timeToBeat(1);
      if (nb.at < 0.25 && nb.index !== lastIdx) {
        lastIdx = nb.index;
        AudioEngine.tempoTick({ intensity: ((nb.index % 4) + 4) % 4 === 0 ? 1 : 0.45, delay: Math.max(0, nb.at - Beat.lag) });
      }
    } else lastIdx = -1;
  }
  /* repères dans la salle : grille de pose, élément choisi, aperçu sous le curseur */
  function render(ctx) {
    if (!live || !st.pose) return;
    /* Repères de pose : très effacés, et marqués seulement toutes les quatre tuiles — un quadrillage plein masquait la salle. */
    if (st.grid) {
      ctx.save(); ctx.strokeStyle = '#6ee7ff'; ctx.lineWidth = 1;
      for (let x = 0; x <= ROOM_COLS; x++) { ctx.globalAlpha = x % 4 === 0 ? 0.13 : 0.04; ctx.beginPath(); ctx.moveTo(ROOM_X + x * TILE, ROOM_Y); ctx.lineTo(ROOM_X + x * TILE, ROOM_Y + ROOM_ROWS * TILE); ctx.stroke(); }
      for (let y = 0; y <= ROOM_ROWS; y++) { ctx.globalAlpha = y % 4 === 0 ? 0.13 : 0.04; ctx.beginPath(); ctx.moveTo(ROOM_X, ROOM_Y + y * TILE); ctx.lineTo(ROOM_X + ROOM_COLS * TILE, ROOM_Y + y * TILE); ctx.stroke(); }
      ctx.restore();
    }
    const it = st.items[st.sel];
    if (it) { ctx.save(); ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]); ctx.strokeRect(ROOM_X + it.x * TILE + 1, ROOM_Y + it.y * TILE + 1, it.w * TILE - 2, it.h * TILE - 2); ctx.restore(); }
    /* trajet d'un objet mobile : la ligne et les points numérotés, pour voir l'ordre du parcours */
    for (const o2 of st.items) {
      const path = o2.kind === 'anim' && o2.params && o2.params.path;
      if (!path || !path.length) continue;
      const sel = st.items[st.sel] === o2; const c = o2.params.color || (ANIM_DEFS[o2.anim] || {}).color || '#ffd166';
      const px = i => ROOM_X + (path[i][0] + 0.5) * TILE, py = i => ROOM_Y + (path[i][1] + 0.5) * TILE;
      ctx.save(); ctx.globalAlpha = sel ? 0.9 : 0.35; ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
      ctx.beginPath(); ctx.moveTo(px(0), py(0));
      for (let i = 1; i < path.length; i++) ctx.lineTo(px(i), py(i));
      if (!o2.params.pingpong && path.length > 2) ctx.lineTo(px(0), py(0));
      ctx.stroke(); ctx.setLineDash([]);
      ctx.font = 'bold 11px "Segoe UI", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (let i = 0; i < path.length; i++) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(px(i), py(i), 9, 0, TAU); ctx.fill(); ctx.fillStyle = '#07080d'; ctx.fillText(String(i + 1), px(i), py(i) + 1); }
      ctx.restore();
    }
    if (st.brush) {
      const wm = Camera.toWorld(Input.mouse.x, Input.mouse.y);
      const tx = Math.floor((wm.x - ROOM_X) / TILE), ty = Math.floor((wm.y - ROOM_Y) / TILE);
      if (tx >= 0 && ty >= 0 && tx < ROOM_COLS && ty < ROOM_ROWS) {
        let s = [1, 1], col = '#8890aa';
        if (st.brush.startsWith('a:')) { const ad = ANIM_DEFS[st.brush.slice(2)] || {}; s = ad.size || [1, 1]; col = ad.color || '#6ee7ff'; }
        else if (st.brush.startsWith('t:')) { col = '#7fff9a'; }
        else if (st.brush !== 'mur') { const dfn = Content.trap(st.brush); if (dfn) { s = (KIND[dfn.kind] || {}).size || [1, 1]; col = dfn.color || '#ff5e7a'; } }
        ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = col;
        ctx.fillRect(ROOM_X + tx * TILE, ROOM_Y + ty * TILE, s[0] * TILE, s[1] * TILE); ctx.restore();
      }
    }
  }
  return { open, close, toggle, update, render, apply, refresh, snippet, get live() { return live; }, get st() { return st; }, posing: () => live && st.pose };
})();

</script>
<script>
/* ==== 90_main.js ==== */
/* =========================================================================
   SALLE ZÉRO — 90_main.js — point d'entrée, boucle update/render.
   ========================================================================= */

function update(dt, rawDt) {
  Beat.update(); UI.update(rawDt); Touch.sync();
  if (!G.audioOk && Music.isPlaying()) { G.audioOk = true; document.body.classList.add('audio-on'); }   // le son tourne : l'invite du menu disparaît
  if (G.state === 'run') { Run.update(dt); if (G.player) Camera.follow(G.player.x, G.player.y, rawDt); }
  else if (G.attract) Attract.update(dt);
  Atelier.update();
}
function render(ctx) {
  ctx.setTransform(ctx.getTransform());
  if ((G.state === 'run' || G.attract) && G.room) {
    ctx.save();
    Camera.apply(ctx);
    if (G.shake > 0) ctx.translate(VFX_RNG.range(-G.shake, G.shake), VFX_RNG.range(-G.shake, G.shake));
    ctx.fillStyle = '#07080d'; ctx.fillRect(-W, -H, 3 * W, 3 * H);
    Room.render(ctx);
    Pickups.render(ctx);
    const ents = G.enemies.slice(); if (G.pet) ents.push(G.pet); ents.sort((a, b) => a.y - b.y); for (const e of ents) e.render(ctx);
    G.player.render(ctx);
    Projectiles.render(ctx); Room.renderFx(ctx); Particles.render(ctx);
    if (G.room.challenge) Challenge.renderOverlay(ctx, G.room);
    if (G.room.tempo) Tempo.renderOverlay(ctx, G.room);
    Floaters.render(ctx);
    Debug.renderOverlay(ctx); Atelier.render(ctx);
    ctx.restore();
    if (G.attract) { UI.renderAttractVeil(ctx); } else { UI.renderHud(ctx); Pets.renderHud(ctx); if (G.room.challenge) Challenge.renderHud(ctx, G.room); if (G.room.tempo) Tempo.renderHud(ctx, G.room); }
  } else UI.renderBackdrop(ctx);
  UI.renderMenuFx(ctx);
  UI.renderToasts(ctx); UI.renderFade(ctx);
}
async function boot() {
  const canvas = document.getElementById('c');
  Engine.init(canvas);
  Meta.load(); Content.validate();
  /* Le son ne peut démarrer qu'après un geste de l'utilisateur (règle des navigateurs) : clic, toucher ou touche du clavier.
     On tente quand même un démarrage immédiat : Chrome l'autorise sur les sites où l'on a déjà joué du son (indice d'engagement). */
  const wake = () => { if (G.audioOk) return; AudioEngine.init(); AudioEngine.resume && AudioEngine.resume(); AudioEngine.setVolume(Meta.profile.volume); Music.restart(); };
  Input.attach(canvas, wake);
  document.addEventListener('pointerdown', wake); document.addEventListener('keydown', wake);   // retentés à chaque geste tant que la musique ne joue pas vraiment
  setTimeout(wake, 300);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && AudioEngine.resume) AudioEngine.resume(); });
  UI.init(); Debug.init(); Touch.init();
  Camera.setZoom(Meta.profile.zoom || (Touch.active ? 1.5 : 1));
  await Sprites.load(); Sprites.loadProps(); Sprites.loadFriends(); Sprites.loadCustoms(); Beat.load();
  if (Meta.profile.lag) Beat.lag = Meta.profile.lag;   // décalage son/image calibré par l'auteur
  UI.showTitle();
  Engine.start(update, render);
  Attract.start();
  window.__autoplay = Debug.autoplay; window.__atelier = Atelier;
  window.addEventListener('keydown', e => { if (e.code === 'F2') { e.preventDefault(); Atelier.toggle(); } });
  if (/[?&]atelier=1/.test(location.search)) setTimeout(() => Atelier.open(), 600);
  window.__G = G;
}
window.addEventListener('DOMContentLoaded', boot);

</script>
