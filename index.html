  // bossRoar : rugissement → brun lowpass 250→600→150 Hz sur 1.2 s + FM grave 55/41 Hz saturée lowpass LFO + growl blanc highpass AM + grosse réverbe.
  def('bossRoar', 8, (o, t) => {
    const v = voice(o, 1.6, 8); if (!v) return;
    const b = v.noise('brown', t, t + 1.4);
    const lp = v.filter('lowpass', 250, 3); const sh = v.shaper(3); const g = v.gain(0);
    sweep(lp.frequency, t, 250, 650, 0.35); lp.frequency.exponentialRampToValueAtTime(140, t + 1.2);
    v.chain(b, lp, sh, g, v.out); adsr(g.gain, t, 1.0 * o.g, 0.05, 0.2, 0.8, 0.9, 0.4);
    const f = v.fm(55 * o.p, 41 * o.p, 90, t, t + 1.4);
    sweep(f.idx.gain, t, 90, 160, 0.4); sweep(f.car.frequency, t, 55 * o.p, 45 * o.p, 1.2);
    const sh2 = v.shaper(5); const lp2 = v.filter('lowpass', 400, 4); const g2 = v.gain(0);
    v.lfo(7, 150, lp2.frequency, t, t + 1.4);
    v.chain(f.car, sh2, lp2, g2, v.out); adsr(g2.gain, t, 0.7 * o.g, 0.08, 0.2, 0.8, 0.9, 0.4);
    const n = v.noise('white', t, t + 1.2);
    const hp = v.filter('highpass', 2500, 1); const am = v.gain(0.15); const g3 = v.gain(0);
    v.noiseMod('white', 35, 0.7, am.gain, t, t + 1.2);
    v.chain(n, hp, am, g3, v.out); adsr(g3.gain, t, 0.5 * o.g, 0.1, 0.2, 0.8, 0.8, 0.3);
    v.reverb(0.5);
  });

  // bossPhase : changement de phase → impact sous-basse + nappe dissonante montante (lowpass balayé) + balayage blanc + réverbe longue.
  def('bossPhase', 8, (o, t) => {
    const v = voice(o, 1.8, 8); if (!v) return;
    layerThump(v, t, o, 70, 35, 1.0, 0.6, 5);
    const b = v.noise('brown', t, t + 0.6);
    const lp = v.filter('lowpass', 160, 1.5); const g = v.gain(0);
    v.chain(b, lp, g, v.out); perc(g.gain, t, 0.9 * o.g, 0.01, 0.5);
    layerPad(v, t + 0.1, o, 110, 0.4, 0.4, 0.8, 0.5, 200, 1800, 3, 2.5);
    layerPad(v, t + 0.1, o, 155.6, 0.3, 0.5, 0.8, 0.5, 200, 1600, 3, 2.5); // triton : tension
    const n = v.noise('white', t + 0.1, t + 1.5);
    const bp = v.filter('bandpass', 300, 2); const g2 = v.gain(0);
    sweep(bp.frequency, t + 0.1, 300, 5000, 1.2);
    v.chain(n, bp, g2, v.out); adsr(g2.gain, t + 0.1, 0.35 * o.g, 0.3, 0.1, 0.9, 1.0, 0.3);
    v.reverb(0.5);
  });

  // roomClear : résolution brève → 2 nappes (quinte puis octave) lowpass saturées + gonflement rose + réverbe.
  def('roomClear', 6, (o, t) => {
    const v = voice(o, 1.6, 6); if (!v) return;
    layerPluck(v, t, o, 196, 0.45, 0.7);
    layerPluck(v, t + 0.17, o, 294, 0.4, 0.7);
    layerMallet(v, t + 0.34, o, 392, 0.35, 1.1, false);
    layerThump(v, t + 0.34, o, 70, 40, 0.45, 0.3, 3);
    const n = v.noise('pink', t, t + 1.2); const lp = v.filter('lowpass', 800, 1.5); const g = v.gain(0);
    sweep(lp.frequency, t, 800, 4000, 0.6); v.chain(n, lp, g, v.out); adsr(g.gain, t, 0.18 * o.g, 0.3, 0.1, 0.8, 0.5, 0.4);
    v.reverb(0.45);
  });

  /* ==================================================================
     INTERFACE
     ================================================================== */

  // trapShot : tir d'une tourelle → claquement sec bandpassé 1,8 kHz + petit corps 220 Hz. Volontairement NON accordé :
  // une percussion sans hauteur ne peut pas frotter contre la piste. Remplace shootPistol, qui était le son de
  // l'arme du joueur — on ne distinguait pas ce qu'on tirait de ce qui nous tirait dessus.
  def('trapShot', 4, (o, t) => {
    const v = voice(o, 0.22, 4); if (!v) return;
    const n = v.noise('white', t, t + 0.09);
    const bp = v.filter('bandpass', 1800, 4); const g = v.gain(0);
    v.chain(n, bp, g, v.out); perc(g.gain, t, 0.5 * o.g, 0.002, 0.055);
    const b = v.osc('triangle', 220, t, t + 0.08); const g2 = v.gain(0);
    sweep(b.frequency, t, 220, 130, 0.06);
    v.chain(b, g2, v.out); perc(g2.gain, t, 0.22 * o.g, 0.002, 0.06);
  });

  // uiHover : survol → bruit blanc bandpass 3 kHz Q6 25 ms + tick FM 1500 Hz bandpassé, très discret.
  def('uiHover', 1, (o, t) => {
    const v = voice(o, 0.12, 1); if (!v) return;
    layerClick(v, t, o, 1800, 5, 0.14, 0.02);   // plus boisé, moins de sinusoïde
    layerThump(v, t, o, 260, 170, 0.12, 0.04, 2);
    const f = v.fm(1500 * o.p, 2200 * o.p, 200, t, t + 0.07);
    const bp = v.filter('bandpass', 2000 * o.p, 4); const sh = v.shaper(1.3); const g = v.gain(0);
    v.chain(f.car, bp, sh, g, v.out); perc(g.gain, t, 0.05 * o.g, 0.002, 0.045);
  });

  // uiClick : clic → bruit bandpass 1.2 kHz Q4 30 ms + sinus 600→300 Hz saturé lowpass 40 ms.
  def('uiClick', 2, (o, t) => {
    const v = voice(o, 0.15, 2); if (!v) return;
    layerClick(v, t, o, 1200, 4, 0.3, 0.03);
    layerThump(v, t, o, 600, 300, 0.2, 0.05, 3);
    v.reverb(0.06);
  });

  // tempoTick : compte à rebours de la salle du tempo → clic bandpass 2 kHz + petit coup grave ; intensité 1 = « GO » (double clic, plus haut).
  def('tempoTick', 3, (o, t) => {
    const v = voice(o, 0.3, 3); if (!v) return; const go = o.I >= 0.95;
    layerClick(v, t, o, go ? 2600 : 2000, 6, 0.4, 0.03);
    layerThump(v, t, o, go ? 420 : 300, go ? 220 : 160, 0.3, 0.09, 3);
    if (go) { layerClick(v, t + 0.07, o, 3200, 6, 0.3, 0.03); }
    v.reverb(0.1);
  });

  // tempoNote : note « en rythme » → FM pincée sur la hauteur demandée (o.hz, pentatonique de la piste), lowpass, courte queue.
  def('tempoNote', 3, (o, t) => {
    const v = voice(o, 0.5, 3); if (!v) return; const fq = o.hz || 294;
    const f = v.fm(fq, fq * 2.0, 320, t, t + 0.45);
    sweep(f.idx.gain, t, 320, 12, 0.18);
    const lp = v.filter('lowpass', 2600, 2); const sh = v.shaper(1.3); const g = v.gain(0);
    v.chain(f.car, lp, sh, g, v.out); perc(g.gain, t, 0.3 * o.g, 0.004, 0.32);
    layerClick(v, t, o, 3000, 5, 0.1, 0.01);
    v.reverb(0.2);
  });

  // tempoCue : avertisseur « un piège arrive » → deux notes montantes (quinte) en cloche douce + souffle, accordé sur la piste.
  def('tempoCue', 4, (o, t) => {
    const v = voice(o, 0.9, 4); if (!v) return; const f = (o.hz || 440) * o.p;
    layerMallet(v, t, o, f, 0.3, 0.5, true); layerMallet(v, t + 0.12, o, f * 1.5, 0.26, 0.6, true);
    const n = v.noise('pink', t, t + 0.4); const hp = v.filter('highpass', 3000, 1); const g = v.gain(0);
    v.chain(n, hp, g, v.out); perc(g.gain, t, 0.12 * o.g, 0.02, 0.3);
    v.reverb(0.35);
  });

  // bossBreath : souffle avant le boss (silence entre la coupure de la musique et le morceau de boss) → brun lowpass balayé 150→1400 Hz, gonflement 0,9 s, réverbe.
  def('bossBreath', 7, (o, t) => {
    const v = voice(o, 1.4, 7); if (!v) return;
    const b = v.noise('brown', t, t + 1.3); const lp = v.filter('lowpass', 150, 1.2); const g = v.gain(0);
    sweep(lp.frequency, t, 150, 1400, 0.9);
    v.chain(b, lp, g, v.out); adsr(g.gain, t, 0.7 * o.g, 0.75, 0.05, 0.9, 0.4, 0.2);
    layerThump(v, t + 0.95, o, 60, 34, 0.5, 0.25, 4);
    v.reverb(0.5);
  });

  // uiConfirm : validation → deux tons FM filtrés (500 puis 750 Hz) + souffle rose + petite réverbe.
  def('uiConfirm', 3, (o, t) => {
    const v = voice(o, 0.45, 3); if (!v) return;
    for (const [dt, fq] of [[0, 500], [0.09, 750]]) {
      const f = v.fm(fq * o.p, fq * 2.01 * o.p, 250, t + dt, t + dt + 0.3);
      sweep(f.idx.gain, t + dt, 250, 20, 0.12);
      const lp = v.filter('lowpass', 2200 * o.p, 3); const sh = v.shaper(1.5); const g = v.gain(0);
      v.chain(f.car, lp, sh, g, v.out); perc(g.gain, t + dt, 0.22 * o.g, 0.005, 0.22);
      layerClick(v, t + dt, o, 2500, 5, 0.12, 0.012);
    }
    const n = v.noise('pink', t, t + 0.35);
    const bp = v.filter('bandpass', 1200, 1.2); const g2 = v.gain(0);
    v.chain(n, bp, g2, v.out); perc(g2.gain, t, 0.1 * o.g, 0.02, 0.25);
    v.reverb(0.2);
  });

  /* ==================================================================
     MUSIQUE : fichiers (fetch + decodeAudioData, fallback <audio>)
     ================================================================== */
  const music = { cur: null, token: 0 };

  function makeTrackFromBuffer(buf, loop) {
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = !!loop;
    const g = ctx.createGain(); g.gain.value = 0;
    src.connect(g); g.connect(musicDuck); src.start();
    return { g, stop: () => { try { src.stop(); } catch (e) { /* */ } try { src.disconnect(); g.disconnect(); } catch (e) { /* */ } } };
  }
  function makeTrackFromElement(url, loop, offset) {
    const el = new Audio(); el.crossOrigin = 'anonymous'; el.loop = !!loop; el.preload = 'auto'; el.src = url;
    if (offset > 0) { const seek = () => { try { el.currentTime = offset; } catch (e) { /* */ } }; if (el.readyState >= 1) seek(); else el.addEventListener('loadedmetadata', seek, { once: true }); }
    const node = ctx.createMediaElementSource(el);
    const g = ctx.createGain(); g.gain.value = 0;
    node.connect(g); g.connect(musicDuck);
    const p = el.play(); if (p && p.catch) p.catch(() => { /* autoplay refusé : silencieux */ });
    return { g, el, stop: () => { try { el.pause(); el.src = ''; node.disconnect(); g.disconnect(); } catch (e) { /* */ } } };
  }
  function fadeTrack(track, to, seconds, thenStop) {
    const t = ctx.currentTime;
    track.g.gain.cancelScheduledValues(t);
    track.g.gain.setValueAtTime(Math.max(track.g.gain.value, 0.0001), t);
    track.g.gain.linearRampToValueAtTime(to, t + Math.max(seconds, 0.01));
    if (thenStop) setTimeout(track.stop, seconds * 1000 + 100);
  }

  /** Lance une piste avec crossfade depuis la précédente. Renvoie une promesse. */
  function playMusic(url, opts) {
    if (!ctx) return Promise.resolve(false);
    opts = opts || {};
    const fadeIn = isNum(opts.fadeIn) ? opts.fadeIn : 1.5;
    const fadeOut = isNum(opts.fadeOut) ? opts.fadeOut : fadeIn;
    const loop = opts.loop !== false;
    const token = ++music.token;
    stopGenerativeMusic(fadeOut);
    const start = (track) => {
      if (token !== music.token) { track.stop(); return false; }
      if (music.cur) fadeTrack(music.cur, 0.0001, fadeOut, true);
      music.cur = track;
      fadeTrack(track, 1, fadeIn, false);
      return true;
    };
    const viaElement = () => { try { return start(makeTrackFromElement(url, loop, isNum(opts.offset) ? opts.offset : 0)); } catch (e) { console.warn('[AudioEngine] playMusic', e); return false; } };
    if (opts.stream || typeof fetch !== 'function') return Promise.resolve(viaElement());   // stream : lecture immédiate via <audio>, sans télécharger tout le fichier
    return fetch(url)
      .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then((ab) => ctx.decodeAudioData(ab))
      .then((buf) => start(makeTrackFromBuffer(buf, loop)))
      .catch(() => viaElement());
  }
  function stopMusic(fade) {
    if (!ctx) return;
    music.token++;
    fade = isNum(fade) ? fade : 1;
    if (music.cur) { fadeTrack(music.cur, 0.0001, fade, true); music.cur = null; }
    stopGenerativeMusic(fade);
  }
  /** Baisse la musique de `amount` (0..1) pendant `seconds` puis remonte. */
  function duckMusic(amount, seconds) {
    if (!ctx) return;
    amount = clamp(isNum(amount) ? amount : 0.5, 0, 1); seconds = isNum(seconds) ? seconds : 1;
    const t = ctx.currentTime;
    musicDuck.gain.cancelScheduledValues(t);
    musicDuck.gain.setValueAtTime(musicDuck.gain.value, t);
    musicDuck.gain.linearRampToValueAtTime(1 - amount, t + 0.05);
    musicDuck.gain.setValueAtTime(1 - amount, t + 0.05 + seconds * 0.5);
    musicDuck.gain.linearRampToValueAtTime(1, t + 0.05 + seconds);
  }

  /* ==================================================================
     MUSIQUE GÉNÉRATIVE ORGANIQUE (fallback)
     Nappes : oscillateurs détunés → lowpass balayé lentement → tanh → réverbe.
     Percussions : bruit filtré sur une grille lente. Aucune mélodie.
     ================================================================== */
  const MOODS = {
    hub:   { root: 55,   bpm: 58,  chords: [[0, 7, 12, 16], [0, 5, 12, 15], [0, 7, 14, 19], [0, 3, 10, 15]], barsPerChord: 2, cutoff: [260, 900],  drive: 1.3, drums: 'soft', gain: 0.5 },
    biome: { root: 49,   bpm: 82,  chords: [[0, 3, 7, 12], [0, 5, 8, 15], [0, 3, 10, 14], [0, 2, 7, 12]],   barsPerChord: 2, cutoff: [350, 1600], drive: 1.8, drums: 'mid',  gain: 0.5 },
    boss:  { root: 41.2, bpm: 118, chords: [[0, 6, 12, 13], [0, 1, 7, 12], [0, 6, 11, 18], [0, 3, 6, 12]],   barsPerChord: 1, cutoff: [200, 2600], drive: 3.2, drums: 'hard', gain: 0.55 },
  };
  let gen = null;

  function genPad(t, chord) {
    const m = gen.m, o = { x: 0, p: 1, g: 1 };
    const len = m.barsPerChord * 4 * 60 / m.bpm;
    const v = voice(o, len + 4, 0, gen.out, false);
    const mix = v.gain(0.12);
    for (const semi of chord) {
      const f = m.root * Math.pow(2, semi / 12);
      for (const det of [-9, 8]) {
        const s = v.osc('sawtooth', f, t, t + len + 3.5); s.detune.value = det + rnd(-2, 2); s.connect(mix);
      }
      const sub = v.osc('sine', f / 2, t, t + len + 3.5); const subSh = v.shaper(2.5); const subG = v.gain(0.35);
      v.chain(sub, subSh, subG, mix);
    }
    const lp = v.filter('lowpass', m.cutoff[0], 1.4); const sh = v.shaper(m.drive); const g = v.gain(0);
    sweep(lp.frequency, t, m.cutoff[0], m.cutoff[1], len * 0.6); lp.frequency.exponentialRampToValueAtTime(m.cutoff[0], t + len + 2);
    v.lfo(0.11 + rnd(0, 0.05), m.cutoff[0] * 0.4, lp.frequency, t, t + len + 3.5);
    v.chain(mix, lp, sh, g, v.out); adsr(g.gain, t, m.gain, 1.6, 0.2, 1, len + 0.5, 2.5);
    v.reverb(0.55);
  }
  function genKick(t, gain) {
    const v = voice({ x: 0 }, 0.4, 0, gen.out, false);
    const b = v.noise('brown', t, t + 0.3); const lp = v.filter('lowpass', 100, 1.5); const g = v.gain(0);
    v.chain(b, lp, g, v.out); perc(g.gain, t, gain, 0.004, 0.22);
    const s = v.osc('sine', 60, t, t + 0.3); sweep(s.frequency, t, 70, 36, 0.15);
    const sh = v.shaper(3); const lp2 = v.filter('lowpass', 160, 1); const g2 = v.gain(0);
    v.chain(s, sh, lp2, g2, v.out); perc(g2.gain, t, gain * 0.8, 0.004, 0.2);
  }
  function genHat(t, gain) {
    const v = voice({ x: rnd(-0.3, 0.3) }, 0.12, 0, gen.out, false);
    const n = v.noise('white', t, t + 0.1); const hp = v.filter('highpass', 7500, 1); const g = v.gain(0);
    v.chain(n, hp, g, v.out); perc(g.gain, t, gain, 0.002, 0.05);
  }
  function genSnare(t, gain) {
    const v = voice({ x: 0 }, 0.3, 0, gen.out, false);
    const n = v.noise('white', t, t + 0.25); const bp = v.filter('bandpass', 1800, 1); const g = v.gain(0);
    v.chain(n, bp, g, v.out); perc(g.gain, t, gain, 0.003, 0.16);
    const b = v.noise('brown', t, t + 0.2); const lp = v.filter('lowpass', 350, 1); const g2 = v.gain(0);
    v.chain(b, lp, g2, v.out); perc(g2.gain, t, gain * 0.7, 0.003, 0.1);
    v.reverb(0.3);
  }
  function genShaker(t, gain) {
    const v = voice({ x: rnd(-0.6, 0.6) }, 0.2, 0, gen.out, false);
    const n = v.noise('pink', t, t + 0.18); const bp = v.filter('bandpass', 4000, 2); const g = v.gain(0);
    v.chain(n, bp, g, v.out); adsr(g.gain, t, gain, 0.05, 0.02, 0.8, 0.08, 0.06);
  }
  function genBeat(t, beat) {
    const m = gen.m, step = beat % 4, bar = Math.floor(beat / 4);
    if (beat % (m.barsPerChord * 4) === 0) genPad(t, m.chords[gen.chord++ % m.chords.length]);
    if (m.drums === 'soft') {
      if (step === 0 && bar % 2 === 0) genKick(t, 0.35);
      if (step === 2 && Math.random() < 0.5) genShaker(t, 0.06);
    } else if (m.drums === 'mid') {
      if (step === 0 || (step === 2 && Math.random() < 0.6)) genKick(t, 0.5);
      if (step === 1 || step === 3) genHat(t, 0.05 + Math.random() * 0.05);
      if (step === 2 && bar % 2 === 1) genSnare(t, 0.2);
    } else {
      genKick(t, 0.65);
      if (step === 1 || step === 3) genSnare(t, 0.35);
      genHat(t, 0.08); genHat(t + 30 / m.bpm, 0.05);
      if (Math.random() < 0.3) genHat(t + 45 / m.bpm, 0.06);
    }
  }
  function genTick() {
    if (!gen) return;
    try {
      while (gen.next < ctx.currentTime + 0.35) { genBeat(gen.next, gen.beat); gen.next += 60 / gen.m.bpm; gen.beat++; }
    } catch (e) { console.warn('[AudioEngine] génératif', e); }
  }
  function startGenerativeMusic(mood) {
    if (!ctx) return;
    try {
      stopGenerativeMusic(1.5);
      const m = MOODS[mood] || MOODS.hub;
      const out = ctx.createGain(); out.gain.value = 0.0001; out.connect(musicDuck);
      const t = ctx.currentTime;
      out.gain.setValueAtTime(0.0001, t); out.gain.linearRampToValueAtTime(1, t + 1.5);
      gen = { m, mood, out, next: t + 0.1, beat: 0, chord: 0, timer: null, nodes: [out] };
      // Texture de fond continue : bruit rose lowpass modulé très lentement → réverbe
      const amb = voice({ x: 0 }, Infinity, 0, out, false);
      const n = amb.noise('pink', t, Infinity); const lp = amb.filter('lowpass', 400, 2); const g = amb.gain(mood === 'boss' ? 0.08 : 0.06);
      amb.lfo(0.05, 250, lp.frequency, t, Infinity); amb.chain(n, lp, g, amb.out); amb.reverb(0.6);
      gen.amb = amb;
      if (m.drums === 'hard') { // drone FM grave saturé pour le boss (toujours filtré)
        const dr = voice({ x: 0 }, Infinity, 0, out, false);
        const f = dr.fm(m.root, m.root * 0.5, 40, t, Infinity);
        dr.lfo(0.2, 30, f.idx.gain, t, Infinity);
        const sh = dr.shaper(4); const lp2 = dr.filter('lowpass', 220, 3); const g2 = dr.gain(0.18);
        dr.lfo(0.13, 80, lp2.frequency, t, Infinity); dr.chain(f.car, sh, lp2, g2, dr.out); dr.reverb(0.3);
        gen.drone = dr;
      }
      genTick();
      gen.timer = setInterval(genTick, 120);
    } catch (e) { console.warn('[AudioEngine] startGenerativeMusic', e); gen = null; }
  }
  function stopGenerativeMusic(fade) {
    if (!ctx || !gen) return;
    const g = gen; gen = null;
    fade = isNum(fade) ? fade : 1;
    try {
      clearInterval(g.timer);
      const t = ctx.currentTime;
      g.out.gain.cancelScheduledValues(t); g.out.gain.setValueAtTime(g.out.gain.value, t);
      g.out.gain.linearRampToValueAtTime(0.0001, t + Math.max(fade, 0.01));
      const cleanup = () => { try { g.amb && g.amb.kill(); g.drone && g.drone.kill(); g.out.disconnect(); } catch (e) { /* */ } };
      if (fade > 0) setTimeout(cleanup, fade * 1000 + 100); else cleanup();
    } catch (e) { /* silencieux */ }
  }

  /* ------------------------------------------------------------------ */
  /* API publique                                                        */
  /* ------------------------------------------------------------------ */
  api.init = init;
  api.resume = resume;
  api.setVolume = setVolume;
  api.getVolume = getVolume;
  api.startFlame = startFlame;
  api.stopFlame = stopFlame;
  api.playMusic = playMusic;
  api.stopMusic = stopMusic;
  api.duckMusic = duckMusic;
  /* tonalité des sons accordés (posée par Beat à partir de tempo.json) */
  api.setKey = (rootHz, mode) => { if (isNum(rootHz) && rootHz > 20) key.root = rootHz; if (mode) key.mode = mode; };
  /* filtre passe-bas sur la musique (Hz), atteint en `seconds` */
  api.setMusicTone = (cutoff, seconds) => { if (!musicFilter) return; const t = ctx.currentTime; musicFilter.frequency.cancelScheduledValues(t); musicFilter.frequency.setTargetAtTime(clamp(cutoff, 120, 20000), t, Math.max(0.02, (seconds || 0.2) / 3)); };
  /* vitesse de lecture de la piste courante ; preservePitch false = la hauteur suit (bande qui freine) */

  fragments: [

    { id: 'deaths_3', title: 'Fragment 2 — Transcription intercom, Salle 4', cond: 'Mourir 3 fois.', text: 'GREFFIÈRE — Consignation acceptée. Crédits validés. Matrice mise à jour.\nSUJET — La sortie. Elle est où, la sortie.\nGREFFIÈRE — La sortie est à l\'issue de la case 9.\nSUJET — Et après la 9 ?\nGREFFIÈRE — Le formulaire s\'arrête à la case 9.\nSUJET — Ça veut dire quoi ?\nGREFFIÈRE — Que la question n\'a pas de case. Poursuivez.\n(Fin de transcription. Sujet réimprimé le lendemain, itération 12.)' },

const Content = (() => {
  /* index par id, construit à la demande. `invalidate` est indispensable dès qu'on ajoute du contenu à chaud
     (atelier « Amis ») : sans lui, un personnage créé en cours de partie reste introuvable et l'appel retombe
     silencieusement sur le premier de la liste. */
  const idx = {}; const byId = (k) => { if (!idx[k]) { idx[k] = {}; for (const o of (CONTENT[k] || [])) idx[k][o.id] = o; } return idx[k]; };
  const get = (k, id) => byId(k)[id] || null;
  function validate() {
    const warn = (...a) => console.warn('[Content]', ...a);
    CONTENT.characters.forEach((c, i) => { if (!c.sprite) c.sprite = i === 0 ? 'player' : 'player2'; });
    for (const c of CONTENT.characters) if (!get('weapons', c.startWeapon)) warn('arme de départ inconnue', c.id, c.startWeapon);
    for (const b of CONTENT.biomes) { if (!get('bosses', b.miniboss)) warn('mini-boss inconnu', b.miniboss); for (const e of b.enemyPool) if (!get('enemies', e)) warn('ennemi inconnu', e); for (const t of b.trapPool) if (!get('traps', t)) warn('piège inconnu', t); }
    for (const r of CONTENT.rooms) { if (!ROOM_TYPES[r.type]) warn('type de salle inconnu', r.id, r.type); for (const w of (r.waves || [])) for (const s of w.spawns) if (!get('enemies', s.enemy) && !get('bosses', s.enemy)) warn('spawn inconnu', r.id, s.enemy); for (const t of (r.traps || [])) if (!get('traps', t.trap)) warn('piège inconnu', r.id, t.trap); }
    for (const e of CONTENT.enemies) if (!ENEMY_ARCHETYPES.includes(e.archetype)) warn('archétype inconnu', e.id, e.archetype);
    for (const t of CONTENT.traps) if (!TRAP_KINDS.includes(t.kind)) warn('kind de piège inconnu', t.id, t.kind);
    for (const p of (CONTENT.pets || [])) if (!PET_BEHAVIORS.includes(p.behavior)) warn('comportement de compagnon inconnu', p.id, p.behavior);
    for (const u of CONTENT.upgrades) if (!RARITY[u.rarity]) warn('rareté inconnue', u.id, u.rarity);
  }
  return {
    validate,
    characters: () => CONTENT.characters, character: id => get('characters', id) || CONTENT.characters[0],
    weapons: () => CONTENT.weapons, weapon: id => get('weapons', id),
    skills: () => CONTENT.skills, skill: id => get('skills', id),
    skillsAvailable: () => CONTENT.skills.filter(s => Meta.skillUnlocked(s.id)),
    upgrades: () => CONTENT.upgrades, upgrade: id => get('upgrades', id),
    metaPassives: () => CONTENT.metaPassives, metaPassive: id => get('metaPassives', id),
    biomes: () => CONTENT.biomes.slice().sort((a, b) => a.order - b.order), biome: id => get('biomes', id) || CONTENT.biomes[0],
    enemies: () => CONTENT.enemies, enemy: id => get('enemies', id),
    bosses: () => CONTENT.bosses, boss: id => get('bosses', id),
    invalidate: () => { for (const k in idx) delete idx[k]; },
    traps: () => CONTENT.traps, trap: id => get('traps', id),
    pets: () => CONTENT.pets || [], pet: id => get('pets', id),
    rooms: () => CONTENT.rooms, roomsOf: biome => CONTENT.rooms.filter(r => r.biome === biome).sort((a, b) => a.index - b.index),
    pick: key => LORE[key] ? LORE[key][Math.floor(VFX_RNG() * LORE[key].length)] : '',
    lore: LORE,
  };
})();

  knockback: 'Recul', armor: 'Armure', regen: 'Régénération', dodge: 'Esquive', lifesteal: 'Vol de vie', thorns: 'Épines',
  trapDamageMul: 'Dégâts de pièges subis', xpGain: 'Gain d\'XP', coinGain: 'Gain de crédits', luck: 'Chance', cooldownReduction: 'Réduction de cooldown',
  pickupRadius: 'Rayon de ramassage', skillPower: 'Puissance de compétence', invulnTime: 'Invulnérabilité',

  'shield_on_room', 'heal_on_room', 'reroll_on_levelup', 'traps_heal', 'projectiles_return', 'orbit_shield', 'glass_cannon', 'double_skill',
  'time_slow_on_damage', 'fragments_double', 'second_chance', 'crit_explode', 'kill_speed', 'xp_magnet', 'bullet_time_skill', 'skill_reset_on_kill', 'charge_speed', 'speed_burst',

})();

/* ---------- Combat : point d'entrée de tous les dégâts ---------- */
const Combat = {
  hitEnemy(e, dmg, info = {}) {

    let d = dmg;

    }
    if (!info.dot && e.status && e.status.freeze) { const fb = Progression.hasPassive(pl.hooks, 'frost_bonus'); if (fb) d *= fb.mul || 1.3; }
    if (e.markUntil > Time.now) d *= e.markMul || 1.3;   // désigné par un compagnon guetteur

      Particles.spawn(e.x, e.y, { count: info.crit ? 8 : 4, color: info.crit ? '#ffd166' : e.color, size: 2, speedMax: 120 });
      Floaters.add(e.x + VFX_RNG.range(-8, 8), e.y - e.r - 4, String(d), info.crit ? '#ffd166' : '#fff', info.crit ? 16 : 12);

        else if (h.effect === 'poison' && RNG.chance(chance)) applyStatus(e, 'poison', h);
        else if (h.effect === 'chain' && RNG.chance(chance) && !info.chained) Combat.chain(e, d * (h.damageMul || 0.5), h.jumps || 2, h.radius || 180);
        else if (h.effect === 'crit_explode' && info.crit && !info.explosion) Combat.explosion(e.x, e.y, (h.radius || 70) * pl.stats.areaSize, d * (h.damageMul || 0.6), '#ffb347', true);

  chain(from, dmg, jumps, radius) {

  explosion(x, y, radius, dmg, color = '#ff8c42', fromPlayer = true) {

      else if (h.effect === 'coin_on_kill' && RNG.chance(h.chance || 0.2)) Pickups.spawn(e.x, e.y, 'coin', h.amount || 1);

  hitPlayer(dmg, info = {}) {

    if (pl.dashing && pl.dashInvuln) return false;
    if (info.type === 'trap') {
      dmg *= pl.stats.trapDamageMul;   // la difficulté est déjà appliquée dans Trap (G.difficulty.damageMul)
      const heal = Progression.hasPassive(pl.hooks, 'traps_heal');
      if (heal) { pl.heal(Math.max(1, dmg * (heal.fraction || 0.5))); pl.invulnUntil = Time.now + 0.3; Floaters.add(pl.x, pl.y - 30, 'greffe !', '#7fff9a'); return false; }

  },
  collect(p) {

    else if (p.kind === 'pet') { Pets.give(p.pet); }
    else if (p.kind === 'relic') { const rl = RELICS.find(r => r.id === p.relic) || RELICS[0]; rl.apply(pl); UI.banner(rl.name, '#c9a3ff', rl.desc); AudioEngine.levelUp({ intensity: 0.6 }); }
  },
};

/* ---------- Armes ---------- */
const WEAPON_COLORS = { blade: '#e8ecf7', hammer: '#ffb347', bow: '#c8ff5a', pistol: '#ffe9a8', boomerang: '#7ef0ff', orb: '#c9a3ff', chain: '#b3e5ff', flame: '#ff8c42' };

  /* Appelé chaque pas quand le joueur tient le tir. Retourne true si une attaque a été déclenchée. */
  update(pl, dt, firing, aim) {
    const w = pl.weapon; const st = pl.stats; if (!w) return;   // écran de préparation : pas encore d'arme
    const rate = w.fireRate * st.fireRate;
    pl.attackCd -= dt; pl.beatMul = 1;
    if (w.type === 'orbital') { Weapons.orbital(pl, dt, firing); return; }
    if (w.family === 'bow') {
      const ch = w.charge || { min: 0.15, max: 0.9, damageMul: 3 };
      if (firing && pl.attackCd <= 0) { const cs = Progression.hasPassive(pl.hooks, 'charge_speed'); pl.charge = Math.min(ch.max, pl.charge + dt * (cs ? (cs.mul || 1.4) : 1)); }
      else if (pl.charge > 0) { const t = clamp((pl.charge - ch.min) / Math.max(0.01, ch.max - ch.min), 0, 1); pl.beatMul = Tempo.playerAction(pl, 'shot'); Weapons.shoot(pl, aim, { damageMul: lerp(1, ch.damageMul, t), speedMul: lerp(0.8, 1.4, t), extraPierce: t >= 0.99 ? ((w.special && w.special.chargedPierceBonus) || 1) : 0, kind: 'arrow', size: 4 + 3 * t }); pl.charge = 0; pl.attackCd = 1 / rate; }
      return;
    }
    if (!firing) { if (pl.flameOn) { pl.flameOn = false; AudioEngine.stopFlame(); } return; }
    if (w.family === 'flame') { Weapons.flame(pl, dt, aim, rate); return; }
    if (pl.attackCd > 0) return;
    pl.attackCd = 1 / rate; pl.beatMul = Tempo.playerAction(pl, 'shot');
    if (w.family === 'chain' || (w.special && w.special.kind === 'chain')) Weapons.chainStrike(pl, aim);
    else if (w.type === 'melee' || w.type === 'area') Weapons.melee(pl, aim);
    else Weapons.shoot(pl, aim, {});
  },
  dmgOf(pl, mul = 1) { return pl.weapon.damage * pl.stats.damage * mul * (pl.beatMul || 1); },
  shoot(pl, aim, o) {
    const w = pl.weapon, st = pl.stats;
    const n = (w.projectiles || 1) + st.projectiles; const spread = (w.spread || 0) + (n > 1 ? 0.12 * (n - 1) : 0);
    const spd = (w.projSpeed || 520) * st.projSpeed * (o.speedMul || 1);
    const canReturn = w.special && w.special.kind === 'return' || !!Progression.hasPassive(pl.hooks, 'projectiles_return');
    const hom = Progression.hasPassive(pl.hooks, 'homing'); const rear = Progression.hasPassive(pl.hooks, 'rear_shot');
    const angles = []; for (let i = 0; i < n; i++) angles.push(aim + (n > 1 ? lerp(-spread / 2, spread / 2, i / (n - 1)) : 0) + RNG.range(-0.02, 0.02));
    if (rear) angles.push(aim + Math.PI);

      const a = angles[i]; const isRear = rear && i === angles.length - 1;
      Projectiles.spawn({
        x: pl.x + Math.cos(a) * (pl.r + 6), y: pl.y + Math.sin(a) * (pl.r + 6), vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, speed: spd,
        r: (o.size || w.size || 5), damage: Weapons.dmgOf(pl, (o.damageMul || 1) * (isRear ? (rear.damageMul || 0.5) : 1)), owner: 'player',
        pierce: (w.pierce || 0) + st.pierce + (o.extraPierce || 0), bounce: (w.bounce || 0) + st.bounce,
        range: (w.range || 500) * st.range, life: 3, color: w.color || WEAPON_COLORS[w.family] || '#ffe9a8', kind: o.kind || (w.family === 'boomerang' ? 'boomerang' : 'bullet'),
        canReturn, knockback: w.knockback || 1, spin: w.family === 'boomerang' ? 0 : null, ghostHits: w.family === 'boomerang',
        homing: w.special && w.special.kind === 'homing' ? (w.special.turn || 3) : (hom ? (hom.turn || 2.5) : 0), seekOnBounce: !!(w.special && w.special.seekOnBounce), seekRadius: w.special && w.special.seekRadius,
      });
    }
    const snd = { blade: 'shootBlade', hammer: 'shootHammer', bow: 'shootBow', pistol: 'shootPistol', boomerang: 'shootBoomerang', orb: 'shootOrb', chain: 'shootChain', flame: 'shootFlame' }[w.family] || 'shootPistol';
    AudioEngine[snd]({ x: (pl.x - W / 2) / (W / 2) });

  },
  melee(pl, aim) {

      else { const d = dist(pl.x, pl.y, e.x, e.y); if (d > range + e.r) continue; const da = Math.abs(wrapAngle(angleTo(pl.x, pl.y, e.x, e.y) - aim)); if (da > arc / 2 + Math.atan2(e.r, Math.max(1, d))) continue; }

        const mv = pl.moveDir.x || pl.moveDir.y ? Math.atan2(pl.moveDir.y, pl.moveDir.x) : aim; pl.dashVx = Math.cos(mv) * d / pl.dashDur; pl.dashVy = Math.sin(mv) * d / pl.dashDur;

      case 'shockwave': Combat.playerShockwave({ radius: (e.radius || 160), damage: (e.damage || 25), knockback: e.knockback || 3 }); for (const en of G.enemies) if (!en.dead && dist(pl.x, pl.y, en.x, en.y) < (e.radius || 160) * pw) en.stunUntil = Time.now + (e.stun || 0.8); break;

      case 'turret': G.room.turrets.push({ x: pl.x, y: pl.y, until: Time.now + (s.duration || 8), cd: 0, rate: e.fireRate || 3, damage: (e.damage || 8) * pl.stats.damage * pw, range: e.range || 380, hp: 1 }); AudioEngine.skillTurret({}); break;

      case 'decoy': G.room.decoys.push({ x: pl.x, y: pl.y, until: Time.now + (s.duration || 5), hp: (e.hp || 60) * pw, r: 14, explode: e.explode }); AudioEngine.skillTurret({}); break;

    }

    return true;
  },
  dashHook(pl, h) {
    if (h.effect === 'fire_trail') pl.trail = { until: Time.now + 0.35, dps: h.dps || 20, duration: h.duration || 2 };
    else if (h.effect === 'shockwave') Combat.playerShockwave(h);
  },

<script>
/* ==== 31_pets.js ==== */
/* =========================================================================
   SALLE ZÉRO — 31_pets.js — compagnons
   Un animal ramassé en cours de run suit le joueur jusqu'à la fin du niveau. Il n'a qu'un comportement, mais il le
   joue EN MESURE : le faucon pique sur le temps, le chien mord sur le temps, le crapaud soigne sur le temps fort.
   C'est ce qui les distingue d'une tourelle : on les entend arriver.

   Un compagnon ne meurt jamais. Celui qui attire les coups (le chien) peut être assommé et revient au bout de
   quelques secondes — perdre définitivement son animal au milieu d'une run serait une punition sans rattrapage.
   ========================================================================= */

const PET_BEHAVIORS = ['strike', 'bite', 'spit', 'collect', 'guard', 'mend', 'charge', 'mark', 'sting'];

class Pet {
  constructor(def) {
    this.def = def; this.id = def.id; this.name = def.name; this.color = def.color || '#9fd8ff';
    const pl = G.player; this.x = pl ? pl.x - 34 : W / 2; this.y = pl ? pl.y : H / 2;
    this.r = clamp((def.size || 48) * 0.28, 8, 26);   // l'emprise suit la taille : un gros animal se cogne comme un gros animal
    this.t = 0; this.act = 0; this.facing = 1; this.moving = false;
    this.state = 'follow'; this.target = null; this.lastBeat = -1; this.blocks = 0;
    this.rollA = 0; this.rollT = 0; this.rolled = new Set();
    this.px = this.x; this.py = this.y; this.dx = 1; this.dy = 0;   // déplacement réel de la dernière image : donne la vue à afficher
    this.maxHp = def.hp || 0; this.hp = this.maxHp; this.downT = 0;
  }
  get airborne() { return !!this.def.fly || this.state === 'roll'; }
  get down() { return this.downT > 0; }
  get taunts() { return !!this.def.taunt && !this.down; }
  dmg() { return Math.round(this.def.damage * (G.player ? G.player.stats.damage : 1)); }
  /* replacé à côté du joueur : changement de salle, ou trop distancé */
  snap() { const pl = G.player; if (!pl) return; this.x = pl.x - 34; this.y = pl.y; this.state = 'follow'; this.target = null; }
  /* vrai une fois par temps utile (tous les `every` temps) */
  beatTick() {
    const b = Beat.index(); if (b === this.lastBeat) return false; this.lastBeat = b;
    return ((b % (this.def.every || 4)) + (this.def.every || 4)) % (this.def.every || 4) === 0;
  }
  hurt(d) {
    if (!this.maxHp || this.down) return;
    this.hp -= d; Floaters.add(this.x, this.y - 20, Math.round(d), '#ff9a9a', 12);
    if (this.hp <= 0) { this.hp = 0; this.downT = this.def.revive || 6; this.state = 'follow'; this.target = null; AudioEngine.uiBack && AudioEngine.uiBack({ intensity: 0.5 }); UI.toast(this.name + ' est sonné'); }
  }
  /* déplacement de suite : rejoint le joueur au-delà de `dist`, se pose en deçà */
  follow(dt, mult) {

    if (d > want) {

      this.x += Math.cos(a) * sp * dt; this.y += Math.sin(a) * sp * dt; this.facing = Math.cos(a) > 0 ? 1 : -1; this.moving = true;

  update(dt) {

    if (this.downT > 0) { this.downT -= dt; if (this.downT <= 0) { this.hp = this.maxHp; this.snap(); UI.toast(this.name + ' est de retour'); } this.moving = false; return; }
    const tick = this.beatTick(); const pl = G.player;
    switch (this.def.behavior) {
      /* --- faucon : pique sur l'ennemi le plus proche, revient ensuite --- */
      case 'strike': {
        if (this.state === 'dive') {
          const t = this.target;

          this.x += Math.cos(a) * sp * dt; this.y += Math.sin(a) * sp * dt; this.facing = Math.cos(a) > 0 ? 1 : -1; this.moving = true;
          if (dist(this.x, this.y, t.x, t.y) < t.r + this.r) {
            Combat.hitEnemy(t, this.dmg(), { x: t.x, y: t.y, knockback: this.def.knockback || 1.4, silent: true });
            Particles.spawn(t.x, t.y, { count: 7, color: this.color, glow: true, speedMax: 160, life: 0.35, size: 2 });
            AudioEngine.trapShot({ x: (this.x - W / 2) / (W / 2), intensity: 0.35 });

          }
        } else { this.follow(dt); if (tick) { const e = nearestEnemy(this.x, this.y, this.def.range || 340); if (e) { this.target = e; this.state = 'dive'; } } }
        break;
      }
      /* --- chien : court au contact, mord en mesure, et attire les coups --- */
      case 'bite': {
        const e = nearestEnemy(this.x, this.y, this.def.range || 260);
        if (e) {
          const a = angleTo(this.x, this.y, e.x, e.y); const d = dist(this.x, this.y, e.x, e.y);
          if (d > e.r + this.r + 4) { const sp = this.def.speed || 300; this.x += Math.cos(a) * sp * dt; this.y += Math.sin(a) * sp * dt; this.facing = Math.cos(a) > 0 ? 1 : -1; this.moving = true; }
          else { this.moving = false; if (tick) { Combat.hitEnemy(e, this.dmg(), { x: e.x, y: e.y, knockback: this.def.knockback || 2, silent: true }); Particles.spawn(e.x, e.y, { count: 5, color: this.color, speedMax: 120, life: 0.3, size: 2 }); this.act = 1; } }

      }
      /* --- scarabée : aimante les ramassables autour de lui --- */

        if (tick) this.act = Math.max(this.act, 0.5);
        break;
      }
      /* --- tortue : tourne autour du joueur et brise les tirs ennemis --- */
      case 'guard': {

        this.x = pl.x + Math.cos(a) * R; this.y = pl.y + Math.sin(a) * R; this.facing = Math.cos(a) > 0 ? 1 : -1; this.moving = true;
        if (tick) this.blocks = this.def.block || 2;
        for (let i = Projectiles.list.length - 1; i >= 0 && this.blocks > 0; i--) {
          const p = Projectiles.list[i]; if (p.owner === 'player') continue;
          if (dist(p.x, p.y, this.x, this.y) < p.r + this.r + 4) {
            Projectiles.list.splice(i, 1); this.blocks--; this.act = 1;
            Particles.spawn(p.x, p.y, { count: 5, color: this.color, glow: true, speedMax: 140, life: 0.3, size: 2 });
            AudioEngine.uiBack && AudioEngine.uiBack({ intensity: 0.25 });
          }
        }
        break;
      }
      /* --- tatou : se roule en boule et traverse la salle en ligne droite, blessant tout sur son passage --- */
      case 'charge': {
        if (this.state === 'roll') {
          const sp = this.def.rollSpeed || 560;
          this.x += Math.cos(this.rollA) * sp * dt; this.y += Math.sin(this.rollA) * sp * dt; this.moving = true; this.act = 1;
          for (const e of G.enemies) {
            if (e.dead || this.rolled.has(e) || dist(this.x, this.y, e.x, e.y) > e.r + this.r) continue;
            this.rolled.add(e); Combat.hitEnemy(e, this.dmg(), { x: e.x, y: e.y, knockback: this.def.knockback || 3, silent: true });
            Particles.spawn(e.x, e.y, { count: 6, color: this.color, speedMax: 150, life: 0.3, size: 2 });
          }
          this.rollT -= dt;
          if (this.rollT <= 0 || this.x < ROOM_X || this.y < ROOM_Y || this.x > ROOM_X + ROOM_W || this.y > ROOM_Y + ROOM_H) { this.state = 'follow'; this.act = 0; }
        } else {
          this.follow(dt);
          if (tick) {
            const e = nearestEnemy(this.x, this.y, this.def.range || 420);
            if (e) { this.rollA = angleTo(this.x, this.y, e.x, e.y); this.facing = Math.cos(this.rollA) > 0 ? 1 : -1; this.rolled = new Set(); this.rollT = this.def.rollTime || 0.8; this.state = 'roll'; AudioEngine.trapSaw && AudioEngine.trapSaw({ intensity: 0.3 }); }
          }
        }
        break;
      }
      /* --- chouette : désigne une cible, qui encaisse davantage tant qu'elle est marquée --- */
      case 'mark': {
        this.follow(dt);
        if (this.target && (this.target.dead || this.target.markUntil <= Time.now)) this.target = null;
        if (tick) {
          const e = nearestEnemy(this.x, this.y, this.def.range || 420, x => x !== this.target);
          const t = e || nearestEnemy(this.x, this.y, this.def.range || 420);
          if (t) {
            t.markUntil = Time.now + (this.def.markTime || 4); t.markMul = this.def.markMul || 1.3;
            this.target = t; this.act = 1;
            Particles.spawn(t.x, t.y - 24, { count: 6, color: this.color, glow: true, speedMax: 60, life: 0.6, size: 2 });
          }
        }
        break;
      }
      /* --- abeille : tourne autour de l'ennemi le plus proche et pique sans relâche --- */
      case 'sting': {
        const e = nearestEnemy(this.x, this.y, this.def.range || 300);

        const tx = e.x + Math.cos(a) * (e.r + R), ty = e.y + Math.sin(a) * (e.r + R);
        const sp = this.def.speed || 420; const d = dist(this.x, this.y, tx, ty);

        this.facing = Math.cos(a) > 0 ? 1 : -1; this.moving = true;
        /* la piqûre porte jusqu'au rayon d'orbite : sinon l'abeille tourne juste au-delà de sa propre portée */
        if (tick && dist(this.x, this.y, e.x, e.y) < e.r + R + 10) {
          Combat.hitEnemy(e, this.dmg(), { x: this.x, y: this.y, knockback: 0.2, silent: true, noCrit: true });
          Particles.spawn(this.x, this.y, { count: 3, color: this.color, speedMax: 80, life: 0.25, size: 2 }); this.act = 1;
        }
        break;
      }
      /* --- crapaud : soigne sur le temps fort --- */
      case 'mend': {
        this.follow(dt);
        if (tick && pl.hp < pl.stats.maxHp && !pl.dead) {
          const h = this.def.heal || 4; pl.heal(h); this.act = 1;
          Floaters.add(pl.x, pl.y - 34, '+' + h, '#7fff9a', 13);
          Particles.spawn(this.x, this.y - 8, { count: 4, color: '#7fff9a', glow: true, speedMax: 70, life: 0.5, size: 2 });

  }

      ctx.beginPath(); ctx.arc(this.x, this.y - bob - lift, s * 0.24, 0, TAU); ctx.fill(); ctx.restore();
    }

    }

}

const Pets = {
  /* donne un compagnon (remplace celui en cours) */
  give(id, silent) {
    const def = Content.pet(id); if (!def) return null;
    G.pet = new Pet(def);
    if (!silent) { UI.banner(def.name, def.color || '#9fd8ff', def.desc); AudioEngine.levelUp({ intensity: 0.5 }); }
    return G.pet;
  },
  clear() { G.pet = null; },
  update(dt) { if (G.pet && G.player && G.room) G.pet.update(dt); },
  render(ctx) { if (G.pet) G.pet.render(ctx); },
  /* dégâts pris par un compagnon qui attire les coups */
  hurt(d) { if (G.pet) G.pet.hurt(d); },
  /* badge du compagnon, au-dessus de la ligne arme/compétence */
  renderHud(ctx) {
    const p = G.pet; if (!p) return;
    const x = 16, y = H - 108;
    ctx.save();
    ctx.fillStyle = 'rgba(8,10,18,.72)'; UI.roundRect(ctx, x, y, 168, 30, 8); ctx.fill();
    if (!Sprites.drawProp(ctx, Sprites.pickDir(p.def.sprite, 's'), x + 18, y + 15, 24, 24, { alpha: p.down ? 0.4 : 1 })) { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(x + 18, y + 15, 7, 0, TAU); ctx.fill(); }

    ctx.fillText(p.name, x + 36, y + 14);
    ctx.fillStyle = '#8a93ad'; ctx.font = '10px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(p.down ? 'sonné — ' + Math.ceil(p.downT) + ' s' : (p.def.tag || ''), x + 36, y + 25);
    ctx.restore();
  },
};

<script>
/* ==== 32_enemies.js ==== */
/* =========================================================================
   SALLE ZÉRO — 32_enemies.js

<script>
/* ==== 33_anim.js ==== */
/* =========================================================================
   SALLE ZÉRO — 33_anim.js — décor animé en rythme
   Des éléments sans collision ni dégât, pilotés par la même partition que les pièges (`beats.hits`) : dalles qui
   changent de couleur ou qui se soulèvent, accessoires qui tournent ou qui sautent, lumières colorées, ondes.
   Ils ne blessent jamais — c'est la lecture de la salle qu'ils portent, pas la difficulté.
   ========================================================================= */

/* Coup en cours et coup suivant dans une partition triée, par dichotomie.
   `at` / `idx` : le dernier coup à ou avant `t` (celui de la boucle précédente si `t` tombe avant le premier) ;
   `nextAt` / `nextIdx` : le suivant. Indices croissants dans le temps, donc utilisables comme repère de tir. */
function hitAround(hits, t, P, loop) {
  const n = hits.length;
  let lo = 0, hi = n - 1, i = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (hits[m] <= t) { i = m; lo = m + 1; } else hi = m - 1; }
  const at = i < 0 ? hits[n - 1] - P : hits[i];
  const idx = (i < 0 ? loop - 1 : loop) * n + (i < 0 ? n - 1 : i);
  const j = i + 1;
  const nextAt = j >= n ? hits[0] + P : hits[j];
  const nextIdx = (j >= n ? loop + 1 : loop) * n + (j >= n ? 0 : j);
  return { at, idx, nextAt, nextIdx };
}

/* enveloppe rythmique commune : `since` = temps écoulé depuis le dernier coup, `k` = 0 au coup → 1 au bout de `active` */
function beatPulse(b, rt) {
  const L = Beat.beatLen(); const bars = b.bars || 1; const P = bars * 4 * L;
  const src = (b.hits && b.hits.length) ? b.hits : [0];
  if (b.__L !== L || !b.__sec) { b.__L = L; b.__sec = src.map(h => h * L); }   // conversion en secondes refaite seulement quand le tempo change
  const hits = b.__sec;

const ANIM_DEFS = {
  tile_color: { name: 'Dalles colorées', size: [1, 1], act: 1, color: '#6ee7ff', cells: true },
  tile_lift:  { name: 'Dalles qui montent', size: [1, 1], act: 1, color: '#8a94b0', cells: true },
  spinner:    { name: 'Rotatif', size: [1, 1], act: 1, color: '#ffd166', sprite: 1 },
  bouncer:    { name: 'Sauteur', size: [1, 1], act: 1, color: '#7fff9a', sprite: 1 },
  light:      { name: 'Lumière', size: [1, 1], act: 2, color: '#c9a3ff' },
  ring:       { name: 'Onde', size: [1, 1], act: 1, color: '#6ee7ff' },

const Anim = {
  compile(room, def) { room.anims = (def.anims || []).map(a => new AnimProp(a)); },
  render(ctx, room) { if (!room.anims) return; for (const a of room.anims) a.render(ctx, Room.trapTime(room, a)); },

<script>

  /* --- saw_rail : scie qui suit des points de passage --- */
  /* longueur totale du rail en px : sert à convertir « un aller en N temps » en px/s */

  /* --- laser_beam : rayon fixe posé sur un mur, qui s'allume et s'éteint sur la partition ---

}

<script>
/* ==== 35_terrain.js ==== */
/* =========================================================================
   WAY — 35_terrain.js
   Couche de terrain : une salle déclare un plan ASCII (13 lignes de 24 caractères), compilé au chargement en
   une grille `room.grid` (un code par tuile) et en rectangles poussés dans `room.obstacles`.

   Pourquoi une grille plutôt qu'une liste d'entités : `pointBlocked` et `lineOfSight` sont appelés une fois par
   ennemi et par image (jusqu'à 60 ennemis), et bouclaient sur toute la liste d'obstacles. Une lecture de tableau
   coûte moins cher qu'une boucle, donc ajouter du terrain ne coûte rien en performances.

   Le point clé : « bloque les pas », « arrête les balles » et « coupe la vue » sont trois choses distinctes.
   Un muret arrête le joueur mais pas les balles ; un moucharabieh coupe la vue mais laisse tout passer.
   Les obstacles portent donc `stopsShot` et `blocksSight` (absents = vrai, comportement d'avant).
   ========================================================================= */

const TERRAIN = {
  /* ch : caractère du plan · solid : bloque les pas · stopsShot : arrête les balles · blocksSight : coupe la vue
     speed : multiplicateur de vitesse en surface · dashOver : franchissable pendant le dash du joueur */
  '.': { id: 0, name: 'floor' },
  '#': { id: 1, name: 'wall', solid: true, stopsShot: true, blocksSight: true },
  'n': { id: 2, name: 'ledge', solid: true, stopsShot: false, blocksSight: false, dashOver: true },
  ':': { id: 3, name: 'screen', blocksSight: true, speed: 0.9 },
  '=': { id: 4, name: 'bridge' },
  '~': { id: 5, name: 'water', speed: 0.72 },
  ',': { id: 6, name: 'mud', speed: 0.55 },
};
const TERRAIN_BY_ID = []; for (const ch in TERRAIN) { TERRAIN_BY_ID[TERRAIN[ch].id] = Object.assign({ ch }, TERRAIN[ch]); }

const Terrain = (() => {

<script>
/* ==== 38_challenges.js ==== */
/* =========================================================================
   WAY — 38_challenges.js
   Défis de salle : salle 2 (« salle aléatoire », toujours un défi), salles 6 et 7 (60 %) :
   capture (tenir 3 zones), collapse (le sol s'effondre, tenir jusqu'à 40 % de surface),
   switches (3 interrupteurs dans l'ordre, récompense), lights (lumières coupées), timer (chrono, enragés après).

const CHALLENGE_DEFS = {
  capture:  { name: 'Capture de zone', desc: 'Tenez la zone pour remplir la jauge, trois zones de suite. Porte fermée tant que les zones ne sont pas prises. Renforts au corps à corps. Kills dans la zone : +50 % d\'XP.', rooms: ['COMBAT_CHALLENGE', 'COMBAT_MODULAR', 'COMBAT_TRAP_MODULAR'], color: '#7fff9a' },
  collapse: { name: 'Sol qui s\'effondre', desc: 'Des dalles tombent par paquets pendant tout le combat, jusqu\'à la moitié du sol. Les ennemis tombent aussi. Tuez les vagues : la porte s\'ouvre et une passerelle se déploie.', rooms: ['COMBAT_CHALLENGE', 'COMBAT_MODULAR', 'COMBAT_TRAP_MODULAR'], color: '#ffb347', replacesTraps: true },
  switches: { name: 'Séquence', desc: 'Activez les 3 interrupteurs dans l\'ordre affiché ET tuez les vagues : la porte ne s\'ouvre qu\'avec les deux. Décharge en cas d\'erreur.', rooms: ['COMBAT_CHALLENGE', 'COMBAT_MODULAR', 'COMBAT_TRAP_MODULAR'], color: '#c9a3ff' },
  lights:   { name: 'Lumières coupées', desc: 'Noir complet : des projecteurs balaient la salle en musique, à vous de suivre la lumière. Les ennemis se trahissent par leurs yeux. Tuer dans la lumière : +50 % d\'XP. XP +25 %.', rooms: ['COMBAT_CHALLENGE', 'COMBAT_MODULAR', 'COMBAT_TRAP_MODULAR'], color: '#9fd8ff' },
  timer:    { name: 'Chrono', desc: 'Finissez en moins de 60 s : prime de crédits. Après, tout ce qui reste s\'enrage.', rooms: ['COMBAT_CHALLENGE', 'COMBAT_MODULAR', 'COMBAT_TRAP_MODULAR'], color: '#ff5e7a' },
};
const CHALLENGE_ROOMS = [2, 6];   // salle 2 : toujours un défi ; 6 : 60 % de chance (la salle 7 est la salle du tempo)
const CHALLENGE_CHANCE = 0.6;

const Challenge = (() => {
  const tileFree = (tx, ty, room) => !room.obstacles.some(o => tx >= o.x && tx < o.x + o.w && ty >= o.y && ty < o.y + o.h);
  const randFreeTile = (room, rng, margin = 2) => { for (let k = 0; k < 40; k++) { const tx = rng.int(margin, ROOM_COLS - 1 - margin), ty = rng.int(margin, ROOM_ROWS - 1 - margin); if (tileFree(tx, ty, room)) return { x: tx, y: ty }; } return { x: 12, y: 6 }; };

  /* choix du défi pour une salle (null si aucun) */
  function pick(def, rng, used) {
    if (!CHALLENGE_ROOMS.includes(def.index)) return null;
    if (G.debug.forceChallenge) return G.debug.forceChallenge === 'none' ? null : G.debug.forceChallenge;
    if (def.type !== 'COMBAT_CHALLENGE' && !rng.chance(CHALLENGE_CHANCE)) return null;
    let ids = Object.keys(CHALLENGE_DEFS).filter(id => CHALLENGE_DEFS[id].rooms.includes(def.type) && !used.includes(id));
    if (!ids.length && def.type === 'COMBAT_CHALLENGE') ids = Object.keys(CHALLENGE_DEFS).filter(id => CHALLENGE_DEFS[id].rooms.includes(def.type));
    return ids.length ? rng.pick(ids) : null;
  }
  function create(id, room) {
    const d = CHALLENGE_DEFS[id]; const c = { id, def: d, done: false, t: 0, hud: '' };
    const rng = RNG;

      c.zones = []; for (let i = 0; i < 3; i++) { let p; for (let k = 0; k < 20; k++) { p = randFreeTile(room, rng, 3); if (!c.zones.some(z => dist(z.x, z.y, tileX(p.x), tileY(p.y)) < 300)) break; } c.zones.push({ x: tileX(p.x), y: tileY(p.y) }); }
      c.zi = 0; c.gauge = 0; c.r = 3 * TILE; c.reinforceT = 5; c.reinforceEvery = 6;
    } else if (id === 'collapse') {
      c.holes = new Set(); c.warn = new Map(); c.nextT = 3; c.every0 = Math.max(2.0, 3.0 - 0.3 * ((G.run.biome.order || 1) - 1)); c.total = ROOM_COLS * ROOM_ROWS; c.target = Math.round(c.total * 0.55); c.fallen = 0; c.reinforceT = 8; c.reinforceEvery = 9;
    } else if (id === 'switches') {
      c.sw = []; const order = rng.shuffle([0, 1, 2]);

      c.beams = []; c.patId = null; c.patName = ''; c.patBars = 4; c.barAt = 0; c.fade = 1; c.flash = 0;

  }
  /* ---------- « lumières coupées » : motifs de lumière, un seul actif à la fois ----------
     Chaque motif dure quelques mesures puis cède la place au suivant, sur un temps fort. À chaque instant le joueur n'a

    { id: 'chase', name: 'Poursuite', bars: 4, make: () => [{ kind: 'round', r: 185, ...pt(), speed: 2.2, color: '#fff6d8', near: true }] },
    { id: 'fireflies', name: 'Lucioles', bars: 4, make: () => [
      { kind: 'round', r: 84, ...pt(), speed: 6, color: '#9fd8ff', jump: true }, { kind: 'round', r: 84, ...pt(), speed: 6, color: '#ffd166', jump: true }] },   // jump : une destination par temps, atteinte en un temps
    { id: 'sweep', name: 'Balayage', bars: 4, make: () => [{ kind: 'rect', axis: 'v', w: 150, x: ROOM_X + 40, y: 0, speed: 1.2, color: '#c9a3ff', sweep: 1 }] },
    { id: 'cross', name: 'Croix', bars: 4, make: () => [
      { kind: 'rect', axis: 'v', w: 130, x: ROOM_X + ROOM_W * 0.5, y: 0, speed: 2, color: '#c9a3ff' },
      { kind: 'rect', axis: 'h', h: 104, x: 0, y: ROOM_Y + ROOM_H * 0.5, speed: 2, color: '#7fff9a' }] },
    { id: 'mirrorball', name: 'Boule à facettes', bars: 4, make: () => [{ kind: 'mirror', n: 6, r: 46, spin: 0.62, orbit: 210, color: '#ffd166' }] },
    { id: 'strobe', name: 'Stroboscope', bars: 2, make: () => [{ kind: 'strobe', color: '#e8ecf7' }] },

    if (hard.includes(c.patId)) pool = pool.filter(p => !hard.includes(p.id));
    const p = RNG.pick(pool);
    c.patId = p.id; c.patName = p.name; c.patBars = p.bars; c.beams = p.make(); c.barAt = Math.floor(Beat.index() / 4); c.fade = 0;

  function update(room, dt) {

    if (c.id === 'capture') {
      const z = c.zones[c.zi]; const inside = dist(pl.x, pl.y, z.x, z.y) < c.r;
      c.gauge = clamp(c.gauge + (inside ? dt / 6 : -dt / 12), 0, 1);
      c.reinforceT -= dt; if (c.reinforceT <= 0) { c.reinforceT = c.reinforceEvery; spawnReinforcement(3 + Math.floor(RNG() * 2), true); }
      if (c.gauge >= 1) { c.zi++; c.gauge = 0; AudioEngine.roomClear({ intensity: 0.6 }); Particles.spawn(z.x, z.y, { count: 30, color: '#7fff9a', glow: true, speedMax: 300 }); if (c.zi >= c.zones.length) { c.done = true; UI.banner('Zones capturées', '#7fff9a'); room.challengeOk = true; } else UI.banner(`Zone ${c.zi + 1} / 3`, '#7fff9a'); }
      c.hud = `Zone ${Math.min(c.zi + 1, 3)}/3 · ${Math.round(c.gauge * 100)} %`;
    } else if (c.id === 'collapse') {

      for (const [k, until] of c.warn) { if (room.time >= until) { c.warn.delete(k); c.holes.add(k); c.fallen++; const [tx, ty] = k.split(',').map(Number); Particles.spawn(tileX(tx), tileY(ty), { count: 8, color: '#3a3f55', size: 4, speedMax: 90, life: 0.7 }); G.shake = Math.min(6, G.shake + 1.5); } }
      c.nextT -= dt;
      const safe = c.total - c.holes.size - c.warn.size;
      if (c.nextT <= 0 && safe > c.target) { c.nextT = Math.max(1.3, c.every0 - c.t * 0.014); scheduleCluster(room, c); if (c.t > 25 && RNG.chance(0.5)) scheduleCluster(room, c); AudioEngine.trapSpike({ intensity: 0.7 }); }   // accélère avec le temps, parfois deux paquets
      c.reinforceT -= dt; if (c.reinforceT <= 0 && Room.alive() < 5 && !room.waves.every(w => w.done)) { c.reinforceT = c.reinforceEvery; spawnReinforcement(2); }
      /* chutes */
      const tileOf = e => `${Math.floor((e.x - ROOM_X) / TILE)},${Math.floor((e.y - ROOM_Y) / TILE)}`;
      if (!pl.dead && !pl.dashing && c.holes.has(tileOf(pl))) fallPlayer(room, c);
      for (const e of G.enemies) { if (e.dead || e.isBoss || e.state === 'dash' || e.state === 'lunge' || e.state === 'charge') continue; if (c.holes.has(tileOf(e))) { e.xp = Math.round(e.xp * 0.5); e.coins = 0; Floaters.add(e.x, e.y - 10, 'tombé', '#9aa4c4', 12); Combat.killEnemy(e, { silent: true }); } }
      const pct = Math.round(100 * (c.total - c.holes.size) / c.total);
      c.hud = `Sol ${pct} % · tuez les vagues`;
      /* la salle se termine par les vagues, pas par le sol : à la fin, une passerelle se déploie si le chemin vers la porte est coupé */
      if (room.state === 'clear' && !c.done) { c.done = true; room.challengeOk = true; c.warn.clear(); buildPlanks(room, c); UI.banner('Une passerelle se déploie vers la sortie', '#ffb347'); }
    } else if (c.id === 'switches') {
      c.showT -= dt;
      for (const s of c.sw) {
        if (s.on || dist(pl.x, pl.y, s.x, s.y) > 26 + pl.r) continue;
        const expected = c.order[c.step];
        if (c.sw.indexOf(s) === expected) { s.on = true; c.step++; AudioEngine.uiConfirm({}); Particles.spawn(s.x, s.y, { count: 10, color: '#7fff9a', glow: true }); if (c.step >= 3) { c.done = true; room.challengeOk = true; reward(room); } }
        else { c.fails++; for (const q of c.sw) q.on = false; c.step = 0; Combat.hitPlayer(8, { type: 'trap', x: s.x, y: s.y, trapName: 'Décharge' }); G.room.beams.push({ ax: s.x, ay: s.y, bx: pl.x, by: pl.y, t: 0, life: 0.25, color: '#c9a3ff', width: 4, jag: true }); UI.banner('Mauvais ordre', '#ff5e7a'); s.cool = 1; }
      }
      c.hud = `Ordre : ${c.order.map(i => c.sw[i].label).join(' → ')} · ${c.step}/3`;
    } else if (c.id === 'lights') {
      c.t2 += dt;
      if (c.phase === 'lure') {
        c.hud = 'Rejoins le halo';
        if (dist(pl.x, pl.y, c.lure.x, c.lure.y) < c.lure.r * 0.8) {   // le joueur a rejoint la lumière : le spectacle commence
          c.phase = 'show'; nextPattern(c); AudioEngine.bossPhase({ intensity: 0.6 }); UI.banner('Les projecteurs s\'allument', c.def.color, 'Un seul motif de lumière à la fois, il change toutes les quelques mesures. Tuer dans la lumière : +50 % d\'XP.');
        }
      } else {
        c.hud = c.patName || 'Suis la lumière';
        const bar = Beat.crossedFrame(1) && Beat.beatInBar() === 0, beat = Beat.crossedFrame(1), ph2 = Beat.phase();
        /* un seul motif à la fois : il cède la place au suivant sur un temps fort, une fois ses mesures écoulées */

        c.fade = Math.min(1, c.fade + dt * 3);

        const L = Beat.beatLen(), vMax = (pl.stats && pl.stats.speed) || 260;   // toute la chorégraphie se règle sur la vitesse du joueur
        for (const b of c.beams) {
          if (b.kind === 'mirror') { b.a = (b.a || 0) + b.spin * dt * (1 + 0.5 * Math.max(0, 1 - ph2 * 2)); continue; }   // la rotation s'emballe sur le temps

          if (b.sweep) { const u = (b.x - ROOM_X) / ROOM_W; b.x += b.sweep * Math.min(vMax * 0.8, 90 + 150 * Math.sin(Math.PI * clamp(u, 0, 1))) * dt;
            if (b.x > ROOM_X + ROOM_W - 60) { b.x = ROOM_X + ROOM_W - 60; b.sweep = -1; } if (b.x < ROOM_X + 60) { b.x = ROOM_X + 60; b.sweep = 1; } b.tx = b.x; continue; }
          /* Nouvelle destination seulement quand la précédente est atteinte, et toujours sur un temps. La distance est
             bornée par ce que le joueur peut parcourir dans le même temps : avant, la lumière visait n'importe quel point
             de la salle et allait 1,2× à 20× plus vite que lui — impossible à suivre. Les pointes restent (elles couvrent
             la même distance en deux fois moins de temps), mais on peut toujours recoller. */

          if (b.moveK >= 1 && (bar || (beat && b.jump) || (beat && RNG.chance(0.2)))) {
            b.fx = b.x; b.fy = b.y;
            const burst = RNG.chance(0.22);
            const dur = L * (burst || b.jump ? 1 : 2);
            const reach = vMax * (burst ? 1.55 : b.jump ? 1.05 : 0.85) * dur;
            if (b.kind === 'rect') {
              if (b.axis === 'v') b.tx = clamp(b.x + RNG.range(-reach, reach), ROOM_X + 70, ROOM_X + ROOM_W - 70);
              else b.ty = clamp(b.y + RNG.range(-reach, reach), ROOM_Y + 60, ROOM_Y + ROOM_H - 60);
            } else {
              /* le halo « poursuite » revient régulièrement vers le joueur sans le coller : c'est à lui de suivre */
              const a = b.near && RNG.chance(0.5) ? angleTo(b.x, b.y, pl.x, pl.y) + RNG.range(-0.9, 0.9) : RNG.range(0, TAU);
              const d = reach * RNG.range(0.55, 1);
              b.tx = clamp(b.x + Math.cos(a) * d, ROOM_X + 80, ROOM_X + ROOM_W - 80);
              b.ty = clamp(b.y + Math.sin(a) * d, ROOM_Y + 70, ROOM_Y + ROOM_H - 70);

  /* génère un paquet de 2-5 dalles (6 max au biome 2+) qui tomberont, sans couper la salle */

  }
  /* passerelle : plus court chemin du joueur à la porte, les trous traversés redeviennent des planches */
  function buildPlanks(room, c) {

<script>

  load(index) {

  },
  begin() { G.room.state = 'fight'; G.room.stateT = 0; if (G.room.pendingWeaponDrop && G.player.weapon) { G.room.pendingWeaponDrop = false; Pickups.placeWeaponDrop(G.room); } },
  spawnEnemy(def, x, y, opts = {}) {

    if (G.room.tempo) { e.beatLock = true; e.beatDiv = G.room.tempo.div || 1; }   // salle du tempo : frappe sur les temps

  },
  spawnAt(spawn) {

    const def = Content.enemy(spawn.enemy); if (!def) { console.warn('ennemi inconnu', spawn.enemy); return; }

        for (let k = 0; k < 12; k++) { const side = RNG.int(0, 3); x = side === 0 ? ROOM_X + 30 : side === 1 ? ROOM_X + ROOM_W - 30 : RNG.range(ROOM_X + 40, ROOM_X + ROOM_W - 40); y = side === 2 ? ROOM_Y + 30 : side === 3 ? ROOM_Y + ROOM_H - 30 : RNG.range(ROOM_Y + 40, ROOM_Y + ROOM_H - 40); if (dist(x, y, pl.x, pl.y) > 220 && !pointBlocked(x, y, 16)) break; }
      } else { x = tileX(spawn.x) + RNG.range(-20, 20) * (n > 1 ? 1 : 0); y = tileY(spawn.y) + RNG.range(-20, 20) * (n > 1 ? 1 : 0); }
      if (def.archetype === 'swarm') { const g = (def.behavior && def.behavior.groupSize) || 1; for (let j = 0; j < g; j++) { const a = j * TAU / g; Room.spawnEnemy(def, x + Math.cos(a) * 24, y + Math.sin(a) * 24, { elite: spawn.elite }); } }

  },
  spawnBoss(def, x, y) {
    def = def || Content.boss(G.run.biome.miniboss); if (!def) { UI.toast('Mini-boss absent du contenu'); G.room.doorOpen = true; return; }
    if (G.room.boss) return;
    const revenge = G.room.type === 'BOSS_REVENGE';
    const b = new Boss(def, x || ROOM_X + ROOM_W * 0.72, y || ROOM_Y + ROOM_H / 2, { revenge }); G.enemies.push(b); G.room.boss = b;
    UI.banner(b.name, '#ff3b5c', revenge ? 'Il a chargé vos données de consignation.' : (def.subtitle || '')); AudioEngine.bossRoar({});
  },
  onBossDefeated(b) { G.room.bossDead = true; G.run.stats.bossKilled = true; G.shake = 14; UI.banner(Content.pick('bossWin') || 'Étalon neutralisé', '#ffd166'); AudioEngine.roomClear({}); for (let i = 0; i < 12; i++) Pickups.spawn(b.x, b.y, 'coin', 1); },
  alive() { return G.enemies.filter(e => !e.dead).length; },
  update(dt) {
    const r = G.room; const pl = G.player;
    r.time += dt; r.stateT += dt;
    if (r.combo > 0 && Time.now > r.comboUntil) r.combo = 0;
    if (r.state === 'intro') { if (r.stateT >= 0.8) Room.begin(); return; }
    /* vagues */
    if (r.state === 'fight') {
      const alive = Room.alive();
      for (const w of r.waves) {
        if (w.done) continue;
        const trig = w.at === 'start' ? r.stateT >= 0 : w.at === 'clear' ? (alive === 0 && r.wavesStarted && r.lastWaveT < r.stateT - 0.5) : typeof w.at === 'number' ? r.stateT >= w.at : false;
        if (trig && (!r.tempo || Tempo.waveGate(r)) && Challenge.waveGate(r)) { w.done = true; if (r.wavesStarted && r.tempo) Tempo.onWave(r); r.wavesStarted = true; r.lastWaveT = r.stateT; for (const s of w.spawns) Room.spawnAt(s); if (w.at !== 'start') { UI.banner(STR.wave + ' ' + (++r.waveIdx + 1), '#ff6b6b'); } else r.waveIdx = 0; break; }
      }

      /* condition de fin */
      const allWaves = r.waves.every(w => w.done);
      const ch = r.challenge; const holdsDoor = ch && !ch.done && (ch.id === 'capture' || ch.id === 'switches');   // zones à prendre / interrupteurs : la porte attend, en plus des vagues
      if (r.type === 'CHEST' || r.type === 'CHEST_FINAL') { /* fin par interaction */ }
      else if (r.type === 'TRAP') { /* porte ouverte dès le début (sauf effondrement) */ }
      else if (r.type === 'MINIBOSS' || r.type === 'BOSS_REVENGE') { if (r.bossDead && Room.alive() === 0) Room.clear(); }
      else if (!holdsDoor && allWaves && Room.alive() === 0 && r.wavesStarted) Room.clear();
    }
    /* coffre */
    if (r.chest && !r.chest.opened) { const near = dist(pl.x, pl.y, r.chest.x, r.chest.y) < r.chest.r + pl.r + 16; r.chest.near = near; if (near && (Input.wasPressed('interact') || (pl.bot && r.stateT > 1))) Run.openChest(); }
    /* porte */
    if (r.doorOpen && !pl.dead) { const dx = ROOM_X + ROOM_W, dy = ROOM_Y + ROOM_H / 2; if (pl.x > dx - pl.r - 26 && Math.abs(pl.y - dy) < TILE * 0.9) Run.nextRoom(); }
    /* défi */
    if (r.challenge) Challenge.update(r, dt);

    if (r.tempo) Tempo.update(r, dt);

    for (const t of r.traps) t.update(dt, Room.trapTime(r, t));
    /* salles modulaires (phase 2) : Modular.update(r, dt) déplacera les obstacles et recalculera px/py */
    if (r.modular.length) Modular.update(r, dt);
    /* zones de dégâts (traînées de feu, gaz du joueur…) */
    for (let i = r.hazards.length - 1; i >= 0; i--) {
      const h = r.hazards[i]; if (Time.now > h.until) { r.hazards.splice(i, 1); continue; }
      if (h.owner === 'enemy') {
        /* zone posée par un boss : mine qui saute à l'heure dite, ou ronces qui blessent et ralentissent tant qu'on reste dedans */
        if (h.boomAt && Time.now >= h.boomAt) { h.boomAt = 0; h.until = 0; Combat.explosion(h.x, h.y, h.r, Math.round((h.damage || 24) * G.difficulty.damageMul), h.color, false); continue; }
        if (h.dps && !pl.dead && dist(h.x, h.y, pl.x, pl.y) < h.r) {
          if (h.slow) pl.gasSlowUntil = Time.now + 0.1;
          const last = h.cd.get('pl') || -9; if (Time.now - last >= 0.5) { h.cd.set('pl', Time.now); Combat.hitPlayer(Math.round(h.dps * 0.5 * G.difficulty.damageMul), { type: 'trap', x: h.x, y: h.y, trapName: 'Ronces' }); }
        }
        continue;
      }
      if (h.owner === 'player') for (const e of G.enemies) { if (e.dead || dist(h.x, h.y, e.x, e.y) > h.r + e.r) continue; const last = h.cd.get(e) || -9; if (Time.now - last < 0.25) continue; h.cd.set(e, Time.now); Combat.hitEnemy(e, h.dps * 0.25, { dot: true, x: e.x, y: e.y }); }
    }

    for (let i = r.turrets.length - 1; i >= 0; i--) { const t = r.turrets[i]; if (Time.now > t.until) { r.turrets.splice(i, 1); continue; } if (t.mobile) { const d = dist(t.x, t.y, pl.x, pl.y); if (d > 90) { const a = angleTo(t.x, t.y, pl.x, pl.y); t.x += Math.cos(a) * 220 * dt; t.y += Math.sin(a) * 220 * dt; } t.r = 12; resolveRoomCollision(t); } t.cd -= dt; if (t.cd <= 0) { const e = nearestEnemy(t.x, t.y, t.range); if (e) { t.cd = 1 / t.rate; const a = angleTo(t.x, t.y, e.x, e.y); Projectiles.spawn({ x: t.x, y: t.y, vx: Math.cos(a) * 560, vy: Math.sin(a) * 560, r: 4, damage: t.damage, owner: 'player', life: 1.2, color: '#9ff', knockback: 0.3 }); } } }
    /* leurres */
    for (let i = r.decoys.length - 1; i >= 0; i--) { const d = r.decoys[i]; if (Time.now > d.until || d.hp <= 0) { if (d.explode) Combat.explosion(d.x, d.y, 110, 40 * pl.stats.damage, '#c9a3ff', true); r.decoys.splice(i, 1); } }
    /* cosmétique */
    const tick = a => { for (let i = a.length - 1; i >= 0; i--) { a[i].t += dt; if (a[i].t > a[i].life) a.splice(i, 1); } };

  },
  /* Habillage d'une salle : donne un accessoire du biome aux obstacles qui n'en ont pas (`kind`) et sème du décor au sol.
     Déterministe (graine du sol) : la même salle est toujours habillée pareil. Le décor n'a aucune collision. */
  DRESS: {
    biome_1: { blocks: ['tank', 'fuel', 'locker', 'pipe', 'drip', 'microscope', 'bin'], deco: ['cross', 'hazard', 'fan', 'valve', 'cog', 'battery', 'tubes', 'pack', 'bin'] },
    biome_2: { blocks: ['planter', 'bush', 'roots', 'trap_plant', 'flask', 'fountain'], deco: ['leaf', 'mushrooms', 'mushroom', 'seedling', 'sprout', 'roots', 'flower', 'pot'] },
    biome_3: { blocks: ['cactus', 'rock', 'barrel', 'crate', 'wagon', 'cart'], deco: ['skull', 'tumbleweed', 'rails', 'wanted'] },
    biome_4: { blocks: ['column', 'jar', 'vase', 'basin', 'palm', 'basket', 'brazier', 'drapes'], deco: ['lamp', 'lantern', 'spices', 'teapot', 'gems', 'scarab', 'eye', 'carpet', 'incense', 'chalice'] },
  },
  dress(r) {
    if (r.dressed) return; r.dressed = true;
    const set = Room.DRESS[(G.run && G.run.biome && G.run.biome.id) || 'biome_1']; if (!set) return;
    const rng = makeRng(r.floorSeed ^ 0x9e37);
    for (let i = 0; i < r.obstacles.length; i++) { const o = r.obstacles[i]; if (o.terrain) continue; if (!o.kind) o.kind = set.blocks[Math.floor(rng() * set.blocks.length)]; }   // le terrain a déjà son rendu : pas de cactus dans un muret

    const taken = t => r.obstacles.some(o => t.x >= o.x - 1 && t.x <= o.x + o.w && t.y >= o.y - 1 && t.y <= o.y + o.h);
    const door = t => t.x >= ROOM_COLS - 2 && Math.abs(t.y - Math.floor(ROOM_ROWS / 2)) <= 1;

      const t = { x: 3 + Math.floor(rng() * (ROOM_COLS - 5)), y: Math.floor(rng() * ROOM_ROWS) };
      if (taken(t) || door(t) || r.deco.some(d => Math.abs(d.x - t.x) < 3 && Math.abs(d.y - t.y) < 2)) continue;
      if (r.grid && !Terrain.plain(t.x, t.y, r)) continue;   // pas de tapis au fond du bassin ni de plante sur un pont

    }
  },
  /* horloge des pièges : temps musical dans la salle du tempo, temps de salle ailleurs */
  /* Horloge d'un piège : musicale s'il déclare une cadence en temps (`params.beats`), horloge de salle sinon.
     C'était décidé par salle : un piège rythmique posé hors de la salle du tempo tournait à la bonne vitesse mais
     sur une phase sans rapport avec la musique — donc seule la salle 7 jouait en mesure. */
  trapTime(r, t) { return (t ? t.beats : r.tempo && r.tempo.syncTraps) ? Beat.t : r.time; },
  clear() {
    const r = G.room; if (r.state === 'clear') return; r.state = 'clear'; r.stateT = 0;
    if (r.tempo) { Tempo.onClear(r); return; }   // porte sur la mesure suivante
    r.doorOpen = true; AudioEngine.roomClear({}); UI.banner('Salle sécurisée — sortie ouverte', '#7fff9a'); Music.calm();

  /* score de la salle courante */
  score() { const r = G.room; return Progression.roomScore({ hits: r.hits, time: r.time, refTime: r.refTime, bestCombo: r.bestCombo, comboTarget: r.comboTarget, died: r.died, fragments: r.fragments, fragmentsTotal: r.fragmentsDef.length }); },
  /* danger pour le bot */
  dangerAt(x, y) { let d = 0; const r = G.room; for (const t of r.traps) d = Math.max(d, t.dangerAt(x, y, Room.trapTime(r, t))); if (r.modular.length) d = Math.max(d, Modular.dangerAt(x, y, r)); if (r.challenge) d = Math.max(d, Challenge.dangerAt(x, y, r)); return d; },

  render(ctx) {
